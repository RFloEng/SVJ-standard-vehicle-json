});


/* ═══════════════════════════════════════════════════
   EDITOR ENGINE
   ═══════════════════════════════════════════════════ */
const changeLog = [];  // [{path, oldVal, newVal, timestamp}]

function setDeep(obj, path, value) {
  const keys = path.split('.');
  let cur = obj;
  for(let i = 0; i < keys.length - 1; i++) {
    const k = isNaN(keys[i]) ? keys[i] : parseInt(keys[i]);
    if(cur[k] === undefined) cur[k] = {};
    cur = cur[k];
  }
  const lastKey = isNaN(keys[keys.length-1]) ? keys[keys.length-1] : parseInt(keys[keys.length-1]);
  cur[lastKey] = value;
}

function getDeep(obj, path) {
  const keys = path.split('.');
  let cur = obj;
  for(const k of keys) {
    const key = isNaN(k) ? k : parseInt(k);
    if(cur === undefined || cur === null) return undefined;
    cur = cur[key];
  }
  return cur;
}

function applyEdit(path, newVal) {
  const oldVal = getDeep(DATA, path);
  if(oldVal === newVal) return;
  changeLog.push({path, oldVal, newVal, timestamp: Date.now()});
  setDeep(DATA, path, newVal);
  updateSaveBar();
}

function undoLast() {
  if(!changeLog.length) return;
  const last = changeLog.pop();
  setDeep(DATA, last.path, last.oldVal);
  updateSaveBar();
  renderPanel();
  // Rebuild 3D if geometry changed
  if(last.path.includes('hardpoint') || last.path.includes('position') || last.path.includes('inboard') || last.path.includes('center_of_gravity')) {
    buildScene(); setupControls(); buildLayerUI();
  }
}

function discardAll() {
  if(!changeLog.length) return;
  if(!confirm('Discard all ' + changeLog.length + ' changes?')) return;
  // Undo all in reverse
  while(changeLog.length) {
    const c = changeLog.pop();
    setDeep(DATA, c.path, c.oldVal);
  }
  updateSaveBar();
  renderPanel();
  buildScene(); setupControls(); buildLayerUI();
}

function updateSaveBar() {
  const bar = document.getElementById('save-bar');
  const count = document.getElementById('changes-count');
  if(changeLog.length > 0) {
    bar.classList.add('show');
    count.textContent = changeLog.length + ' change' + (changeLog.length>1?'s':'');
  } else {
    bar.classList.remove('show');
  }
}

function saveFile() {
  const json = JSON.stringify(DATA, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const baseName = document.getElementById('file-name').textContent.replace(/\s*\(.*\)/, '').replace(/\.svj\.json$|\.json$/, '') || 'vehicle';
  const chosen = prompt('Save as:', baseName + '.svj.json');
  if(!chosen) { URL.revokeObjectURL(url); return; }
  a.href = url;
  a.download = chosen.endsWith('.json') ? chosen : chosen + '.svj.json';
  a.click();
  URL.revokeObjectURL(url);
  // Mark as saved
  changeLog.length = 0;
  updateSaveBar();
}

// Ctrl+S handler
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    if(changeLog.length) saveFile();
  }
  if((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    undoLast();
  }
});

document.getElementById('btn-save').addEventListener('click', saveFile);
document.getElementById('btn-undo').addEventListener('click', undoLast);
document.getElementById('btn-discard').addEventListener('click', discardAll);

/* ═══════════════════════════════════════════════════
   EDITABLE FIELD GENERATORS
   ═══════════════════════════════════════════════════ */
// Editable stat box
function editStat(label, path, unit='', decimals=3, color='') {
  const val = getDeep(DATA, path);
  const isChanged = changeLog.some(c => c.path === path);
  const displayVal = val != null ? (typeof val === 'number' ? val.toFixed(decimals) : val) : '—';
  const id = 'edit-' + path.replace(/\./g, '-');
  return '<div class="stat-box"><div class="stat-label">' + label + '</div>' +
    '<div class="stat-value editable' + (isChanged?' changed':'') + '" ' +
    'id="' + id + '" data-path="' + path + '" data-type="number" data-decimals="' + decimals + '" ' +
    (color ? 'style="color:' + color + '"' : '') + '>' +
    displayVal + '<span class="stat-unit">' + unit + '</span></div></div>';
}

// Editable KV row
function editKV(label, path, decimals=4) {
  const val = getDeep(DATA, path);
  const isChanged = changeLog.some(c => c.path === path);
  const displayVal = val != null ? (typeof val === 'number' ? val.toFixed(decimals).replace(/\.?0+$/, '') : String(val)) : '—';
  return '<div class="kv-row"><span class="kv-key">' + label + '</span>' +
    '<span class="kv-val editable' + (isChanged?' changed':'') + '" data-path="' + path + '" data-type="' + (typeof val) + '">' +
    displayVal + '</span></div>';
}

// Hardpoint editor grid for a suspension corner
function hardpointEditor(corner) {
  const hp = getDeep(DATA, 'suspension.' + corner + '.topology.upright.hardpoints') || {};
  const links = getDeep(DATA, 'suspension.' + corner + '.topology.links') || [];
  let h = '<div class="hp-editor">';
  h += '<div class="hp-row" style="border:none"><div class="hp-name" style="font-weight:700;color:var(--ac)">Point</div><div class="axis-label" style="color:var(--rd)">X (fwd)</div><div class="axis-label" style="color:var(--gn)">Y (right)</div><div class="axis-label" style="color:var(--bl)">Z (down)</div></div>';
  
  // Outboard hardpoints
  Object.keys(hp).forEach(name => {
    const basePath = 'suspension.' + corner + '.topology.upright.hardpoints.' + name;
    h += '<div class="hp-row"><div class="hp-name" title="' + name + '">' + name.replace(/_/g,' ') + '</div>';
    for(let i = 0; i < 3; i++) {
      const p = basePath + '.' + i;
      const v = getDeep(DATA, p);
      const isChanged = changeLog.some(c => c.path === p);
      h += '<input class="hp-coord' + (isChanged?' changed':'') + '" type="number" step="0.001" value="' + (v!=null?v.toFixed(4):'') + '" data-path="' + p + '" />';
    }
    h += '</div>';
  });
  
  // Inboard points from links
  links.forEach((link, li) => {
    (link.inboard_points||[]).forEach((pt, pi) => {
      const basePath = 'suspension.' + corner + '.topology.links.' + li + '.inboard_points.' + pi;
      h += '<div class="hp-row"><div class="hp-name" title="' + link.name + ' ib' + pi + '" style="color:var(--pr)">' + link.name.replace(/_/g,' ') + ' ib' + pi + '</div>';
      for(let i = 0; i < 3; i++) {
        const p = basePath + '.' + i;
        const v = getDeep(DATA, p);
        const isChanged = changeLog.some(c => c.path === p);
        h += '<input class="hp-coord' + (isChanged?' changed':'') + '" type="number" step="0.001" value="' + (v!=null?v.toFixed(4):'') + '" data-path="' + p + '" />';
      }
      h += '</div>';
    });
  });
  
  // Spring/damper mounts
  ['spring.inboard_mount','spring.outboard_mount','damper.inboard_mount','damper.outboard_mount'].forEach(sub => {
    const val = getDeep(DATA, 'suspension.' + corner + '.' + sub);
    if(!val) return;
    const basePath = 'suspension.' + corner + '.' + sub;
    h += '<div class="hp-row"><div class="hp-name" style="color:var(--gn)">' + sub.replace(/\./g,' ').replace(/_/g,' ') + '</div>';
    for(let i = 0; i < 3; i++) {
      const p = basePath + '.' + i;
      const v = getDeep(DATA, p);
      const isChanged = changeLog.some(c => c.path === p);
      h += '<input class="hp-coord' + (isChanged?' changed':'') + '" type="number" step="0.001" value="' + (v!=null?v.toFixed(4):'') + '" data-path="' + p + '" />';
    }
    h += '</div>';
  });
  
  h += '</div>';
  return h;
}

// Attach click-to-edit on .editable elements
function attachEditors(container) {
  container = container || document;
  
  // Inline text editing
  container.querySelectorAll('.editable').forEach(el => {
    if(el.dataset.bound) return;
    el.dataset.bound = '1';
    el.addEventListener('dblclick', () => {
      const path = el.dataset.path;
      const type = el.dataset.type || 'number';
      const currentVal = getDeep(DATA, path);
      const input = document.createElement('input');
      input.className = 'edit-input';
      input.type = type === 'number' ? 'number' : 'text';
      input.step = 'any';
      input.value = currentVal != null ? currentVal : '';
      el.textContent = '';
      el.appendChild(input);
      input.focus();
      input.select();
      
      const commit = () => {
        let val = input.value;
        if(type === 'number') val = parseFloat(val);
        if(val !== '' && !isNaN(val)) {
          applyEdit(path, val);
        }
        renderPanel();
        // Rebuild 3D if needed
        if(path.includes('center_of_gravity') || path.includes('mass_total') || path.includes('wheelbase') || path.includes('track_') || path.includes('wheel.') || path.includes('brake.disc')) {
          buildScene(); setupControls(); buildLayerUI();
        }
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', e => {
        if(e.key === 'Enter') commit();
        if(e.key === 'Escape') { renderPanel(); }
      });
    });
  });
  
  // Hardpoint coordinate inputs
  container.querySelectorAll('.hp-coord').forEach(input => {
    if(input.dataset.bound) return;
    input.dataset.bound = '1';
    let origVal = input.value;
    
    input.addEventListener('change', () => {
      const path = input.dataset.path;
      const newVal = parseFloat(input.value);
      if(!isNaN(newVal)) {
        applyEdit(path, newVal);
        input.classList.toggle('changed', true);
        // Rebuild 3D
        buildScene(); setupControls(); buildLayerUI();
      }
    });
    
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter') input.blur();
      if(e.key === 'Escape') { input.value = origVal; input.blur(); }
    });
  });
}

// Override renderPanel to attach editors after render
const _origRenderPanel = renderPanel;

/* ═══════════════════════════════════════════════════
   STEP EXPORTER  (ISO 10303-21 / AP203 wireframe)
   Extracts suspension geometry as points + lines
   Coordinates in mm, SAE J670 axis convention
   ═══════════════════════════════════════════════════ */
window.exportSTEP = function() {
  const data = DATA;
  if(!data) { alert('No data loaded'); return; }

  let eid = 0;
  const ne = () => '#' + (++eid);
  const lines = [];
  const push = s => lines.push(s);

  const pts = new Map();
  function cpt(coord, label) {
    if(!coord || coord.length < 3) return null;
    const mm = coord.map(v => (v * 1000).toFixed(4));
    const key = mm.join(',');
    if(pts.has(key)) return pts.get(key);
    const id = ne();
    push(id + "=CARTESIAN_POINT('" + (label||'') + "',(" + mm.join(',') + "));");
    pts.set(key, id);
    return id;
  }

  const polylines = [];
  function seg(p1Id, p2Id, label) {
    if(!p1Id || !p2Id || p1Id === p2Id) return null;
    const id = ne();
    push(id + "=POLYLINE('" + (label||'') + "',(" + p1Id + "," + p2Id + "));");
    polylines.push(id);
    return id;
  }

  // CG
  const ch = data.chassis || {};
  if(ch.center_of_gravity) cpt(ch.center_of_gravity, 'CG');

  // Aero CoP
  if(data.aerodynamics && data.aerodynamics.center_of_pressure)
    cpt(data.aerodynamics.center_of_pressure, 'Aero_CoP');

  // Steering rack
  const st = data.steering;
  if(st && st.rack_position) {
    const rId = cpt(st.rack_position, 'steering_rack');
    if(st.tie_rod_inboard) {
      ['left','right'].forEach(function(side) {
        const c = st.tie_rod_inboard[side];
        if(c) { const tId = cpt(c, 'tie_rod_inboard_' + side); seg(rId, tId, 'rack_to_tie_rod_' + side); }
      });
    }
  }

  // Suspension corners
  ['FL','FR','RL','RR'].forEach(function(cn) {
    const corn = data.suspension ? data.suspension[cn] : null;
    if(!corn || !corn.topology) return;
    const hp = (corn.topology.upright && corn.topology.upright.hardpoints) || {};
    const lnks = corn.topology.links || [];

    const hpIds = {};
    Object.entries(hp).forEach(function(pair) {
      hpIds[pair[0]] = cpt(pair[1], cn + '_' + pair[0]);
    });

    lnks.forEach(function(link) {
      const ref = (link.outboard_ref || '').replace('hardpoints.', '');
      const obId = hpIds[ref];
      if(!obId) return;
      (link.inboard_points || []).forEach(function(ip, i) {
        const ibId = cpt(ip, cn + '_' + link.name + '_ib' + i);
        seg(ibId, obId, cn + '_' + link.name + (i > 0 ? '_' + i : ''));
      });
    });

    var sp2 = corn.spring;
    if(sp2 && sp2.inboard_mount && sp2.outboard_mount) {
      var siId = cpt(sp2.inboard_mount, cn + '_spring_top');
      var soId = cpt(sp2.outboard_mount, cn + '_spring_btm');
      seg(siId, soId, cn + '_spring');
    }

    var dm2 = corn.damper;
    if(dm2 && dm2.inboard_mount && dm2.outboard_mount) {
      var diId = cpt(dm2.inboard_mount, cn + '_damper_top');
      var doId = cpt(dm2.outboard_mount, cn + '_damper_btm');
      seg(diId, doId, cn + '_damper');
    }

    if(hpIds.wheel_center && hpIds.upper_ball_joint)
      seg(hpIds.wheel_center, hpIds.upper_ball_joint, cn + '_kingpin_upper');
    if(hpIds.wheel_center && hpIds.lower_ball_joint)
      seg(hpIds.wheel_center, hpIds.lower_ball_joint, cn + '_kingpin_lower');

    if(hpIds.steering_tie_rod_end && st && st.tie_rod_inboard) {
      var side = cn.endsWith('L') ? 'left' : 'right';
      var inb = st.tie_rod_inboard[side];
      if(inb) { var ibId2 = cpt(inb, cn + '_tie_rod_inboard'); seg(ibId2, hpIds.steering_tie_rod_end, cn + '_tie_rod'); }
    }

    if(hpIds.toe_link_end) {
      var tl = lnks.find(function(l){ return l.name === 'toe_link'; });
      if(tl && tl.inboard_points && tl.inboard_points[0]) {
        var tId = cpt(tl.inboard_points[0], cn + '_toe_link_ib');
        seg(tId, hpIds.toe_link_end, cn + '_toe_link');
      }
    }
  });

  // Drivetrain
  var pt2 = data.powertrain;
  if(pt2) {
    if(pt2.engine && pt2.engine.position) cpt(pt2.engine.position, 'engine');
    if(pt2.gearbox && pt2.gearbox.position) cpt(pt2.gearbox.position, 'gearbox');
    if(pt2.clutch && pt2.clutch.position) cpt(pt2.clutch.position, 'clutch');

    (pt2.driveshafts || []).forEach(function(ds) {
      var fj = ds.joint_front ? ds.joint_front.position : null;
      var rj = ds.joint_rear ? ds.joint_rear.position : null;
      if(fj && rj) { var fjId = cpt(fj, ds.id + '_front'); var rjId = cpt(rj, ds.id + '_rear'); seg(fjId, rjId, ds.id); }
    });

    (pt2.differentials || []).forEach(function(df) {
      if(!df.position) return;
      var dId = cpt(df.position, df.id);
      [['output_left', df.output_left], ['output_right', df.output_right]].forEach(function(pair) {
        if(pair[1]) { var oId = cpt(pair[1], df.id + '_' + pair[0]); seg(dId, oId, df.id + '_' + pair[0]); }
      });
    });

    if(pt2.half_shafts) Object.entries(pt2.half_shafts).forEach(function(pair) {
      var side = pair[0], hs = pair[1];
      var ci = hs.cv_inner ? hs.cv_inner.position : null;
      var co = hs.cv_outer ? hs.cv_outer.position : null;
      if(ci && co) { var ciId = cpt(ci, 'halfshaft_' + side + '_inner'); var coId = cpt(co, 'halfshaft_' + side + '_outer'); seg(ciId, coId, 'halfshaft_' + side); }
    });
  }

  // GEOMETRIC_CURVE_SET
  var allPtIds = Array.from(pts.values());
  var members = allPtIds.concat(polylines).join(',');
  var gcsId = ne();
  push(gcsId + "=GEOMETRIC_CURVE_SET('SVJ_Suspension',(" + members + "));");

  // Representation context (mm, radians)
  var mmId = ne(); push(mmId + "=(LENGTH_UNIT()NAMED_UNIT(*)SI_UNIT(.MILLI.,.METRE.));");
  var radId = ne(); push(radId + "=(NAMED_UNIT(*)PLANE_ANGLE_UNIT()SI_UNIT($,.RADIAN.));");
  var srId = ne(); push(srId + "=(NAMED_UNIT(*)SI_UNIT($,.STERADIAN.)SOLID_ANGLE_UNIT());");
  var uncId = ne(); push(uncId + "=UNCERTAINTY_MEASURE_WITH_UNIT(LENGTH_MEASURE(0.01)," + mmId + ",'distance accuracy');");
  var ctxId = ne();
  push(ctxId + "=(GEOMETRIC_REPRESENTATION_CONTEXT(3)GLOBAL_UNCERTAINTY_ASSIGNED_CONTEXT((" + uncId + "))GLOBAL_UNIT_ASSIGNED_CONTEXT((" + mmId + "," + radId + "," + srId + "))REPRESENTATION_CONTEXT('Context3D',''));");

  var srep = ne();
  push(srep + "=GEOMETRICALLY_BOUNDED_WIREFRAME_SHAPE_REPRESENTATION('SVJ_Suspension_Geometry',(" + gcsId + ")," + ctxId + ");");

  var appCtx = ne(); push(appCtx + "=APPLICATION_CONTEXT('automotive design');");
  var prodCtx = ne(); push(prodCtx + "=PRODUCT_CONTEXT(''," + appCtx + ",'mechanical');");
  var vi = data.vehicle_info || {};
  var prodName = [vi.make, vi.model, vi.year, vi.variant].filter(Boolean).join(' ') || 'SVJ Vehicle';
  var safeName = prodName.replace(/'/g, '');
  var prod = ne(); push(prod + "=PRODUCT('" + safeName + "','" + safeName + "','',(" + prodCtx + "));");
  var pdf2 = ne(); push(pdf2 + "=PRODUCT_DEFINITION_FORMATION('',''," + prod + ");");
  var pdCtx = ne(); push(pdCtx + "=PRODUCT_DEFINITION_CONTEXT('part definition'," + appCtx + ",'design');");
  var pd = ne(); push(pd + "=PRODUCT_DEFINITION('design',''," + pdf2 + "," + pdCtx + ");");
  var pds = ne(); push(pds + "=PRODUCT_DEFINITION_SHAPE('',''," + pd + ");");
  var sdr = ne(); push(sdr + "=SHAPE_DEFINITION_REPRESENTATION(" + pds + "," + srep + ");");

  // Assemble file
  var now = new Date().toISOString().replace(/[-:]/g, '').split('.')[0];
  var safeFile = prodName.replace(/[^a-zA-Z0-9_ -]/g, '');
  var header = [
    "ISO-10303-21;",
    "HEADER;",
    "FILE_DESCRIPTION(('SVJ Suspension Geometry Export'),'2;1');",
    "FILE_NAME('" + safeFile + ".step','" + now + "',('SVJ Viewer'),(''),'',' ','');",
    "FILE_SCHEMA(('AUTOMOTIVE_DESIGN { 1 0 10303 214 1 1 1 1 }'));",
    "ENDSEC;",
    "DATA;"
  ];
  var footer = ["ENDSEC;", "END-ISO-10303-21;"];
  var full = header.concat(lines).concat(footer).join('\n');

  // Download with filename prompt
  var defaultName = (prodName.replace(/[^a-zA-Z0-9_-]/g, '_') || 'svj_suspension') + '.step';
  var chosen = prompt('Save STEP file as:', defaultName);
  if(!chosen) return;
  var fileName = (chosen.endsWith('.step') || chosen.endsWith('.stp')) ? chosen : chosen + '.step';
  var blob = new Blob([full], {type: 'application/step'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

// Boot
loadData(DEMO);
animate();
</script>

    <button class="btn-undo" id="btn-undo" title="Undo last change">↶ Undo</button>
