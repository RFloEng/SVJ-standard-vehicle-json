  `<div style="display:flex;align-items:center;gap:5px;padding:3px 0;margin-top:2px;border-top:1px solid var(--brd)20">
     <span style="font-size:8px;color:var(--txM);font-family:JetBrains Mono,monospace;white-space:nowrap">Opacity</span>
     <input type="range" min="0" max="1" step="0.01" value="${meshOpacity}"
       oninput="setMeshOpacity(this.value)"
       style="flex:1;accent-color:var(--pr);height:3px;cursor:pointer">
     <span id="mesh-opacity-lbl" style="font-size:8px;color:var(--txD);font-family:JetBrains Mono,monospace;min-width:28px;text-align:right">${Math.round(meshOpacity*100)}%</span>
   </div>`;
  const lt=document.getElementById('lift-toggle');
  if(lt) lt.addEventListener('click', ()=>{ liftRaised=!liftRaised; buildScene(); setupControls(); buildLayerUI(); });
  list.querySelectorAll('.layer-row[data-layer]').forEach(row => {
    row.addEventListener('click', ()=>{
      const k=row.dataset.layer; layers[k]=!layers[k]; buildLayerUI(); applyLayers();
    });
  });

  const cbtns = document.getElementById('corner-btns');
  cbtns.innerHTML = cornerDefs.map(c =>
    `<button class="corner-btn ${highlightCorner===c.key?'active':''}" data-corner="${c.key||''}" style="${highlightCorner===c.key?`border-color:${c.color||'var(--ac)'};background:${(c.color||'var(--ac)')}22;color:${c.color||'var(--ac)'};font-weight:700`:``}">${c.label}</button>`
  ).join('');
  cbtns.querySelectorAll('.corner-btn').forEach(btn => {
    btn.addEventListener('click', ()=>{
      highlightCorner = btn.dataset.corner||null; buildLayerUI(); applyCornerHighlight();
    });
  });
}

/* ═══════════════════════════════════════════════════
   MESH TRANSFORM  (select → gizmo → save to SVJ)
   ═══════════════════════════════════════════════════ */

function applyStoredTransform(obj, meshId) {
  const meshList = DATA?.assets?.meshes;
  if (!meshList) return;
  const entry = meshList.find(m => m.id === meshId);
  const xf = entry?.x_transform;
  if (!xf) return;
  if (xf.position) obj.position.set(...xf.position);
  if (xf.rotation) obj.rotation.set(...xf.rotation);
  if (xf.scale)    obj.scale.set(...xf.scale);
}

/* ═══════════════════════════════════════════════════
   POSES  (spec §24): forward kinematics of constraints[], animation of bound
   parts, per-pose CG / inertia / element lengths. Mirrors tools/constraints_check.py.
   ═══════════════════════════════════════════════════ */
const POSE_DOF = {revolute:1, translational:1, cylindrical:2, spherical:3, universal:2, planar:3, fixed:0};
const POSE_ROOTS = ['chassis', 'ground'];
const SAE_TO_THREE = [[0,1,0],[0,0,-1],[-1,0,0]];     // three = (y, -z, -x)

let poseState = {id: null, values: {}};     // values: jointId -> [coordinates]
let posedObjects = [];                      // {obj, bodyId, base:Matrix4}: procedural objects that follow a body
let artic = null;                           // articulation helpers {elems:[{c,line,ends:[mesh,mesh]}], cg}
let poseTween = null;

// 3x3 helpers (row-major arrays)
const mm3 = (a,b) => a.map(r => [0,1,2].map(j => r[0]*b[0][j] + r[1]*b[1][j] + r[2]*b[2][j]));
const mv3 = (a,v) => a.map(r => r[0]*v[0] + r[1]*v[1] + r[2]*v[2]);
const tr3 = a => [0,1,2].map(i => [a[0][i], a[1][i], a[2][i]]);
const add3 = (a,b) => a.map((x,i) => x + b[i]);
const sub3 = (a,b) => a.map((x,i) => x - b[i]);
const I3 = () => [[1,0,0],[0,1,0],[0,0,1]];
const xId = () => ({R:I3(), t:[0,0,0]});
const xCompose = (a,b) => ({R:mm3(a.R,b.R), t:add3(mv3(a.R,b.t), a.t)});
const xApply = (x,p) => add3(mv3(x.R,p), x.t);
const xIsId = (x, e=1e-12) => x.R.every((r,i) => r.every((v,j) => Math.abs(v - (i===j?1:0)) < e)) && x.t.every(v => Math.abs(v) < e);

function quatMat(q){
  let [x,y,z,w] = q; const n = Math.hypot(x,y,z,w) || 1; x/=n; y/=n; z/=n; w/=n;
  return [[1-2*(y*y+z*z), 2*(x*y-z*w), 2*(x*z+y*w)],
          [2*(x*y+z*w), 1-2*(x*x+z*z), 2*(y*z-x*w)],
          [2*(x*z-y*w), 2*(y*z+x*w), 1-2*(x*x+y*y)]];
}
function rotAxis(u, ang){
  const n = Math.hypot(...u); if(!n || !ang) return I3();
  const [ux,uy,uz] = u.map(c => c/n), c = Math.cos(ang), s = Math.sin(ang), k = 1-c;
  return [[c+ux*ux*k, ux*uy*k-uz*s, ux*uz*k+uy*s],
          [uy*ux*k+uz*s, c+uy*uy*k, uy*uz*k-ux*s],
          [uz*ux*k-uy*s, uz*uy*k+ux*s, c+uz*uz*k]];
}

const poseBodies = d => Object.fromEntries(((d?.chassis?.mass_bodies)||[]).filter(b => b && b.id != null).map(b => [b.id, b]));
function poseMarker(d, bodyId, name){
  const src = bodyId === 'chassis' ? d?.chassis?.markers : bodyId === 'ground' ? null : poseBodies(d)[bodyId]?.markers;
  const m = src && src[name];
  return m && Array.isArray(m.position) ? m : null;
}
function poseFrame(d, c, side){
  const fr = c['frame_'+side];
  if(fr && Array.isArray(fr.position)) return {p:fr.position, q:fr.orientation || [0,0,0,1]};
  const name = c['marker_'+side];
  if(name != null){ const m = poseMarker(d, c['body_'+side], name); if(m) return {p:m.position, q:m.orientation || [0,0,0,1]}; }
  return null;
}
function localMotion(jt, q0){
  const q = q0.slice(); while(q.length < (POSE_DOF[jt]||0)) q.push(0);
  switch(jt){
    case 'revolute': return {R:rotAxis([0,0,1], q[0]), t:[0,0,0]};
    case 'translational': return {R:I3(), t:[0,0,q[0]]};
    case 'cylindrical': return {R:rotAxis([0,0,1], q[0]), t:[0,0,q[1]]};
    case 'spherical': { const a = Math.hypot(q[0],q[1],q[2]); return {R:a ? rotAxis(q.slice(0,3), a) : I3(), t:[0,0,0]}; }
    case 'universal': return {R:mm3(rotAxis([0,1,0], q[1]), rotAxis([1,0,0], q[0])), t:[0,0,0]};
    case 'planar': return {R:rotAxis([0,0,1], q[2]), t:[q[0], q[1], 0]};
    default: return xId();
  }
}
function worldMotion(fr, jt, q){
  if(!q.some(v => Math.abs(v) > 0)) return xId();            // zero coordinates: exactly the reference pose
  const rm = quatMat(fr.q), l = localMotion(jt, q);
  const rw = mm3(mm3(rm, l.R), tr3(rm));
  return {R:rw, t:sub3(add3(fr.p, mv3(rm, l.t)), mv3(rw, fr.p))};
}
// {bodyId: {R,t}} for a pose ({jointId: [coords]})
function poseFK(d, values){
  const bodies = poseBodies(d), X = {chassis:xId(), ground:xId()};
  let pending = (d?.constraints||[]).filter(c => c && c.type === 'joint'), progress = true;
  while(pending.length && progress){
    progress = false;
    for(const c of pending.slice()){
      if(c.body_a in X){
        pending.splice(pending.indexOf(c), 1); progress = true;
        if(c.body_b in X || !(c.body_b in bodies)) continue;
        const fr = poseFrame(d, c, 'a'); if(!fr) continue;
        X[c.body_b] = xCompose(X[c.body_a], worldMotion(fr, c.joint_type, values[c.id] || []));
      }
    }
  }
  const memo = Object.assign({}, X);
  const resolve = (id, seen=[]) => {
    if(id in memo) return memo[id];
    const par = bodies[id]?.parent;
    memo[id] = (par in memo || (par in bodies && !seen.includes(par) && par !== id)) ? resolve(par, seen.concat(id)) : xId();
    return memo[id];
  };
  Object.keys(bodies).forEach(id => resolve(id));
  return memo;
}
function poseElementLengths(d, X){
  const out = {};
  (d?.constraints||[]).forEach(c => {
    if(!c || (c.type !== 'spring' && c.type !== 'actuator')) return;
    const fa = poseFrame(d, c, 'a'), fb = poseFrame(d, c, 'b'); if(!fa || !fb) return;
    const pa = xApply(X[c.body_a] || xId(), fa.p), pb = xApply(X[c.body_b] || xId(), fb.p);
    out[c.id] = Math.hypot(pa[0]-pb[0], pa[1]-pb[1], pa[2]-pb[2]);
  });
  return out;
}
function poseCG(d, X){
  const ch = d?.chassis || {}, bodies = poseBodies(d);
  const total = (typeof ch.mass_total === 'number' && ch.mass_total > 0) ? ch.mass_total : (Object.values(bodies).reduce((s,b) => s + (b.mass||0), 0) || 1);
  const dl = [0,0,0];
  Object.entries(bodies).forEach(([id,b]) => {
    if(!Array.isArray(b.position) || typeof b.mass !== 'number') return;
    const mv = xApply(X[id] || xId(), b.position);
    for(let i=0;i<3;i++) dl[i] += b.mass * (mv[i] - b.position[i]) / total;
  });
  const cg0 = ch.center_of_gravity || [0,0,0];
  return {cg: cg0.map((v,i) => v + dl[i]), delta: dl, mass: total};
}
function inertiaMat(v){
  if(Array.isArray(v) && v.length === 3 && v.every(r => Array.isArray(r) && r.length === 3)) return v.map(r => r.map(Number));
  if(!v || typeof v !== 'object' || ['Ixx','Iyy','Izz'].some(k => typeof v[k] !== 'number')) return null;
  const g = k => Number(v[k] || 0);
  return [[g('Ixx'),-g('Ixy'),-g('Ixz')],[-g('Ixy'),g('Iyy'),-g('Iyz')],[-g('Ixz'),-g('Iyz'),g('Izz')]];
}
function poseBodyInertia(b){
  let m = inertiaMat(b.inertia); if(!m) return null;
  if(Array.isArray(b.inertia_orientation) && b.inertia_orientation.length === 4){ const r = quatMat(b.inertia_orientation); m = mm3(mm3(r, m), tr3(r)); }
  return m;
}
const steiner = (mass, d) => { const dd = d[0]*d[0]+d[1]*d[1]+d[2]*d[2]; return [0,1,2].map(i => [0,1,2].map(j => mass * ((i===j?dd:0) - d[i]*d[j]))); };
const madd = (a,b,s=1) => a.map((r,i) => r.map((v,j) => v + s*b[i][j]));
function poseInertia(d, X){
  const ch = d?.chassis || {}, iRef = inertiaMat(ch.inertia); if(!iRef) return null;
  const r = poseCG(d, X), cg0 = ch.center_of_gravity || [0,0,0];
  let acc = iRef;
  Object.entries(poseBodies(d)).forEach(([id,b]) => {
    const t = X[id] || xId();
    if(xIsId(t) || !Array.isArray(b.position) || typeof b.mass !== 'number') return;
    const ib = poseBodyInertia(b) || [[0,0,0],[0,0,0],[0,0,0]];
    acc = madd(acc, madd(ib, steiner(b.mass, sub3(b.position, cg0))), -1);
    acc = madd(acc, madd(mm3(mm3(t.R, ib), tr3(t.R)), steiner(b.mass, sub3(xApply(t, b.position), cg0))));
  });
  return madd(acc, steiner(r.mass, r.delta), -1);
}

// SAE rigid transform -> THREE.Matrix4 (acting on Three-space world coordinates)
function threeMatrix(x){
  const P = SAE_TO_THREE, R = mm3(mm3(P, x.R), tr3(P)), t = mv3(P, x.t), m = new THREE.Matrix4();
  m.set(R[0][0],R[0][1],R[0][2],t[0], R[1][0],R[1][1],R[1][2],t[1], R[2][0],R[2][1],R[2][2],t[2], 0,0,0,1);
  return m;
}

// ── state ─────────────────────────────────────────────────────────────────────
const poseJoints = () => (DATA?.constraints||[]).filter(c => c && c.type === 'joint');
function poseVals(j){ const n = POSE_DOF[j.joint_type] || 0, v = poseState.values[j.id] || []; return Array.from({length:n}, (_,i) => v[i] || 0); }
function poseIsReference(){ return !Object.values(poseState.values).some(v => v.some(x => Math.abs(x) > 1e-12)); }
function poseFromDoc(id){
  const p = (DATA?.poses||[]).find(x => x.id === id), out = {};
  poseJoints().forEach(j => { const v = p?.values?.[j.id]; out[j.id] = v === undefined ? Array(POSE_DOF[j.joint_type] || 0).fill(0) : (Array.isArray(v) ? v.slice() : [v]); });
  return out;
}
function resetPoseState(){
  if(poseTween){ cancelAnimationFrame(poseTween); poseTween = null; }
  poseState = {id: null, values: {}};
  Object.values(loadedMeshes).forEach(e => e.nodeObj?.forEach(o => { if(o.parent?.userData?._poseWrap){ o.parent.matrix.identity(); o.parent.matrixWorldNeedsUpdate = true; } }));
}
// move a bound glTF node by the world motion M (Three space) without touching its own transform:
// it is parented to a wrapper whose local matrix is P^-1 · M · P (P = the old parent's world matrix)
function posedNodeFor(bodyVisual){
  if(!bodyVisual?.node) return null;
  const pools = bodyVisual.mesh_ref && loadedMeshes[bodyVisual.mesh_ref] ? [loadedMeshes[bodyVisual.mesh_ref]] : Object.values(loadedMeshes);
  for(const e of pools){ if(!e.objNode) continue; for(const o of e.objNode.keys()) if((o.userData?.name || o.name) === bodyVisual.node) return o; }
  return null;
}
function setNodePose(node, M){
  let w = node.parent?.userData?._poseWrap ? node.parent : null;
  if(!w){
    if(M.equals(new THREE.Matrix4())) return;               // nothing to do and no wrapper yet
    const parent = node.parent; if(!parent) return;
    w = new THREE.Group(); w.userData._poseWrap = true; w.matrixAutoUpdate = false;
    parent.add(w); w.add(node);
  }
  const parent = w.parent; parent.updateWorldMatrix(true, false);
  const P = parent.matrixWorld, Pi = new THREE.Matrix4().copy(P).invert();
  w.matrix.copy(Pi).multiply(M).multiply(P); w.matrixWorldNeedsUpdate = true;
}

function applyPose(){
  const d = DATA; if(!d) return;
  const hasC = (d.constraints||[]).length > 0;
  const X = hasC ? poseFK(d, poseState.values) : {};
  posedObjects.forEach(({obj, bodyId, base}) => {
    const x = X[bodyId]; obj.matrixAutoUpdate = false;
    if(x && !xIsId(x)) obj.matrix.copy(threeMatrix(x)).multiply(base); else obj.matrix.copy(base);
    obj.matrixWorldNeedsUpdate = true;
  });
  // glTF nodes bound with visual.node
  Object.entries(poseBodies(d)).forEach(([id, b]) => {
    if(!b.visual?.node) return;
    const node = posedNodeFor(b.visual); if(!node) return;
    setNodePose(node, X[id] ? threeMatrix(X[id]) : new THREE.Matrix4());
  });
  if(artic){
    const L = poseElementLengths(d, X);
    artic.elems.forEach(el => {
      const c = el.c, fa = poseFrame(d, c, 'a'), fb = poseFrame(d, c, 'b'); if(!fa || !fb) return;
      const pa = sae2three(xApply(X[c.body_a] || xId(), fa.p)), pb = sae2three(xApply(X[c.body_b] || xId(), fb.p));
      const pos = el.line.geometry.attributes.position; pos.setXYZ(0, pa.x, pa.y, pa.z); pos.setXYZ(1, pb.x, pb.y, pb.z); pos.needsUpdate = true;
      el.line.geometry.computeBoundingSphere();
      el.ends[0].position.copy(pa); el.ends[1].position.copy(pb);
      if(c.type === 'actuator' && typeof c.retracted_length === 'number'){
        const lo = c.retracted_length + (c.stroke?.min ?? 0), hi = c.retracted_length + (c.stroke?.max ?? 0), ok = L[c.id] >= lo - 1e-4 && L[c.id] <= hi + 1e-4;
        el.line.material.color.set(ok ? 0xffb347 : 0xff3b3b);
      }
    });
    if(artic.cg){ const r = poseCG(d, X); artic.cg.position.copy(sae2three(r.cg)); artic.cg.visible = !poseIsReference(); }
  }
  updateCollision(X);
  updatePoseReadouts(X);
}

// helpers drawn in buildScene: joint axes, spring / actuator lines, the pose CG marker
function buildArticulation(data, h){
  artic = null;
  const cons = (data?.constraints||[]).filter(c => c && typeof c === 'object');
  if(!cons.length || !groups.articulation) return;
  artic = {elems: [], cg: null};
  const jColor = {revolute:0x4d9fff, translational:0x34d27b, cylindrical:0x2dd4bf, spherical:0xb06aff, universal:0xf0b429, planar:0xff8c42, fixed:0x6e7a96};
  cons.forEach(c => {
    if(c.type === 'joint'){
      const fr = poseFrame(data, c, 'a'); if(!fr || c.joint_type === 'fixed' || c.joint_type === 'spherical') return;
      const ax = mv3(quatMat(fr.q), [0,0,1]), len = c.joint_type === 'planar' ? 0.12 : 0.22;
      const p1 = sae2three(add3(fr.p, ax.map(v => -v*len))), p2 = sae2three(add3(fr.p, ax.map(v => v*len)));
      const t = h.mkT(p1, p2, c.joint_type === 'translational' ? 0.006 : 0.004, jColor[c.joint_type] || 0xffffff);
      if(t){ h.addP(t, `${c.id}: ${c.joint_type}\n${c.body_a} → ${c.body_b}` + (c.range ? `\nrange ${JSON.stringify(c.range)}` : '')); t.updateMatrix(); posedObjects.push({obj:t, bodyId:c.body_a, base:t.matrix.clone()}); groups.articulation.add(t); }
      const s = h.mkS(sae2three(fr.p), 0.014, jColor[c.joint_type] || 0xffffff);
      if(s){ s.updateMatrix(); posedObjects.push({obj:s, bodyId:c.body_a, base:s.matrix.clone()}); groups.articulation.add(s); }
    } else if(c.type === 'spring' || c.type === 'actuator'){
      const fa = poseFrame(data, c, 'a'), fb = poseFrame(data, c, 'b'); if(!fa || !fb) return;
      const col = c.type === 'actuator' ? 0xffb347 : 0x3dd68c;
      const g = new THREE.BufferGeometry().setFromPoints([sae2three(fa.p), sae2three(fb.p)]);
      const line = new THREE.Line(g, new THREE.LineBasicMaterial({color: col})); line.frustumCulled = false;
      line.userData = {label: `${c.id}: ${c.type}`, corner: null}; groups.articulation.add(line);
      const ends = [h.mkS(sae2three(fa.p), 0.012, col), h.mkS(sae2three(fb.p), 0.012, col)];
      ends.forEach(e => groups.articulation.add(e));
      artic.elems.push({c, line, ends});
    }
  });
  artic.cg = h.mkS(sae2three(data?.chassis?.center_of_gravity || [0,0,0]), 0.03, 0xffe14d);
  if(artic.cg){ h.addP(artic.cg, 'CG (this pose)'); artic.cg.visible = false; groups.articulation.add(artic.cg); }
}

// ── tween + UI ───────────────────────────────────────────────────────────────
function poseAnimateTo(target, ms=800){
  if(poseTween){ cancelAnimationFrame(poseTween); poseTween = null; }
  const from = {}; poseJoints().forEach(j => { from[j.id] = poseVals(j); });
  const to = {}; poseJoints().forEach(j => { to[j.id] = (target[j.id] || []).concat([0,0,0]).slice(0, POSE_DOF[j.joint_type] || 0); });
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / ms), e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
    poseJoints().forEach(j => { poseState.values[j.id] = from[j.id].map((v,i) => v + (to[j.id][i] - v) * e); });
    applyPose(); syncPoseSliders();
    poseTween = k < 1 ? requestAnimationFrame(step) : null;
  };
  poseTween = requestAnimationFrame(step);
}
window.poseSelect = function(id){
  poseState.id = id || null;
  poseAnimateTo(id ? poseFromDoc(id) : {});
};
window.poseReset = function(){ poseState.id = null; const s = document.getElementById('pose-sel'); if(s) s.value = ''; poseAnimateTo({}, 500); };
window.poseSlide = function(el){
  if(poseTween){ cancelAnimationFrame(poseTween); poseTween = null; }
  const j = poseJoints().find(x => x.id === el.dataset.j); if(!j) return;
  const k = +el.dataset.k, v = poseVals(j), rot = poseCoordKind(j.joint_type, k) === 'rot';
  v[k] = parseFloat(el.value) * (rot ? Math.PI / 180 : 1);
  poseState.values[j.id] = v; poseState.id = null;
  const s = document.getElementById('pose-sel'); if(s) s.value = '';
  applyPose(); syncPoseSliders(el);
};
window.poseSaveCurrent = function(){
  const name = (prompt('Name for the new pose:', 'pose_' + ((DATA.poses||[]).length + 1)) || '').trim();
  if(!name) return;
  if((DATA.poses||[]).some(p => p.id === name)){ alert('A pose called "' + name + '" already exists.'); return; }
  const values = {}; poseJoints().forEach(j => { const v = poseVals(j); if(v.some(x => Math.abs(x) > 1e-9)) values[j.id] = v.length === 1 ? +v[0].toFixed(5) : v.map(x => +x.toFixed(5)); });
  applyEdit('poses', (DATA.poses || []).concat([{id: name, values}]));
  poseState.id = name; renderPanel();
};
function poseCoordKind(jt, k){
  if(jt === 'translational') return 'lin';
  if(jt === 'cylindrical') return k === 0 ? 'rot' : 'lin';
  if(jt === 'planar') return k < 2 ? 'lin' : 'rot';
  return 'rot';
}
function poseSliderSpec(j, k){
  const kind = poseCoordKind(j.joint_type, k), deg = 180 / Math.PI;
  const lo = Array.isArray(j.range?.min) ? j.range.min[k] : (k === 0 ? j.range?.min : null);
  const hi = Array.isArray(j.range?.max) ? j.range.max[k] : (k === 0 ? j.range?.max : null);
  if(kind === 'rot') return {kind, min: (typeof lo === 'number' ? lo : -Math.PI) * deg, max: (typeof hi === 'number' ? hi : Math.PI) * deg, step: 0.5, unit: '°'};
  return {kind, min: typeof lo === 'number' ? lo : -1, max: typeof hi === 'number' ? hi : 1, step: 0.001, unit: ' m'};
}
function syncPoseSliders(skip){
  poseJoints().forEach(j => poseVals(j).forEach((v, k) => {
    const sp = poseSliderSpec(j, k), disp = sp.kind === 'rot' ? v * 180 / Math.PI : v;
    const sl = document.getElementById(`ps-${j.id}-${k}`), lb = document.getElementById(`pv-${j.id}-${k}`);
    if(sl && sl !== skip) sl.value = disp;
    if(lb) lb.textContent = disp.toFixed(sp.kind === 'rot' ? 1 : 3) + sp.unit;
  }));
}
function updatePoseReadouts(X){
  const box = document.getElementById('pose-readout'); if(!box || !DATA) return;
  const r = poseCG(DATA, X), I = poseInertia(DATA, X), L = poseElementLengths(DATA, X);
  const f = (v, n=3) => v.toFixed(n), sgn = v => (v >= 0 ? '+' : '') + v.toFixed(4);
  let h = `<div class="kv-grid"><div class="kv-row"><span class="kv-key">CG</span><span class="kv-val">${r.cg.map(v => f(v)).join(' / ')}</span></div>` +
          `<div class="kv-row"><span class="kv-key">Δ CG vs reference</span><span class="kv-val">${r.delta.map(sgn).join(' / ')}</span></div>` +
          `<div class="kv-row"><span class="kv-key">mass</span><span class="kv-val">${f(r.mass, 1)} kg</span></div>`;
  if(I) h += `<div class="kv-row"><span class="kv-key">inertia Ixx / Iyy / Izz</span><span class="kv-val">${f(I[0][0],1)} / ${f(I[1][1],1)} / ${f(I[2][2],1)}</span></div>` +
             `<div class="kv-row"><span class="kv-key">products Ixy / Ixz / Iyz</span><span class="kv-val">${f(-I[0][1],1)} / ${f(-I[0][2],1)} / ${f(-I[1][2],1)}</span></div>`;
  h += '</div>';
  const els = (DATA.constraints||[]).filter(c => c && (c.type === 'spring' || c.type === 'actuator') && L[c.id] !== undefined);
  if(els.length){
    h += '<div style="margin-top:6px">' + els.map(c => {
      let bar = '', bad = false;
      if(c.type === 'actuator' && typeof c.retracted_length === 'number'){
        const lo = c.retracted_length + (c.stroke?.min ?? 0), hi = c.retracted_length + (c.stroke?.max ?? 0);
        bad = L[c.id] < lo - 1e-4 || L[c.id] > hi + 1e-4;
        const k = hi > lo ? Math.max(0, Math.min(1, (L[c.id] - lo) / (hi - lo))) : 0;
        bar = `<div style="flex:1;height:5px;background:var(--brd);border-radius:3px;position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:${(k*100).toFixed(0)}%;background:${bad?'var(--rd)':'var(--ac)'};border-radius:3px"></div></div>` +
              `<span style="color:var(--txD);width:104px;text-align:right">${f(lo)}–${f(hi)} m</span>`;
      }
      return `<div style="display:flex;align-items:center;gap:6px;font-size:10px;margin:2px 0"><span style="width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${bad?'var(--rd)':'var(--tx)'}" title="${escH(c.id)}">${escH(c.id)}</span><span style="width:56px">${f(L[c.id])} m</span>${bar}${bad?'<span style="color:var(--rd)">out of reach</span>':''}</div>`;
    }).join('') + '</div>';
  }
  h += collReadout(X);
  box.innerHTML = h;
}

function renderPoses(el){
  const d = DATA, cons = (d?.constraints||[]).filter(c => c && typeof c === 'object');
  if(!cons.length){
    el.innerHTML = '<div style="color:var(--txD);font-size:11px;line-height:1.5">This file has no <b>constraints</b>, so nothing can move.<br>Movable parts (doors, hood, tilt cab, loaders, hitches) are described by <code>constraints[]</code> and <code>poses[]</code> (spec §24). Try <b>skeleton_tractor_loader_hitch</b> or <b>skeleton_ff_articulated_panels</b>.</div>';
    return;
  }
  const joints = poseJoints(), poses = d.poses || [];
  let h = `<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:10px">Pose
    <select id="pose-sel" onchange="poseSelect(this.value)" style="background:var(--bg);color:var(--tx);border:1px solid var(--brd);font-size:10px;max-width:150px">
      <option value="">reference</option>${poses.map(p => `<option value="${escH(p.id)}" ${p.id===poseState.id?'selected':''}>${escH(p.id)}</option>`).join('')}</select>
    <button class="btn" style="padding:0 8px" onclick="poseReset()">⟲ Reset</button>
    <button class="btn" style="padding:0 8px" onclick="poseSaveCurrent()" title="Store the slider values as a new pose in the SVJ">＋ Save as pose</button></div>`;
  const jointRow = j => {
    const n = POSE_DOF[j.joint_type] || 0;
    if(!n) return `<div style="font-size:10px;margin:3px 0;color:var(--txD)">${escH(j.id)} · fixed · ${escH(j.body_a)} → ${escH(j.body_b)}</div>`;
    return `<div style="margin:5px 0"><div style="font-size:10px"><b>${escH(j.id)}</b> <span style="color:var(--txD)">${escH(j.joint_type)} · ${escH(j.body_a)} → ${escH(j.body_b)}</span></div>` +
      Array.from({length:n}, (_, k) => { const sp = poseSliderSpec(j, k); return `<div style="display:flex;align-items:center;gap:6px;font-size:10px"><input id="ps-${escH(j.id)}-${k}" type="range" data-j="${escH(j.id)}" data-k="${k}" min="${sp.min}" max="${sp.max}" step="${sp.step}" value="0" oninput="poseSlide(this)" style="flex:1"><span id="pv-${escH(j.id)}-${k}" style="width:62px;text-align:right;color:var(--ac)">0</span></div>`; }).join('') + '</div>';
  };
  h += section('Joints', joints.filter(j => !j.x_derived).map(jointRow).join('') || '<div style="font-size:10px;color:var(--txD)">no authored joints</div>');
  const derivedJ = joints.filter(j => j.x_derived);
  if(derivedJ.length) h += `<details style="margin-top:8px"><summary style="font-size:10px;color:var(--txD);cursor:pointer">Generated joints (x_derived) · ${derivedJ.length}</summary>${derivedJ.map(jointRow).join('')}</details>`;
  h += section('This pose', '<div id="pose-readout"></div>');
  el.innerHTML = h;
  syncPoseSliders();
  updatePoseReadouts(poseFK(d, poseState.values));
}

/* ═══════════════════════════════════════════════════
   MESH PARTS  (per-node selection → gizmo / numeric / nudge → save GLB + SVJ)
   A selectable "part" is one glTF node (or the whole asset group). Edits are
   local node transforms; on save only the glTF JSON chunk is rewritten, so
   geometry, materials and textures stay byte-identical.
   ═══════════════════════════════════════════════════ */

let selectedObj = null;            // THREE.Object3D being edited: a glTF node, or the asset group
let meshStepMm  = 1;               // nudge step (mm); rotation nudge = step/10 degrees
let _dragBefore = null;            // transform snapshot taken when a gizmo drag starts

const trsOf  = o => ({p:o.position.toArray(), q:o.quaternion.toArray(), s:o.scale.toArray()});
const sameTrs = (a,b,eps=1e-6) => ['p','q','s'].every(k => a[k].every((v,i) => Math.abs(v-b[k][i]) <= eps));
function restoreTrs(o, t){ o.position.fromArray(t.p); o.quaternion.fromArray(t.q); o.scale.fromArray(t.s); o.updateMatrix(); }
const escH = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Map every Three object that came from a glTF node to its node index, and remember its file transform.
function indexMeshNodes(entry, gltf){
  entry.json = gltf.parser.json;
  entry.nodeObj = new Map(); entry.objNode = new Map(); entry.orig = new Map();
  gltf.scene.traverse(o => {
    const a = gltf.parser.associations.get(o);
    if(a && a.type === 'nodes'){ entry.nodeObj.set(a.index, o); entry.objNode.set(o, a.index); entry.orig.set(a.index, trsOf(o)); }
  });
}
function nodeLabel(entry, o){
  if(o === entry.group) return 'whole asset';
  return o.userData?.name || o.name || ('node ' + entry.objNode.get(o));
}
function entryOf(o){
  for(const [id, e] of Object.entries(loadedMeshes)){ let p=o; while(p){ if(p===e.group) return id; p=p.parent; } }
  return null;
}
function nodeDirty(entry, idx){ return !sameTrs(trsOf(entry.nodeObj.get(idx)), entry.orig.get(idx)); }
function groupDirty(entry){
  const g = entry.group;
  return g.position.lengthSq() > 1e-12 || Math.abs(Math.abs(g.quaternion.w) - 1) > 1e-9 || g.scale.distanceTo(new THREE.Vector3(1,1,1)) > 1e-9;
}
function dirtyNodes(entry){ const out=[]; entry.nodeObj.forEach((o,i)=>{ if(nodeDirty(entry,i)) out.push(i); }); return out; }
function dirtyAssets(){
  return Object.entries(loadedMeshes).map(([id,e]) => ({id, e, nodes:dirtyNodes(e), grp:groupDirty(e)})).filter(x => x.nodes.length || x.grp);
}

// ── undo integration: one changeLog entry per edit, restored by closure ───────────────
function syncGroupXform(id){
  const e = loadedMeshes[id], list = DATA?.assets?.meshes, m = list?.find(x => x.id === id);
  if(!e || !m) return;
  if(!groupDirty(e)){ delete m.x_transform; return; }
  const g = e.group;
  m.x_transform = {position:g.position.toArray(), rotation:[g.rotation.x,g.rotation.y,g.rotation.z], scale:g.scale.toArray()};
}
function afterMeshChange(id){
  syncGroupXform(id);
  updateMeshTransformHUD(); refreshMeshPanel(); updateSaveBar();
}
function commitMeshEdit(id, obj, before, label, coalesce){
  const after = trsOf(obj);
  if(sameTrs(before, after, 1e-9)) return;
  const last = changeLog[changeLog.length-1], now = Date.now();
  if(coalesce && last && last.obj === obj && last.coalesce && now - last.timestamp < 1200){ last.timestamp = now; afterMeshChange(id); return; }
  changeLog.push({path:'__mesh__', label, obj, coalesce:!!coalesce, oldVal:null, newVal:null, timestamp:now,
                  undo(){ restoreTrs(obj, before); afterMeshChange(id); }});
  afterMeshChange(id);
}
function editSelected(label, fn, coalesce){
  if(!selectedObj || !selectedMeshId) return;
  const before = trsOf(selectedObj);
  fn(selectedObj);
  selectedObj.updateMatrix();
  commitMeshEdit(selectedMeshId, selectedObj, before, label, coalesce);
}

// ── selection ────────────────────────────────────────────────────────────────
function partFromHit(entry, hit){
  const chain = [];
  for(let o = hit; o && o !== entry.group; o = o.parent) if(entry.objNode.has(o)) chain.push(o);
  if(!chain.length) return entry.group;
  return chain.find(n => String(n.userData?.name || '').startsWith('SVJ::')) || chain[0];
}

function selectMesh(meshId, obj) {
  if (!transformCtrl) return;
  const entry = loadedMeshes[meshId];
  if (!entry) return;
  if (!poseIsReference()) {          // meshes are fitted in the reference pose
    poseState.values = {}; poseState.id = null; applyPose();
    if (activePanel === 'poses') renderPanel();
    showMeshToast('Back to the reference pose: parts are fitted there');
  }
  selectedMeshId = meshId;
  selectedObj = obj || entry.group;
  transformCtrl.attach(selectedObj);
  transformCtrl.visible = layers.meshes;
  showMeshTransformToolbar(meshId);
  updateMeshTransformHUD();
  refreshMeshPanel(true);
}

function deselectMesh() {
  if (transformCtrl) { transformCtrl.detach(); transformCtrl.visible = false; }
  selectedMeshId = null; selectedObj = null;
  const tb = document.getElementById('mesh-tb');
  if (tb) tb.style.display = 'none';
  const hud = document.getElementById('mesh-hud');
  if (hud) hud.style.display = 'none';
  refreshMeshPanel(true);
}

window.deselectMesh = deselectMesh;   // toolbar button uses an inline handler
window.meshPartSelect = function(meshId, idx){
  const e = loadedMeshes[meshId]; if(!e) return;
  selectMesh(meshId, idx < 0 ? e.group : e.nodeObj.get(idx));
};
window.meshPartParent = function(){
  const e = loadedMeshes[selectedMeshId]; if(!e || !selectedObj || selectedObj === e.group) return;
  let p = selectedObj.parent;
  while(p && p !== e.group && !e.objNode.has(p)) p = p.parent;
  selectMesh(selectedMeshId, (p && p !== e.group) ? p : e.group);
};
window.meshPartToggleHide = function(meshId, idx){
  const e = loadedMeshes[meshId]; if(!e) return;
  const o = idx < 0 ? e.group : e.nodeObj.get(idx);
  if(o) o.visible = !o.visible;
  refreshMeshPanel(true);
};
window.meshShowAll = function(){
  Object.values(loadedMeshes).forEach(e => { e.group.visible = true; e.group.traverse(o => { o.visible = true; }); });
  refreshMeshPanel(true);
};
window.meshIsolate = function(){
  const e = loadedMeshes[selectedMeshId]; if(!e || !selectedObj) return;
  Object.values(loadedMeshes).forEach(x => x.group.traverse(o => { if(o.isMesh) o.visible = false; }));
  selectedObj.traverse(o => { if(o.isMesh) o.visible = true; });
  for(let p = selectedObj.parent; p; p = p.parent) p.visible = true;
  selectedObj.visible = true;
  refreshMeshPanel(true);
};

// ── editing: reset / numeric / nudge / snap ────────────────────────────────────
window.resetMeshTransform = function() {
  const e = loadedMeshes[selectedMeshId];
  if (!e || !selectedObj) return;
  if (selectedObj === e.group) editSelected('Reset asset', o => { o.position.set(0,0,0); o.rotation.set(0,0,0); o.scale.set(1,1,1); });
  else { const idx = e.objNode.get(selectedObj); editSelected('Reset ' + nodeLabel(e, selectedObj), o => restoreTrs(o, e.orig.get(idx))); }
};

window.meshPartSet = function(kind, axis, value){
  const v = parseFloat(value); if(!isFinite(v)) return;
  editSelected('Edit ' + kind, o => {
    if(kind === 'p') o.position.setComponent(axis, v);
    else if(kind === 's') o.scale.setComponent(axis, v || 1e-6);
    else { const r = o.rotation; const a = [r.x, r.y, r.z]; a[axis] = v * Math.PI / 180; o.rotation.set(a[0], a[1], a[2]); }
  });
};
window.meshSetStep = function(v){ meshStepMm = parseFloat(v) || 1; };

// SAE axes in Three space: fwd(+X) = -Z, right(+Y) = +X, down(+Z) = -Y
const SAE_AXIS = { x:new THREE.Vector3(0,0,-1), y:new THREE.Vector3(1,0,0), z:new THREE.Vector3(0,-1,0) };
function moveWorld(o, vWorld){
  o.updateWorldMatrix(true, false);   // parents may not have been rendered yet
  const p = o.getWorldPosition(new THREE.Vector3()).add(vWorld);
  if(o.parent) o.parent.worldToLocal(p);
  o.position.copy(p);
}
window.meshNudge = function(axis, sign, rotate){
  const dir = SAE_AXIS[axis];
  editSelected(rotate ? 'Rotate part' : 'Move part', o => {
    if(rotate) o.rotateOnWorldAxis(dir, sign * (meshStepMm / 10) * Math.PI / 180);
    else moveWorld(o, dir.clone().multiplyScalar(sign * meshStepMm / 1000));
  }, true);
};

function svjPoints(){
  const out = [], d = DATA; if(!d) return out;
  const cg = d.chassis?.center_of_gravity; if(Array.isArray(cg)) out.push({label:'CG', pos:cg});
  for(const st of stationKeys(d.suspension)){
    const c = d.suspension[st];
    Object.entries(c?.topology?.upright?.hardpoints || {}).forEach(([n,v]) => { if(Array.isArray(v) && v.length>=3) out.push({label:st+' · '+n, pos:v}); });
    ['spring','damper'].forEach(part => ['inboard_mount','outboard_mount'].forEach(m => {
      const v = c?.[part]?.[m]; if(Array.isArray(v) && v.length>=3) out.push({label:st+' · '+part+'.'+m, pos:v});
    }));
  }
  return out;
}
window.meshSnap = function(kind){
  const sel = document.getElementById('mesh-snap-pt'); if(!sel || sel.value === '') return;
  const pt = svjPoints()[parseInt(sel.value, 10)]; if(!pt) return;
  const target = sae2three(pt.pos);
  editSelected('Snap ' + kind + ' → ' + pt.label, o => {
    o.updateWorldMatrix(true, true);
    const from = kind === 'origin' ? o.getWorldPosition(new THREE.Vector3()) : new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());
    moveWorld(o, target.clone().sub(from));
  });
};

// ── HUD + toolbar ───────────────────────────────────────────────────────────
function bboxCentreSAE(o){
  o.updateWorldMatrix(true, true);
  const c = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());
  return [-c.z, c.x, -c.y];   // inverse of sae2three
}
function showMeshTransformToolbar(meshId) {
  let tb = document.getElementById('mesh-tb');
  if (!tb) {
    tb = document.createElement('div');
    tb.id = 'mesh-tb';
    tb.style.cssText = 'position:absolute;bottom:50px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:rgba(12,14,20,0.94);border:1px solid var(--brdL);border-radius:5px;padding:4px 6px;z-index:20;align-items:center';
    document.getElementById('viewport').appendChild(tb);
  }
  const bs = 'padding:2px 8px;border-radius:3px;border:1px solid var(--brd);background:transparent;color:var(--txD);font-family:JetBrains Mono,monospace;font-size:9px;cursor:pointer';
  tb.innerHTML =
    '<span style="font-size:9px;color:var(--txD);margin-right:4px" id="mesh-tb-label"></span>' +
    ['Translate','Rotate','Scale'].map(label => {
      const mode = label.toLowerCase();
      return `<button onclick="setGizmoMode('${mode}')" id="gizmo-btn-${mode}" style="${bs}">${label}</button>`;
    }).join('') +
    '<div style="width:1px;align-self:stretch;background:var(--brd);margin:0 3px"></div>' +
    `<button onclick="meshPartParent()" title="Select the parent node" style="${bs}">▲ Parent</button>` +
    `<button onclick="meshIsolate()" title="Show only this part" style="${bs}">Isolate</button>` +
    `<button onclick="meshShowAll()" style="${bs}">Show all</button>` +
    `<button onclick="resetMeshTransform()" style="${bs};color:var(--yl)">Reset</button>` +
    `<button onclick="openSaveDialog()" style="${bs};color:var(--gn);border-color:var(--gn)">↓ Save SVJ + GLB</button>` +
    `<button onclick="deselectMesh()" style="${bs}">✕</button>`;
  tb.style.display = 'flex';
  setGizmoMode(transformCtrl?.mode || 'translate');
  updateMeshTransformHUD();
}

window.setGizmoMode = function(mode) {
  if (!transformCtrl) return;
  transformCtrl.setMode(mode);
  ['translate','rotate','scale'].forEach(m => {
    const btn = document.getElementById('gizmo-btn-' + m);
    if (!btn) return;
    btn.style.borderColor  = m === mode ? 'var(--ac)' : 'var(--brd)';
    btn.style.color        = m === mode ? 'var(--ac)' : 'var(--txD)';
    btn.style.background   = m === mode ? 'var(--acD)' : 'transparent';
    btn.style.fontWeight   = m === mode ? '700' : '400';
  });
};

function updateMeshTransformHUD() {
  let hud = document.getElementById('mesh-hud');
  const e = loadedMeshes[selectedMeshId];
  if (!e || !selectedObj) { if (hud) hud.style.display = 'none'; return; }
  if (!hud) {
    hud = document.createElement('div');
    hud.id = 'mesh-hud';
    hud.style.cssText = 'position:absolute;bottom:90px;right:10px;background:rgba(12,14,20,0.90);border:1px solid var(--brd);border-radius:4px;padding:5px 9px;font-family:JetBrains Mono,monospace;font-size:9px;color:var(--tx);pointer-events:none;z-index:15';
    document.getElementById('viewport').appendChild(hud);
  }
  const lab = document.getElementById('mesh-tb-label');
  if (lab) lab.textContent = selectedMeshId + ' › ' + nodeLabel(e, selectedObj);
  const p = selectedObj.position, r = selectedObj.rotation, s = selectedObj.scale, c = bboxCentreSAE(selectedObj);
  hud.innerHTML =
    `<div style="color:var(--ac);font-weight:700;margin-bottom:2px">${escH(nodeLabel(e, selectedObj))}</div>` +

// Mesh picking: click in viewport selects the part (glTF node) under the cursor
function pickMesh(e) {
  if (gizmoDragging) return;
  const cv   = renderer.domElement;
  const rect = cv.getBoundingClientRect();
  const mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width)  * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  const rc = new THREE.Raycaster();
  rc.setFromCamera(mouse, camera);
  const candidates = [];
  Object.entries(loadedMeshes).forEach(([id, entry]) => {
    entry.group.traverse(child => { if (child.isMesh && child.visible && layers.meshes) candidates.push({id, mesh: child}); });
  });
  const hits = rc.intersectObjects(candidates.map(c => c.mesh), false);
  if (hits.length) {
    const found = candidates.find(c => c.mesh === hits[0].object);
    if (found) {
      const entry = loadedMeshes[found.id];
      const part = partFromHit(entry, found.mesh);
      if (selectedObj !== part) selectMesh(found.id, part);
      return true; // consumed
    }
  }
  return false;
}

/* ═══════════════════════════════════════════════════
   SAVE  SVJ + GLB
   ═══════════════════════════════════════════════════ */
function setOrDelete(n, key, arr, def){
  const rounded = arr.map(v => Math.abs(v) < 1e-7 ? 0 : +v.toPrecision(9));   // drop float noise (<0.1 µm)
  if(rounded.every((v,i) => v === def[i])) delete n[key]; else n[key] = rounded;
}

// Fold the asset group's transform into its scene-root nodes (so the saved file needs no viewer offset)
function bakeGroupTransform(entry){
  if(!groupDirty(entry)) return;
  const g = entry.group; g.updateMatrix();
  const roots = (entry.json.scenes?.[entry.json.scene || 0]?.nodes || []).map(i => entry.nodeObj.get(i)).filter(Boolean);
  roots.forEach(o => o.applyMatrix4(g.matrix));
  g.position.set(0,0,0); g.quaternion.set(0,0,0,1); g.scale.set(1,1,1); g.updateMatrix();
}

function buildMeshFile(entry){
  const json = JSON.parse(JSON.stringify(entry.json));
  entry.nodeObj.forEach((o, idx) => {
    if(!nodeDirty(entry, idx)) return;
    const n = json.nodes[idx], t = trsOf(o);
    delete n.matrix;
    setOrDelete(n, 'translation', t.p, [0,0,0]);
    setOrDelete(n, 'rotation',    t.q, [0,0,0,1]);
    setOrDelete(n, 'scale',       t.s, [1,1,1]);
  });
  if(!entry.isGlb) return new Blob([JSON.stringify(json, null, 2)], {type:'model/gltf+json'});
  const src = new Uint8Array(entry.buf), dv = new DataView(entry.buf);
  const oldJsonLen = dv.getUint32(12, true);
  const rest = src.subarray(20 + oldJsonLen);          // BIN chunk (and anything after), untouched
  const enc = new TextEncoder().encode(JSON.stringify(json));
  const jb = new Uint8Array(enc.length + (4 - enc.length % 4) % 4).fill(0x20); jb.set(enc);
  const total = 12 + 8 + jb.length + rest.length, out = new Uint8Array(total), o = new DataView(out.buffer);
  o.setUint32(0, 0x46546C67, true); o.setUint32(4, 2, true); o.setUint32(8, total, true);
  o.setUint32(12, jb.length, true); o.setUint32(16, 0x4E4F534A, true);
  out.set(jb, 20); out.set(rest, 20 + jb.length);
  return new Blob([out], {type:'model/gltf-binary'});
}

}

/* ═══════════════════════════════════════════════════
   MESH OPACITY CONTROL
   ═══════════════════════════════════════════════════ */
function applyMeshOpacity(modelOrAll, alpha) {
  const targets = modelOrAll ? [modelOrAll] : Object.values(loadedMeshes).map(e => e.group);
  targets.forEach(model => {
    model.traverse(child => {
      if (!child.isMesh) return;
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach(m => {
        const origOpacity = m.userData._origOpacity ?? 1.0;
        const finalOpacity = origOpacity * alpha;
        m.opacity      = finalOpacity;
        m.transparent  = finalOpacity < 1.0 || (m.userData._origTransparent && alpha === 1.0);
        m.depthWrite   = finalOpacity >= 0.99;
      });
    });
  });
}

window.setMeshOpacity = function(val) {
  meshOpacity = parseFloat(val);
  applyMeshOpacity(null, meshOpacity); // apply to all loaded meshes
  const lbl = document.getElementById('mesh-opacity-lbl');
  if (lbl) lbl.textContent = Math.round(meshOpacity * 100) + '%';
};

/* ═══════════════════════════════════════════════════
   GLTF / MESH LOADING  (SVJ v0.97)
   ═══════════════════════════════════════════════════ */
const _gltfLoader = new GLTFLoader();

// glTF default (Y-up, -Z-forward) is native Three.js space, so no extra
// rotation is needed. Physics data was converted by sae2three(), so the
// procedural geometry and loaded meshes share the same Three.js space.

function loadGLTFBuffer(meshId, data, fileName, isGlb) {
  _gltfLoader.parse(data, '', (gltf) => {
    const model = gltf.scene;
    // Clone materials to allow per-session opacity control, preserve original settings
    model.traverse(child => {
      if (!child.isMesh) return;
      child.material = Array.isArray(child.material)
        ? child.material.map(m => m.clone())
        : child.material.clone();
      // Store original opacity/transparent so the slider can restore them
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach(m => {
        m.userData._origOpacity     = m.opacity;
        m.userData._origTransparent = m.transparent;
        m.userData._origDepthWrite  = m.depthWrite;
      });
    });
    // Apply current global mesh opacity setting
    applyMeshOpacity(model, meshOpacity);
    if (loadedMeshes[meshId]) groups.meshes.remove(loadedMeshes[meshId].group);
    if (selectedMeshId === meshId) deselectMesh();
    const meshEntry = { group: model, file: fileName, buf: data, isGlb };
    indexMeshNodes(meshEntry, gltf);
    loadedMeshes[meshId] = meshEntry;
    // Apply stored transform if present in DATA.assets.meshes
    applyStoredTransform(model, meshId);
    groups.meshes.add(model);
    applyPose();

    // ── Register in DATA.assets.meshes if not already there ──
    if (DATA) {
      if (!DATA.assets)        DATA.assets = {};
      if (!DATA.assets.meshes) DATA.assets.meshes = [];
      const existing = DATA.assets.meshes.find(m => m.id === meshId);
      if (!existing) {
        DATA.assets.meshes.push({ id: meshId, uri: fileName });
        // Bump version to 0.97 if it was lower
        if (DATA._metadata) {
          const v = parseFloat(DATA._metadata.version || '0');
          if (v < 0.97) DATA._metadata.version = '0.97';
        }
        meshAssets = DATA.assets.meshes;
        // Reflect new asset in changelog so Save SVJ captures it
        changeLog.push({
          path: 'assets.meshes',
          oldVal: null,
          newVal: DATA.assets.meshes,
          timestamp: Date.now()
        });
        updateSaveBar();
        // Refresh overview panel to show the new asset block
        if (activePanel === 'overview') renderPanel();
      }
    }

    applyLayers();
    buildLayerUI();
    updateMeshBanner(DATA);
    showMeshToast('✓ ' + fileName + '  →  "' + meshId + '"');
  }, () => {
    showMeshToast('✕ Failed to load ' + fileName, true);
  });
}

function handleGLBFile(file) {
  const base = file.name.replace(/\.(glb|gltf)$/i, '');
  let meshId = base;
  if (meshAssets.length) {
    const hit = meshAssets.find(a =>
      (a.uri || '').split('/').pop().replace(/\.(glb|gltf)$/i, '') === base ||
      a.id === base
    );
    if (hit) meshId = hit.id;
  }
  const isGlb = /\.glb$/i.test(file.name);
  (isGlb ? file.arrayBuffer() : file.text()).then(data => loadGLTFBuffer(meshId, data, file.name, isGlb))
    .catch(() => showMeshToast('✕ Failed to read ' + file.name, true));
}

}

  const items = e.dataTransfer?.items;
  if (items?.length) {
    const entries = Array.from(items).map(i => i.webkitGetAsEntry?.()).filter(Boolean);
    const hasDir  = entries.some(en => en.isDirectory);
    if (hasDir) {
      collectDroppedFiles(entries).then(files => processDroppedFiles(files));
      return;
    }
  }

  // ── Flat file drop (existing behaviour) ──
  const files = e.dataTransfer?.files;
  if(files?.length) processDroppedFiles(Array.from(files));
});

// Recursively collect File objects from a DataTransferEntry array
async function collectDroppedFiles(entries) {
  const out = [];
  async function walk(entry) {
    if (entry.isFile) {
      out.push(await new Promise(res => entry.file(res)));
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const batch  = await new Promise(res => reader.readEntries(res));
      for (const child of batch) await walk(child);
    }
  }
  for (const en of entries) await walk(en);
  return out;
}

// Process a mixed array of File objects (JSON + GLB)
async function processDroppedFiles(files) {
  // 1. Load SVJ first so meshAssets is populated before GLBs
  const jsonFiles = files.filter(f => /\.json$/i.test(f.name));
  const glbFiles  = files.filter(f => /\.(glb|gltf)$/i.test(f.name));

  const parsed = [];
  for (const file of jsonFiles) {
    await new Promise(res => {
      const reader = new FileReader();
      reader.onload = ev => {
        try { parsed.push({name: file.name, doc: JSON.parse(ev.target.result)}); }
        catch(err) { alert('Invalid JSON: ' + err.message); }
        res();
      };
      reader.readAsText(file);
    });
  }
  // a combination file (units + connections) or a vehicle with attachments[] is assembled from the other dropped files
  const byName = Object.fromEntries(parsed.map(p => [asmBase(p.name), p.doc]));
  const primary = parsed.find(p => Array.isArray(p.doc?.units)) || parsed.find(p => (p.doc?.attachments || []).length);
  if (primary) {
    const {missing, comb} = asmModel(primary.doc, byName);
    if (missing.length) {
      alert(primary.name + ' joins other files that were not dropped with it:\n  ' + missing.join('\n  ') + '\nDrop them together (or drop the whole folder).');
    } else {
      try {
        loadData(asmAssemble(comb));
        document.getElementById('file-name').textContent = primary.name + ' (assembled, ' + comb.units.length + ' units)';
      } catch(err) { alert('Cannot assemble ' + primary.name + ':\n' + err.message); }
    }
  } else {
    parsed.forEach(p => { loadData(p.doc); document.getElementById('file-name').textContent = p.name; });
  }

  // 2. Load GLBs (now meshAssets is up-to-date if an SVJ was just loaded)
  for (const file of glbFiles) handleGLBFile(file);

  // 3. If SVJ was loaded and has assets.meshes but no matching GLBs were dropped,
  //    try to auto-match by filename from ALL dropped files
  if (jsonFiles.length && meshAssets.length && !glbFiles.length) {
    const allGlbInDrop = files.filter(f => /\.(glb|gltf)$/i.test(f.name));
    allGlbInDrop.forEach(f => handleGLBFile(f));
  }
}

const changeLog = [];  // [{path, oldVal, newVal, timestamp}]

function setDeep(obj, path, value) {
  const keys = path.split('.');
  let cur = obj;
  for(let i = 0; i < keys.length - 1; i++) {
    const k = isNaN(keys[i]) ? keys[i] : parseInt(keys[i]);
    if(cur[k] === undefined) cur[k] = {};
    cur = cur[k];
  }
  const lastKey = isNaN(keys[keys.length-1]) ? keys[keys.length-1] : parseInt(keys[keys.length-1]);
  cur[lastKey] = value;
}

function getDeep(obj, path) {
  const keys = path.split('.');
  let cur = obj;
  for(const k of keys) {
    const key = isNaN(k) ? k : parseInt(k);
    if(cur === undefined || cur === null) return undefined;
    cur = cur[key];
  }
  return cur;
}

function applyEdit(path, newVal) {
  const oldVal = getDeep(DATA, path);
  if(oldVal === newVal) return;
  changeLog.push({path, oldVal, newVal, timestamp: Date.now()});
  setDeep(DATA, path, newVal);
  updateSaveBar();
}

function undoLast() {
  if(!changeLog.length) return;
  const last = changeLog.pop();
  if(last.undo) { last.undo(); updateSaveBar(); return; }
  if(last.path === '__root__') { replaceData(last.oldVal); updateSaveBar(); refreshAfterStructural(); return; }
  setDeep(DATA, last.path, last.oldVal);
  updateSaveBar();
  renderPanel();
  // Rebuild 3D if geometry changed
  if(last.path.includes('hardpoint') || last.path.includes('position') || last.path.includes('inboard') || last.path.includes('center_of_gravity')) {
    buildScene(); setupControls(); buildLayerUI();
  }
}

function discardAll() {
  if(!changeLog.length) return;
  if(!confirm('Discard all ' + changeLog.length + ' changes?')) return;
  // Undo all in reverse
  while(changeLog.length) {
    const c = changeLog.pop();
    if(c.undo) { c.undo(); continue; }
    if(c.path === '__root__') replaceData(c.oldVal); else setDeep(DATA, c.path, c.oldVal);
  }
  updateSaveBar();
  rebuildCornerDefs();
  renderPanel();
  buildScene(); setupControls(); buildLayerUI();
}

function updateSaveBar() {
  const bar = document.getElementById('save-bar');
  const count = document.getElementById('changes-count');
  if(changeLog.length > 0) {
    bar.classList.add('show');
    count.textContent = changeLog.length + ' change' + (changeLog.length>1?'s':'');
  } else {
    bar.classList.remove('show');
  }
}

  updateSaveBar();
}

/* PERF-SIM-BEGIN — longitudinal performance model (pure functions, no DOM) */
const PERF_G = 9.80665;
function _interp(tbl, x){
  if(!tbl.length) return 0;
  if(x<=tbl[0][0]) return tbl[0][1];
  for(let i=0;i<tbl.length-1;i++){ const a=tbl[i], b=tbl[i+1]; if(x<=b[0]) return a[1]+(b[1]-a[1])*(x-a[0])/((b[0]-a[0])||1); }
  return tbl[tbl.length-1][1];
}
const PERF_HEAVY = ['heavy_truck','medium_truck','tractor_unit','military','off_highway','special','bus'];

// Axle load shares (fraction of static weight on each axle id)
function perfAxleShares(d){
  const ch=d.chassis||{}, cg=ch.center_of_gravity||[];
  const AX=axleList(d).filter(a=>typeof a.position_x==='number');
  const shares={}; if(!AX.length) return {shares, frontIds:[], rearIds:[], L:ch.wheelbase||2.5};
  const groups=d.axle_groups||[];
  const xs=AX.map(a=>a.position_x); let cut=1,best=-1; for(let i=0;i<xs.length-1;i++){ const gp=xs[i]-xs[i+1]; if(gp>best){best=gp;cut=i+1;} }
  const grpOf=id=>groups.find(g=>(g.axle_refs||[]).includes(id));
  const frontIds=(grpOf(AX[0].id)?.axle_refs)||AX.slice(0,cut).map(a=>a.id);
  const rearIds=(grpOf(AX[AX.length-1].id)?.axle_refs)||AX.slice(cut).map(a=>a.id);
  const pos=Object.fromEntries(AX.map(a=>[a.id,a.position_x]));
  const mean=ids=>ids.reduce((p,c)=>p+(pos[c]??0),0)/Math.max(1,ids.length);
  const xf=mean(frontIds), xr=mean(rearIds), L=Math.max(0.5, xf-xr);
  const kl=groups.map(g=>g.kerb_load);
  if(groups.length && kl.every(v=>typeof v==='number')){
    const tot=kl.reduce((p,c)=>p+c,0);
    groups.forEach(g=>g.axle_refs.forEach(id=>{ shares[id]=g.kerb_load/tot/g.axle_refs.length; }));
  } else {
    let fShare = typeof cg[0]==='number' ? (cg[0]-xr)/(xf-xr) : 0.5;
    fShare=Math.min(1,Math.max(0,fShare));
    frontIds.forEach(id=>shares[id]=fShare/frontIds.length);
    rearIds.forEach(id=>shares[id]=(1-fShare)/rearIds.length);
  }
  return {shares, frontIds, rearIds, L, h: typeof cg[2]==='number' ? -cg[2] : 0.5};
}

function perfModel(d, opts={}){
  const pt=d.powertrain||{}, e=pt.engine||{}, gb=pt.gearbox||{}, el=d.electric||{}, vi=d.vehicle_info||{}, ch=d.chassis||{};
  const cls=vi.vehicle_class, heavy=PERF_HEAVY.includes(cls) || (ch.mass_total||0)>5000;
  const src={}; const pick=(k,v,def,note)=>{ if(typeof v==='number' && isFinite(v)){ src[k]='file'; return v; } src[k]='default'+(note?': '+note:''); return def; };
  if(['trailer','semi_trailer','modular_trailer'].includes(cls)) return {error:'Trailers have no powertrain — performance applies to the towing vehicle.'};

  // ── Prime mover ──
  let tc=null, idle=0, redline=0, ev=false, ratios=[], evRatio=null;
  if(Array.isArray(e.torque_curve) && e.torque_curve.length>=2){
    tc=[...e.torque_curve].sort((a,b)=>a[0]-b[0]);
    idle=pick('idle_rpm', e.idle_rpm, Math.max(tc[0][0], heavy?600:800));
    redline=pick('max_rpm', e.max_rpm, tc[tc.length-1][0]);
    ratios=gb.ratios||[];
    if(!ratios.length) return {error:'powertrain.gearbox.ratios missing — needed to map engine speed to road speed.'};
  } else if(Array.isArray(el.motors) && el.motors.length){
    ev=true; const ms=el.motors; redline=Math.min(...ms.map(m=>m.max_rpm||16000)); idle=0;
    tc=[]; for(let r=0;r<=redline;r+=redline/60){ let T=0; ms.forEach(m=>{ const w=Math.max(r,1)*Math.PI/30; const tq=m.torque_curve?.length?_interp(m.torque_curve,r):Math.min(m.max_torque||0,(m.max_power||Infinity)/w); T+=tq; }); tc.push([Math.round(r),T]); }
    ratios=[1]; evRatio=ms.find(m=>m.gear_ratio)?.gear_ratio; src.max_rpm='file'; src.idle_rpm='n/a (electric)';
  } else return {error:'No engine torque_curve or electric motors in the file.'};

  // ── Driveline ──

  const fd = ev && evRatio ? (src.final_drive='file (motor gear_ratio)', evRatio) : pick('final_drive', diffs[0]?.final_drive, heavy?4.1:3.7);
  const tcase=pt.transfer_case; const range=opts.range||'high';
  const tr = tcase ? (range==='low' ? pick('transfer', tcase.ratio_low, 2.5) : pick('transfer', tcase.ratio_high, 1.0)) : 1;
  if(!tcase) src.transfer='none';
