  const b100=bFind(/0_?100|0_100kph|accel_0_100/), bTop=bFind(/top_speed|max_speed|geared_road_speed|vmax/), bGrade=bFind(/grade/);

  // ── Controls ──
  const sel=(key, options)=>`<select data-perf="${key}" style="background:var(--bg);color:var(--tx);border:1px solid var(--brd);font-size:10px;font-family:JetBrains Mono,monospace;padding:1px 2px">${options.map(([v,l])=>`<option value="${v}" ${String(perfOpts[key])===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
  const num=(key, val, step, w=52, ph='')=>`<input data-perf="${key}" type="number" step="${step}" value="${val??''}" placeholder="${ph}" class="hp-coord" style="width:${w}px">`;
  const loadOpts=[['kerb','kerb '+Math.round(M.kerb)+' kg'],['driver','kerb + driver']].concat(M.hasGvm?[['gvm','GVM '+Math.round(M.gvm)+' kg']]:[]);
  const ctl=`<div style="display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:9.5px;font-family:JetBrains Mono,monospace;color:var(--txD);margin-bottom:8px">
    <label>Load ${sel('load',loadOpts)}</label>
    ${M.hasTransfer?`<label>Range ${sel('range',[['high','high'],['low','low']])}</label>`:''}
    <label>μ ${num('mu', perfOpts.mu??M.mu, 0.05, 44)}</label>
    <label>Grade % ${num('grade', perfOpts.grade, 1, 40)}</label>
    ${M.ev?'':`<label>Shift rpm ${num('shiftRpm', perfOpts.shiftRpm??Math.round(M.redline), 50, 56)}</label><label>Launch rpm ${num('launchRpm', perfOpts.launchRpm??Math.round(S.launchRpm), 50, 56)}</label>`}
  </div>`;

  // ── KPIs ──
  const cmp=(sim,b,unit,lowerIsBetter)=>{ if(!b||sim==null) return ''; const ref=unit==='km/h'?toKmh(b):b.value; const dlt=sim-ref; return `<div style="font-size:8.5px;color:var(--txD);margin-top:1px">${b.type||'ref'} ${ref.toFixed(unit==='s'?1:0)} ${unit} · ${dlt>=0?'+':''}${dlt.toFixed(unit==='s'?1:0)}</div>`; };
  const kpi=(label,val,unit,extra='')=>`<div class="stat-box"><div class="stat-label">${label}</div><div class="stat-value">${val}<span class="stat-unit">${unit}</span></div>${extra}</div>`;
  const vRed=M.ratios.map((r,i)=>M.redline/(M.totalRatio(i)*60/(2*Math.PI))*M.rDyn);
  const kpis=`<div class="grid2 mb8">
    ${kpi('0–100 km/h', fmtT(S.t100), 's', cmp(S.t100,b100,'s'))}
    ${M.heavy? kpi('0–50 km/h', fmtT(S.t50), 's') : kpi('0–200 km/h', fmtT(S.t200), 's')}
    ${kpi('400 m', S.q400?fmtT(S.q400.t):'—', 's', S.q400?`<div style="font-size:8.5px;color:var(--txD);margin-top:1px">at ${kmh(S.q400.v).toFixed(0)} km/h</div>`:'')}
    ${kpi('Top speed', kmh(top.v).toFixed(0), 'km/h', `<div style="font-size:8.5px;color:var(--txD);margin-top:1px">gear ${top.g} · ${top.limitedBy}${perfOpts.grade?` · ${perfOpts.grade}% grade`:''}</div>`+cmp(kmh(top.v),bTop,'km/h'))}
    ${kpi('Gradeability', grade.pct>=100?'>100':grade.pct.toFixed(0), '%', `<div style="font-size:8.5px;color:var(--txD);margin-top:1px">1st${M.hasTransfer?' '+M.range:''} · ${grade.limited?'traction-limited':'engine-limited'}</div>`+(bGrade?`<div style="font-size:8.5px;color:var(--txD)">${bGrade.type||'ref'} ${bGrade.value}${bGrade.unit} (${bGrade.id.replace(/_/g,' ')})</div>`:''))}
    ${kpi('Peak power', (M.peakPw).toFixed(0), 'kW', `<div style="font-size:8.5px;color:var(--txD);margin-top:1px">${(M.peakPw/M.mass*1000).toFixed(0)} W/kg at ${Math.round(M.mass)} kg</div>`)}
  </div>`;

  // ── Chart data ──
  const tr=S.trace;
  const speedTime=tr.map(p=>[p.t, kmh(p.v)]);
  const tEnd=tr.length?tr[tr.length-1].t:10;
  const tShow = M.heavy ? Math.min(tEnd, Math.max(60, (S.t100||S.t50||30)*1.6)) : Math.min(tEnd, Math.max(20, (S.t200||(S.t100?S.t100*2.6:30))*1.15));
  const vlines=S.shifts.filter(s=>s.t<=tShow).map(s=>({x:s.t, label:String(s.to)}));
  const marks=[]; if(S.t100) marks.push({x:S.t100,y:100,label:'100 km/h · '+fmtT(S.t100)+' s',color:VIZ.s1,below:true});
  const hlines=[]; if(bTop) hlines.push({y:toKmh(bTop), label:`${bTop.id.replace(/_/g,' ')} ${toKmh(bTop).toFixed(0)} km/h (${bTop.type||'ref'})`});
  const idS='perf-st-'+Math.random().toString(36).slice(2,7), idR='perf-rs-'+Math.random().toString(36).slice(2,7), idF='perf-fv-'+Math.random().toString(36).slice(2,7);

  // rpm vs speed: per-gear lines + simulated trace
  const vTopK = Math.max(kmh(top.v), ...(M.ev?[kmh(vRed[0])]:[]))*1.05;
  const gearLines=M.ratios.map((r,i)=>{ const k=M.totalRatio(i)*60/(2*Math.PI)/M.rDyn/3.6; const vmin=M.idle/k, vmax=Math.min(M.redline/k, vTopK*1.1); return {name:'G'+(i+1), data:[[vmin, vmin*k],[vmax, vmax*k]], color:VIZ.gear, width:1, label:String(i+1), legend:false, tip:false}; });
  const rpmTrace=[]; tr.forEach(p=>{ if(kmh(p.v)<=vTopK) rpmTrace.push([kmh(p.v), p.rpm]); });
  // enforce monotone x for tooltip lookup: keep the last rpm at each speed bin
  const rpmMono=[]; rpmTrace.forEach(p=>{ if(!rpmMono.length || p[0]>rpmMono[rpmMono.length-1][0]+1e-6) rpmMono.push(p); else rpmMono[rpmMono.length-1]=[rpmMono[rpmMono.length-1][0], p[1]]; });

  // tractive force vs speed
  const fGear=M.ratios.map((r,i)=>{ const k=M.totalRatio(i)*60/(2*Math.PI)/M.rDyn/3.6; const pts=[]; const vmax=Math.min(M.redline/k, vTopK); const vmin=M.ev?0:Math.max(0.5, M.idle/k);
    for(let v=vmin; v<=vmax; v+=Math.max(0.5,(vmax-vmin)/60)) pts.push([v, perfForce(M, v/3.6, i).F/1000]); return {name:'G'+(i+1), data:pts, color:VIZ.gear, width:1, label:String(i+1), legend:false, tip:false}; });
  const env=[]; for(let v=0.5; v<=vTopK; v+=vTopK/120){ let best=0; M.ratios.forEach((r,i)=>{ const k=M.totalRatio(i)*60/(2*Math.PI)/M.rDyn/3.6; if((i===0 || v*k>=M.idle*0.999) && v*k<=M.redline) best=Math.max(best, perfForce(M,v/3.6,i,0,i===0?S.launchRpm:0).F/1000); }); env.push([v,best]); }
  const road=[]; for(let v=0; v<=vTopK; v+=vTopK/80) road.push([v, perfResist(M, v/3.6, (perfOpts.grade||0)/100)/1000]);

  // ── Inputs table (source-tagged) ──
  const srcTag=k=>{ const s=M.src[k]||''; const f=s==='file'||s.startsWith('file'); return `<span style="font-size:8px;color:${f?'var(--gn)':'var(--yl)'}">${f?'file':s.replace(/^default:?\s*/,'default ')}</span>`; };
  const row=(label,val,k)=>`<div class="kv-row"><span class="kv-key">${label}</span><span class="kv-val">${val} ${k?srcTag(k):''}</span></div>`;
  const inputs=section('Model inputs', `<div style="font-size:10px">
    ${row('Mass', Math.round(M.mass)+' kg · '+M.massNote)}
    ${row('Driven axles', M.driven.join(', ')+' · '+(M.drivenShare*100).toFixed(0)+'% static load')}
    ${row('Drag Cd × A', M.Cd.toFixed(2)+' × '+M.A.toFixed(2)+' m²', 'Cd')}${M.src.frontal_area!=='file'?row('Frontal area', M.A.toFixed(2)+' m²','frontal_area'):''}
    ${row('Rolling resistance Crr', M.crr.toFixed(4), 'crr')}
    ${row('Rolling radius', (M.rDyn*1000).toFixed(0)+' mm', 'rolling_radius')}
    ${row('Final drive'+(M.hubRed>1?' × hub':'')+(M.hasTransfer?' × transfer':''), M.fd+(M.hubRed>1?' × '+M.hubRed:'')+(M.hasTransfer?' × '+M.tr:''), 'final_drive')}
    ${row('Driveline efficiency', (M.eff*100).toFixed(1)+' %', 'efficiency')}
    ${M.ev?'':row('Shift time ('+M.gearboxType+')', M.shiftTime.toFixed(2)+' s', 'shift_time')}
    ${M.tcStall>1?row('Torque converter stall ratio', M.tcStall.toFixed(1), 'stall_torque_ratio'):''}
    ${M.ev?'':row('Idle / max rpm', Math.round(M.idle)+' / '+Math.round(M.redline), 'max_rpm')}
    ${row('Rotating inertia', 'wheels '+M.Jw.toFixed(1)+' · engine '+M.Je.toFixed(2)+' kg·m²', 'engine_inertia')}
    ${row('Air density', M.rho.toFixed(3)+' kg/m³', 'air_density')}
  </div>
  <div style="font-size:8.5px;color:var(--txM);margin-top:4px">Straight-line quasi-static model: full throttle, shift at shift rpm, clutch slip at launch rpm, traction limit μ × driven-axle load (with longitudinal transfer on 2-group vehicles and aero lift), drag, rolling resistance, grade, rotating inertia. Yellow = value not in the file, default used. Edit the file values in the Powertrain/Aero data to refine.</div>`);

  // gear table
  const gearTable=section('Per gear', `<div style="font-size:9.5px;font-family:JetBrains Mono,monospace">
    <div style="display:grid;grid-template-columns:30px 1fr 1fr 1fr;color:var(--txD);border-bottom:1px solid var(--brd);padding-bottom:2px"><span>Gear</span><span>Total ratio</span><span>km/h @ max rpm</span><span>Max force kN</span></div>
    ${M.ratios.map((r,i)=>`<div style="display:grid;grid-template-columns:30px 1fr 1fr 1fr;padding:1px 0"><span>${i+1}</span><span>${M.totalRatio(i).toFixed(2)}</span><span>${kmh(vRed[i]).toFixed(0)}</span><span>${(Math.max(...fGear[i].data.map(p=>p[1]),0)).toFixed(1)}</span></div>`).join('')}
  </div>`);

  el.innerHTML = `
    <div class="flex-wrap mb6">${tag(M.ev?'electric':'ICE '+(d.powertrain?.engine?.configuration||''))} ${tag(M.gearboxType+' · '+M.ratios.length+' speed','var(--bl)')} ${tag(M.driven.length+' driven axle'+(M.driven.length>1?'s':''),'var(--og)')}</div>
    ${ctl}${kpis}
    ${plotHtml(idS,'Speed vs time (full throttle)',190, S.shifts.length?'dotted lines = gear changes, numbered by the new gear':'')}
    ${plotHtml(idR,'Engine rpm vs speed',190,'grey = each gear from idle to max rpm · blue = simulated run')}
    ${plotHtml(idF,'Tractive force vs speed',190,'grey = each gear · blue = best gear · orange = road load'+(perfOpts.grade?` on ${perfOpts.grade}% grade`:''))}
    ${gearTable}${inputs}`;

  drawPlot(idS, {series:[{name:'speed', data:speedTime.filter(p=>p[0]<=tShow), color:VIZ.s1}], xLabel:'time (s)', yLabel:'km/h', xUnit:'s', xMax:tShow, vlines, hlines, marks,
    extraTip:x=>{ const p=tr.find(q=>q.t>=x); return p?[`gear ${p.g} · ${Math.round(p.rpm)} rpm · ${p.x.toFixed(0)} m`+(p.lim?' · wheelspin limit':'')+(p.shifting?' · shifting':'')]:[]; }, yFmt:y=>y.toFixed(0)});
  drawPlot(idR, {series:gearLines.concat([{name:'simulated run', data:rpmMono, color:VIZ.s1}]), xLabel:'speed (km/h)', yLabel:'rpm', xUnit:'km/h', xMax:vTopK, yMax:M.redline*1.08,
    hlines:[{y:M.redline, label:'max '+Math.round(M.redline)+' rpm'}], yFmt:y=>Math.round(y).toString(),
    extraTip:x=>M.ratios.map((r,i)=>{ const rpm=x/3.6/M.rDyn*60/(2*Math.PI)*M.totalRatio(i); return rpm>=M.idle*0.99&&rpm<=M.redline?`G${i+1} ${Math.round(rpm)} rpm`:null; }).filter(Boolean)});
  drawPlot(idF, {series:fGear.concat([{name:'best gear', data:env, color:VIZ.s1},{name:'road load', data:road, color:VIZ.s2}]), xLabel:'speed (km/h)', yLabel:'kN', xUnit:'km/h', xMax:vTopK,
    marks:[{x:kmh(top.v), y:perfResist(M, top.v, (perfOpts.grade||0)/100)/1000, label:'top '+kmh(top.v).toFixed(0)+' km/h', color:VIZ.text}], yFmt:y=>y.toFixed(1)});

  el.querySelectorAll('[data-perf]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ const k=inp.dataset.perf; let v=inp.value;
      if(['mu','grade','shiftRpm','launchRpm'].includes(k)){ v = v==='' ? null : parseFloat(v); if(v!=null && isNaN(v)) return; }
      perfOpts[k]=v; renderPanel(); });
  });
}

/* ═══════════════════════════════════════════════════
   AXLE / WHEEL EDITOR  (v4.1 — SVJ §23 multi-axle)
   Structural edits snapshot the whole document so Undo restores it exactly.
   ═══════════════════════════════════════════════════ */
const STATION_OR_AXLE_RE = /^A(\d+)([LRC]?)$/;
const r4 = v => Math.round(v*1e4)/1e4;
function _isVec3(a){ return Array.isArray(a) && a.length===3 && a.every(v=>typeof v==='number'); }
function _walkVec3(o, fn){ if(Array.isArray(o)){ if(_isVec3(o)){ fn(o); return; } o.forEach(x=>_walkVec3(x,fn)); } else if(o && typeof o==='object'){ Object.keys(o).forEach(k=>_walkVec3(o[k],fn)); } }
function _walkObjects(o, fn){ if(Array.isArray(o)) o.forEach(x=>_walkObjects(x,fn)); else if(o && typeof o==='object'){ fn(o); Object.keys(o).forEach(k=>_walkObjects(o[k],fn)); } }

function replaceData(obj){ Object.keys(DATA).forEach(k=>delete DATA[k]); Object.assign(DATA, obj); }
function refreshAfterStructural(){
  const st=stationKeys(DATA.suspension);
  if(!st.includes(suspCorner)) suspCorner=st[0];
  if(highlightCorner && !st.includes(highlightCorner)) highlightCorner=null;
  rebuildCornerDefs(); buildScene(); setupControls(); buildLayerUI(); renderPanel();
}
function structuralEdit(label, fn){
  const before = JSON.parse(JSON.stringify(DATA));
  try { fn(DATA); } catch(err){ replaceData(before); alert('Edit failed: '+err.message); return; }
  if(JSON.stringify(before)===JSON.stringify(DATA)) return;
  changeLog.push({path:'__root__', label, oldVal: before, newVal: null, timestamp: Date.now()});
  updateSaveBar(); refreshAfterStructural();
}

// FL/FR/RL/RR → A1L/A1R/A2L/A2R everywhere (spec §23.1: forms never mixed)
function migrateLegacyStations(d){
  const MAP={FL:'A1L',FR:'A1R',RL:'A2L',RR:'A2R'};
  _walkObjects(d, o=>{
    const ks=Object.keys(o); if(ks.filter(k=>MAP[k]).length<2 || Array.isArray(o)) return;
    ks.forEach(k=>{ o[MAP[k]||k]=o[k]; if(MAP[k]) delete o[k]; });
    // keep insertion order readable
    const copy={...o}; ks.forEach(k=>delete o[MAP[k]||k]); Object.keys(copy).forEach(k=>o[k]=copy[k]);
  });
  _walkObjects(d, o=>{ Object.keys(o).forEach(k=>{ if(typeof o[k]==='string' && MAP[o[k]] && /(ref|station|corner|member)/i.test(k)) o[k]=MAP[o[k]]; if(Array.isArray(o[k]) && o[k].every(x=>typeof x==='string') && o[k].some(x=>MAP[x])) o[k]=o[k].map(x=>MAP[x]||x); }); });
}
function ensureAxles(d){
  if(usesLegacyStations(d)) migrateLegacyStations(d);
  const dt=(d.vehicle_info?.drive_type||'').toUpperCase();
  const derived=axleList(d);
  if(!Array.isArray(d.axles)) d.axles=[];
  derived.forEach((a,i)=>{
    if(d.axles.find(x=>x.id===a.id)) return;
    d.axles.push({id:a.id, position_x:r4(a.position_x??0), track:r4(a.track||0),
      steered: i===0 && !!d.steering, driven: dt==='AWD'||dt==='4WD' ? true : dt==='FWD' ? i===0 : dt==='RWD' ? i===derived.length-1 : false});
  });
  d.axles.sort((a,b)=>(b.position_x??0)-(a.position_x??0));
}
function recomputeWheelFormula(d){
  if(!d.axles?.length) return;
  const vi=d.vehicle_info||(d.vehicle_info={});
  let hubs=0, drv=0, str=0;
  d.axles.forEach(a=>{ const n=stationsOnAxle(d,a.id).length||2; hubs+=n; if(a.driven) drv+=n; if(a.steered) str+=n; });
  vi.wheel_formula = `${hubs}x${drv}` + (str>2 ? `/${str}` : '');
}
// Renumber axle ids (and station keys, refs) with a map like {A3:'A2'}
function renameAxleIds(d, map){
  const ren = v => { const m=STATION_OR_AXLE_RE.exec(v); if(!m){ const p=/^(A\d+)_/.exec(v); return p&&map[p[1]] ? map[p[1]]+v.slice(p[1].length) : v; } const n=map['A'+m[1]]; return n ? n+m[2] : v; };
  _walkObjects(d, o=>{
    if(Array.isArray(o)) return;
    const ks=Object.keys(o);
    if(ks.some(k=>STATION_OR_AXLE_RE.test(k) && ren(k)!==k)){ const copy={}; ks.forEach(k=>copy[ren(k)]=o[k]); ks.forEach(k=>delete o[k]); Object.assign(o,copy); }
    Object.keys(o).forEach(k=>{ if(typeof o[k]==='string') o[k]=ren(o[k]); else if(Array.isArray(o[k]) && o[k].every(x=>typeof x==='string')) o[k]=o[k].map(ren); });
  });
}
function wheelbaseFromAxles(d){
  const ch=d.chassis||{}, groups=d.axle_groups||[];
  const pos={}; (d.axles||[]).forEach(a=>{ if(typeof a.position_x==='number') pos[a.id]=a.position_x; });
  const order=Object.keys(pos).sort((a,b)=>+a.slice(1)-+b.slice(1)); if(order.length<2) return null;
  const xs=order.map(a=>pos[a]); const ref=ch.wheelbase_reference||'last_axle';
  const gaps=xs.slice(0,-1).map((x,i)=>x-xs[i+1]); const cut=gaps.indexOf(Math.max(...gaps))+1;
  const groupOf=aid=>{ const g=groups.find(g=>(g.axle_refs||[]).includes(aid)); if(g) return [...g.axle_refs].sort((a,b)=>+a.slice(1)-+b.slice(1)); return order.slice(0,cut).includes(aid)?order.slice(0,cut):order.slice(cut); };
  const front=groupOf(order[0]), rear=groupOf(order[order.length-1]);
  const mean=ids=>ids.reduce((p,c)=>p+(pos[c]??0),0)/ids.length;
  const centre=id=>{ if(id in pos) return pos[id]; const g=groups.find(g=>g.id===id); return g&&g.axle_refs?.every(a=>a in pos)?mean(g.axle_refs):null; };
  switch(ref){
    case 'last_axle': return xs[0]-xs[xs.length-1];
    case 'bogie_centre': return xs[0]-mean(rear);
    case 'bogie_centres': return mean(front)-mean(rear);
    case 'first_rear_axle': return (front[front.length-1] in pos && rear[0] in pos) ? pos[front[front.length-1]]-pos[rear[0]] : null;
    case 'explicit': { const f=centre(ch.wheelbase_from), t=centre(ch.wheelbase_to); return f!=null&&t!=null?f-t:null; }
    default: return null; // theoretical: keep the declared value
  }
}
function _updateWheelbase(d){ const wb=wheelbaseFromAxles(d); if(wb!=null){ d.chassis=d.chassis||{}; d.chassis.wheelbase=r4(wb); } }
function _trackSync(d){
  const ax=[...(d.axles||[])].sort((a,b)=>b.position_x-a.position_x); if(!ax.length||!d.chassis) return;
  if(typeof ax[0].track==='number') d.chassis.track_front=ax[0].track;
  if(typeof ax[ax.length-1].track==='number') d.chassis.track_rear=ax[ax.length-1].track;
}

function axleAdd(d){
  ensureAxles(d);
  const ax=[...d.axles].sort((a,b)=>b.position_x-a.position_x);
  const last=ax[ax.length-1], prev=ax[ax.length-2];
  const gap = prev ? Math.max(0.9, prev.position_x-last.position_x) : 1.35;
  const nums=d.axles.map(a=>+a.id.slice(1)); const newId='A'+(Math.max(...nums)+1);
  const nx=r4(last.position_x-gap);
  const na=JSON.parse(JSON.stringify(last)); na.id=newId; na.position_x=nx; if(na.label) na.label=na.label.replace(/\d+$/,'').trim();
  d.axles.push(na);
  const src=stationsOnAxle(d,last.id);
  _walkObjects(d, o=>{
    if(Array.isArray(o)) return;
    src.forEach(k=>{ if(o[k]===undefined || o===d.axles) return;
      const nk=newId+sideOf(k); const c=JSON.parse(JSON.stringify(o[k]));
      if(c && typeof c==='object'){ _walkVec3(c, v=>{ v[0]=r4(v[0]-gap); });
        _walkObjects(c, q=>{ if(!Array.isArray(q) && typeof q.id==='string'){ q.id = q.id.startsWith(last.id+'_') ? newId+q.id.slice(last.id.length) : q.id+'_'+newId; } }); }
      o[nk]=c; });
  });
  (d.axle_groups||[]).forEach(g=>{ if((g.axle_refs||[]).includes(last.id)) g.axle_refs.push(newId); });
  (d.suspension_couplings||[]).forEach(c=>{
    if(/circuit/.test(c.type||'') && Array.isArray(c.members)) src.forEach(k=>{ if(c.members.includes(k)) c.members.push(newId+sideOf(k)); });
    if(Array.isArray(c.axle_refs) && /circuit/.test(c.type||'') && c.axle_refs.includes(last.id)) c.axle_refs.push(newId);
  });
  _updateWheelbase(d); _trackSync(d); recomputeWheelFormula(d);
  return newId;
}
function axleRemove(d, id){
  ensureAxles(d);
  if(d.axles.length<=2) throw new Error('A vehicle needs at least two axles.');
  _walkObjects(d, o=>{ if(Array.isArray(o)) return; Object.keys(o).forEach(k=>{ if(STATION_OR_AXLE_RE.test(k) && axleIdOf(k)===id && k!==id) delete o[k]; }); });
  d.axles=d.axles.filter(a=>a.id!==id);
  (d.axle_groups||[]).forEach(g=>{ g.axle_refs=(g.axle_refs||[]).filter(r=>r!==id); });
  if(d.axle_groups) d.axle_groups=d.axle_groups.filter(g=>g.axle_refs.length);
  (d.suspension_couplings||[]).forEach(c=>{ if(c.members) c.members=c.members.filter(m=>axleIdOf(m)!==id); if(c.axle_refs) c.axle_refs=c.axle_refs.filter(r=>r!==id); });
  if(d.suspension_couplings) d.suspension_couplings=d.suspension_couplings.filter(c=>!(c.members&&c.members.length===0));
  if(d.steering){ if(d.steering.additional_axles) d.steering.additional_axles=d.steering.additional_axles.filter(a=>a.axle_ref!==id); if(d.steering.axle_ref===id) delete d.steering.axle_ref; }
  (d.powertrain?.differentials||[]).forEach(df=>{ if(df.axle_ref===id) delete df.axle_ref; });
  // Renumber front-to-back
  const order=[...d.axles].sort((a,b)=>b.position_x-a.position_x), map={};
  order.forEach((a,i)=>{ if(a.id!=='A'+(i+1)) map[a.id]='A'+(i+1); });
  if(Object.keys(map).length) renameAxleIds(d, map);
  d.axles.sort((a,b)=>b.position_x-a.position_x);
  _updateWheelbase(d); _trackSync(d); recomputeWheelFormula(d);
}
function axleSetX(d, id, x){
  ensureAxles(d);
  const a=d.axles.find(q=>q.id===id); const dx=x-(a.position_x??0); a.position_x=r4(x);
  stationsOnAxle(d,id).forEach(k=>_walkVec3(d.suspension[k], v=>{ v[0]=r4(v[0]+dx); }));
  const order=[...d.axles].sort((p,q)=>q.position_x-p.position_x), map={};
  order.forEach((q,i)=>{ if(q.id!=='A'+(i+1)) map[q.id]='A'+(i+1); });
  if(Object.keys(map).length) renameAxleIds(d, map);
  d.axles.sort((p,q)=>q.position_x-p.position_x);
  _updateWheelbase(d);
}
function axleSetTrack(d, id, tr){
  ensureAxles(d);
  const a=d.axles.find(q=>q.id===id); const dt=tr-(a.track||0); a.track=r4(tr);
  stationsOnAxle(d,id).forEach(k=>{ const s=sideOf(k); if(s==='C') return; const sg=s==='L'?-1:1;
    _walkVec3(d.suspension[k], v=>{ if(Math.abs(v[1])>0.05) v[1]=r4(v[1]+sg*dt/2); }); });
  _trackSync(d);
}
function axleSetFlag(d, id, flag, on){
  ensureAxles(d);
  const a=d.axles.find(q=>q.id===id); a[flag]=!!on;
  if(flag==='liftable'){ if(on && !a.lift) a.lift={mechanism:'air_lift_spring', placement: d.axles.indexOf(a)===d.axles.length-1?'tag':'pusher', travel:0.15, _est:true}; if(!on) delete a.lift; }
  recomputeWheelFormula(d);
}
function axleSetWheels(d, id, n, spacing){
  ensureAxles(d);
  stationsOnAxle(d,id).forEach(k=>{
    const w=d.suspension[k].wheel||(d.suspension[k].wheel={});
    if(n<=1){ delete w.multiplicity; delete w.dual_spacing; delete w.positions; return; }
    const sp = spacing || w.dual_spacing || 0.33;
    w.multiplicity=n; w.dual_spacing=r4(sp);
    w.positions = n===2 ? [{label:'inner',offset_outboard:r4(-sp/2)},{label:'outer',offset_outboard:r4(sp/2)}]
                        : Array.from({length:n},(_,i)=>({label:'#'+(i+1),offset_outboard:r4((i-(n-1)/2)*sp)}));
  });
}

/* ── Top-view axle layout diagram (SVG) ── */
function axleDiagram(d){
  const AX=axleList(d).filter(a=>typeof a.position_x==='number'); if(!AX.length) return '';
  const W=340, padL=24, padR=24;
  const xs=AX.map(a=>a.position_x), xF=Math.max(...xs), xR=Math.min(...xs);
  const cls=d.vehicle_info?.vehicle_class, cg=d.chassis?.center_of_gravity;
  const front = Math.max(xF+1.0, cg && cg[0]>xF ? cg[0]+0.8 : -1e9), rear = xR-1.0;
  const trMax=Math.max(1.4,...AX.map(a=>a.track||0));
  const sc=Math.min((W-padL-padR)/(front-rear), 96/(trMax+0.9));
  const X = x => padL + (front-x)*sc; let Y;
  const groups=(d.axle_groups||[]);
  const rMax=Math.max(0.35,...AX.map(a=>a.stations.length?stationTireR(d.suspension[a.stations[0]],d):0.35));
  Y = y => 16 + (Math.max(...AX.map(a=>(a.track||1.5)/2))+Math.max(0.3,rMax)+0.05)*sc + y*sc;
  let g='';
  // body outline
  const half=Math.max(...AX.map(a=>(a.track||1.5)/2))+0.3;
  g+=`<rect x="${X(front)}" y="${Y(-half)}" width="${(front-rear)*sc}" height="${2*half*sc}" rx="4" fill="none" stroke="var(--brd)" stroke-dasharray="3 3"/>`;
  g+=`<text x="${X(front)+2}" y="${Y(half)+10}" fill="var(--txM)" font-size="7.5">◀ FRONT</text>`;
  AX.forEach(a=>{
    const px=X(a.position_x), t2=(a.track||1.5)/2;
    const sts=a.stations; const corn=sts.length?d.suspension[sts[0]]:null;
    const tyreR=corn?stationTireR(corn,d):0.35, tw=(corn?resolveTireDims(corn,d).secW:0.25);
    const wp=corn?wheelPositions(corn.wheel||{}):[{off:0}];
    const col = a.driven?'var(--og)':'var(--txD)';
    g+=`<line x1="${px}" y1="${Y(-t2)}" x2="${px}" y2="${Y(t2)}" stroke="${col}" stroke-width="${a.driven?2.2:1.2}"/>`;
    const sideYs = sts.length ? sts.map(k=>({k, y: sideOf(k)==='C'?0:(sideOf(k)==='L'?-t2:t2)})) : [{k:null,y:-t2},{k:null,y:t2}];
    sideYs.forEach(({k,y})=>{
      wp.forEach(p=>{
        const yy = y + (y<0?-1:1)*(p.off||0);
        const lift=a.liftable, steer=a.steered;
        g+=`<rect ${k?`data-station="${k}"`:''} class="axd-wheel" x="${px-tyreR*sc}" y="${Y(yy)-tw*sc/2}" width="${2*tyreR*sc}" height="${Math.max(2,tw*sc)}" rx="1.5"
             fill="${a.driven?'rgba(255,140,66,0.35)':'rgba(110,122,150,0.25)'}" stroke="${steer?'var(--cy)':(k?stationColor(k):'var(--txD)')}" stroke-width="${steer?1.6:1}" ${lift?'stroke-dasharray="2 1.5"':''}><title>${k||a.id}${wp.length>1?' '+(p.label||''):''}</title></rect>`;
      });
    });
    g+=`<text x="${px}" y="${Y(-t2)-tyreR*sc-4}" text-anchor="middle" fill="${a.steered?'var(--cy)':'var(--tx)'}" font-size="9" font-weight="700">${a.id}</text>`;
    const fl=[a.steered?'S':'',a.driven?'D':'',a.liftable?'L':'',a.wheelsPerStation>1?a.wheelsPerStation+'×':''].filter(Boolean).join(' ');
    if(fl) g+=`<text x="${px}" y="${Y(t2)+tyreR*sc+9}" text-anchor="middle" fill="var(--txD)" font-size="7.5">${fl}</text>`;
  });
  // spacing dims
  const dimY=Y(half)+24; const H=Math.round(dimY+(groups.length?(groups.length>1?36:26):10));
  for(let i=0;i<AX.length-1;i++){
    const a=AX[i], b=AX[i+1], x1=X(a.position_x), x2=X(b.position_x);
    g+=`<line x1="${x1}" y1="${dimY}" x2="${x2}" y2="${dimY}" stroke="var(--txM)"/><line x1="${x1}" y1="${dimY-3}" x2="${x1}" y2="${dimY+3}" stroke="var(--txM)"/><line x1="${x2}" y1="${dimY-3}" x2="${x2}" y2="${dimY+3}" stroke="var(--txM)"/>`;
    g+=`<text x="${(x1+x2)/2}" y="${dimY-3}" text-anchor="middle" fill="var(--tx)" font-size="8">${Math.round((a.position_x-b.position_x)*1000)}</text>`;
  }
  // groups
  groups.forEach((gr,i)=>{
    const gx=(gr.axle_refs||[]).map(r=>AX.find(a=>a.id===r)?.position_x).filter(v=>typeof v==='number'); if(!gx.length) return;
    const x1=X(Math.max(...gx))-6, x2=X(Math.min(...gx))+6, yb=dimY+10+(i%2)*11;
    g+=`<path d="M${x1} ${yb-3} V${yb} H${x2} V${yb-3}" fill="none" stroke="var(--bl)"/><text x="${(x1+x2)/2}" y="${yb+9}" text-anchor="middle" fill="var(--bl)" font-size="7.5">${gr.id}${gr.max_load_legal?' · '+Math.round(gr.max_load_legal/9.80665/100)/10+' t':''}</text>`;
  });
  // CG
  if(cg && typeof cg[0]==='number'){ const cx=X(cg[0]), cy=Y(cg[1]||0); g+=`<circle cx="${cx}" cy="${cy}" r="4.5" fill="none" stroke="var(--ac)"/><path d="M${cx-6} ${cy}H${cx+6}M${cx} ${cy-6}V${cy+6}" stroke="var(--ac)"/><text x="${cx+7}" y="${cy-5}" fill="var(--ac)" font-size="7.5">CG</text>`; }
  const wf=d.vehicle_info?.wheel_formula, wb=d.chassis?.wheelbase;
  const legend=`<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:8.5px;font-family:JetBrains Mono,monospace;color:var(--txD);margin-top:2px">
    <span><span style="color:var(--cy)">▭</span> steered</span><span><span style="color:var(--og)">■</span> driven</span><span>┅ liftable</span><span>2× duals</span><span style="color:var(--txM)">dims mm · click a wheel</span></div>`;
  return section('Axle Layout'+(wf?' · '+wf:'')+(wb?' · WB '+wb.toFixed(3)+' m'+(d.chassis.wheelbase_reference?' ('+d.chassis.wheelbase_reference.replace(/_/g,' ')+')':''):''),
    `<svg id="axle-diagram" viewBox="0 0 ${W} ${H}" width="100%" style="display:block;background:var(--s1);border:1px solid var(--brd);border-radius:4px;font-family:JetBrains Mono,monospace">${g}</svg>${legend}`);
}

// Delegated handlers (panel content is re-rendered, so bind once)
(function bindAxleEditor(){
  const pc=document.getElementById('panel-content');
  pc.addEventListener('click', e=>{
    const wheel=e.target.closest('.axd-wheel[data-station]');
    if(wheel){ suspCorner=wheel.dataset.station; highlightCorner=suspCorner; activePanel='suspension'; buildPanelTabs(); buildLayerUI(); applyCornerHighlight(); renderPanel(); return; }
    const b=e.target.closest('button[data-ax-action]'); if(!b) return;
    const id=b.dataset.axle;
    if(b.dataset.axAction==='add') structuralEdit('add axle', d=>axleAdd(d));
    if(b.dataset.axAction==='remove'){ if(confirm('Remove axle '+id+' and its wheel stations?')) structuralEdit('remove '+id, d=>axleRemove(d,id)); }
  });
  pc.addEventListener('change', e=>{
    const t=e.target; if(!t.dataset || !t.dataset.axAction) return;
    const id=t.dataset.axle, act=t.dataset.axAction;
    if(act==='x'){ const v=parseFloat(t.value); if(!isNaN(v)) structuralEdit(id+' position_x', d=>axleSetX(d,id,v)); }
    if(act==='track'){ const v=parseFloat(t.value); if(!isNaN(v) && v>=0) structuralEdit(id+' track', d=>axleSetTrack(d,id,v)); }
    if(act==='flag') structuralEdit(id+' '+t.dataset.flag, d=>axleSetFlag(d,id,t.dataset.flag,t.checked));
    if(act==='wheels') structuralEdit(id+' wheels', d=>axleSetWheels(d,id,+t.value));
    if(act==='dual'){ const v=parseFloat(t.value); if(v>0) structuralEdit(id+' dual spacing', d=>axleSetWheels(d,id,2,v)); }
  });
})();

/* ── Multi-axle quick checks shown in the Overview validation box ── */
function multiAxleWarnings(d){
  const w=[]; const st=stationKeys(d.suspension);
  if(st.some(k=>LEGACY_AXLE[k]) && st.some(k=>!LEGACY_AXLE[k])) w.push('Station names mix FL/FR/RL/RR with A{n}{L|R|C} (§23.1).');
  const ax=d.axles||[];
  if(ax.length){
    const sorted=[...ax].sort((a,b)=>b.position_x-a.position_x);
    sorted.forEach((a,i)=>{ if(a.id!=='A'+(i+1)) w.push(`Axle ids should be A1…A${ax.length} front to back (found ${a.id} in position ${i+1}).`); });
    ax.forEach(a=>{ if(!stationsOnAxle(d,a.id).length && !usesLegacyStations(d)) w.push(`Axle ${a.id} has no wheel stations.`); });
    st.forEach(k=>{ const id=axleIdOf(k); if(!ax.find(a=>a.id===id)) w.push(`Station ${k} has no entry in axles[].`); });
    ax.forEach(a=>{ stationsOnAxle(d,a.id).forEach(k=>{ const wc=d.suspension[k]?.topology?.upright?.hardpoints?.wheel_center; if(wc && typeof a.position_x==='number' && Math.abs(wc[0]-a.position_x)>0.05) w.push(`${k} wheel_center x ${wc[0].toFixed(3)} ≠ ${a.id}.position_x ${a.position_x.toFixed(3)}.`); }); });
  }
  return w;
}

// Hardpoint editor grid for a suspension corner

  const hp = getDeep(DATA, 'suspension.' + corner + '.topology.upright.hardpoints') || {};

  // Outboard hardpoints
  Object.keys(hp).forEach(name => {
    const basePath = 'suspension.' + corner + '.topology.upright.hardpoints.' + name;

    }

  });
  
  // Inboard points from links
  links.forEach((link, li) => {

      const basePath = 'suspension.' + corner + '.topology.links.' + li + '.inboard_points.' + pi;
      h += '<div class="hp-row"><div class="hp-name" title="' + link.name + ' ib' + pi + '" style="color:var(--pr)">' + link.name.replace(/_/g,' ') + ' ib' + pi + '</div>';
      for(let i = 0; i < 3; i++) {
        const p = basePath + '.' + i;
        const v = getDeep(DATA, p);
        const isChanged = changeLog.some(c => c.path === p);
        h += '<input class="hp-coord' + (isChanged?' changed':'') + '" type="number" step="0.001" value="' + (v!=null?v.toFixed(4):'') + '" data-path="' + p + '" />';
      }
      h += '</div>';
    });
  });
  
  // Spring/damper mounts
  ['spring.inboard_mount','spring.outboard_mount','damper.inboard_mount','damper.outboard_mount'].forEach(sub => {
    const val = getDeep(DATA, 'suspension.' + corner + '.' + sub);
    if(!val) return;
    const basePath = 'suspension.' + corner + '.' + sub;
    h += '<div class="hp-row"><div class="hp-name" style="color:var(--gn)">' + sub.replace(/\./g,' ').replace(/_/g,' ') + '</div>';
    for(let i = 0; i < 3; i++) {

      const v = getDeep(DATA, p);
      const isChanged = changeLog.some(c => c.path === p);

    }
    h += '</div>';
  });
  
  h += '</div>';
  return h;
}

// Attach click-to-edit on .editable elements
function attachEditors(container) {
  container = container || document;
  
  // Inline text editing
  container.querySelectorAll('.editable').forEach(el => {
    if(el.dataset.bound) return;
    el.dataset.bound = '1';
    el.addEventListener('dblclick', () => {
      const path = el.dataset.path;
      const type = el.dataset.type || 'number';
      const currentVal = getDeep(DATA, path);
      const input = document.createElement('input');
      input.className = 'edit-input';
      input.type = type === 'number' ? 'number' : 'text';
      input.step = 'any';
      input.value = currentVal != null ? currentVal : '';
      el.textContent = '';
      el.appendChild(input);
      input.focus();
      input.select();
      
      const commit = () => {
        let val = input.value;
        if(type === 'number') val = parseFloat(val);
        if(val !== '' && !isNaN(val)) {
          applyEdit(path, val);
        }
        renderPanel();
        // Rebuild 3D if needed
        if(/\.wheel\.dual_spacing$/.test(path) && !isNaN(val)) { const k=path.split('.')[1]; const w=DATA.suspension[k].wheel; if(Array.isArray(w.positions)&&w.positions.length===2){ w.positions[0].offset_outboard=r4(-val/2); w.positions[1].offset_outboard=r4(val/2); } }
        if(path.includes('center_of_gravity') || path.includes('mass_total') || path.includes('wheelbase') || path.includes('track_') || path.includes('wheel.') || path.includes('brake.disc')) {
          buildScene(); setupControls(); buildLayerUI();
        }
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', e => {
        if(e.key === 'Enter') commit();
        if(e.key === 'Escape') { renderPanel(); }
      });
    });
  });
  
  // Hardpoint coordinate inputs
  container.querySelectorAll('.hp-coord[data-path]').forEach(input => {
    if(input.dataset.bound) return;
    input.dataset.bound = '1';
    let origVal = input.value;
    
    input.addEventListener('change', () => {
      const path = input.dataset.path;
      const newVal = parseFloat(input.value);
      if(!isNaN(newVal)) {
        applyEdit(path, newVal);
        input.classList.toggle('changed', true);
        // Rebuild 3D
        buildScene(); setupControls(); buildLayerUI();
      }
    });
    
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter') input.blur();
      if(e.key === 'Escape') { input.value = origVal; input.blur(); }
    });
  });
}

// Override renderPanel to attach editors after render
const _origRenderPanel = renderPanel;

/* ═══════════════════════════════════════════════════
   STEP EXPORTER  (ISO 10303-21 / AP203 wireframe)
   Extracts suspension geometry as points + lines
   Coordinates in mm, SAE J670 axis convention
   ═══════════════════════════════════════════════════ */
window.exportSTEP = function() {
  const data = DATA;
  if(!data) { alert('No data loaded'); return; }

  let eid = 0;
  const ne = () => '#' + (++eid);
  const lines = [];
  const push = s => lines.push(s);

  const pts = new Map();
  function cpt(coord, label) {
    if(!coord || coord.length < 3) return null;
    const mm = coord.map(v => (v * 1000).toFixed(4));
    const key = mm.join(',');
    if(pts.has(key)) return pts.get(key);
    const id = ne();
    push(id + "=CARTESIAN_POINT('" + (label||'') + "',(" + mm.join(',') + "));");
    pts.set(key, id);
    return id;
  }

  const polylines = [];
  function seg(p1Id, p2Id, label) {
    if(!p1Id || !p2Id || p1Id === p2Id) return null;
    const id = ne();
    push(id + "=POLYLINE('" + (label||'') + "',(" + p1Id + "," + p2Id + "));");
    polylines.push(id);
    return id;
  }

  // CG
  const ch = data.chassis || {};
  if(ch.center_of_gravity) cpt(ch.center_of_gravity, 'CG');

  // Aero CoP
  if(data.aerodynamics && data.aerodynamics.center_of_pressure)
    cpt(data.aerodynamics.center_of_pressure, 'Aero_CoP');

  // Steering rack
  const st = data.steering;
  if(st && st.rack_position) {
    const rId = cpt(st.rack_position, 'steering_rack');
    if(st.tie_rod_inboard) {
      ['left','right'].forEach(function(side) {
        const c = st.tie_rod_inboard[side];
        if(c) { const tId = cpt(c, 'tie_rod_inboard_' + side); seg(rId, tId, 'rack_to_tie_rod_' + side); }
      });
    }
  }

  // Suspension corners
  stationKeys(data.suspension).forEach(function(cn) {
    const corn = data.suspension ? data.suspension[cn] : null;
    if(!corn || !corn.topology) return;
    const hp = (corn.topology.upright && corn.topology.upright.hardpoints) || {};
    const lnks = corn.topology.links || [];

    const hpIds = {};
    Object.entries(hp).forEach(function(pair) {
      hpIds[pair[0]] = cpt(pair[1], cn + '_' + pair[0]);
    });

    lnks.forEach(function(link) {
      const ref = (link.outboard_ref || '').replace('hardpoints.', '');
      const obId = hpIds[ref];
      if(!obId) return;
      (link.inboard_points || []).forEach(function(ip, i) {
        const ibId = cpt(ip, cn + '_' + link.name + '_ib' + i);
        seg(ibId, obId, cn + '_' + link.name + (i > 0 ? '_' + i : ''));
      });
    });

    var sp2 = corn.spring;
    if(sp2 && sp2.inboard_mount && sp2.outboard_mount) {
      var siId = cpt(sp2.inboard_mount, cn + '_spring_top');
      var soId = cpt(sp2.outboard_mount, cn + '_spring_btm');
      seg(siId, soId, cn + '_spring');
    }

    var dm2 = corn.damper;
    if(dm2 && dm2.inboard_mount && dm2.outboard_mount) {
      var diId = cpt(dm2.inboard_mount, cn + '_damper_top');
      var doId = cpt(dm2.outboard_mount, cn + '_damper_btm');
      seg(diId, doId, cn + '_damper');
    }

    if(hpIds.wheel_center && hpIds.upper_ball_joint)
      seg(hpIds.wheel_center, hpIds.upper_ball_joint, cn + '_kingpin_upper');
    if(hpIds.wheel_center && hpIds.lower_ball_joint)
      seg(hpIds.wheel_center, hpIds.lower_ball_joint, cn + '_kingpin_lower');

    if(hpIds.steering_tie_rod_end && st && st.tie_rod_inboard) {
      var side = cn.endsWith('L') ? 'left' : 'right';
      var inb = st.tie_rod_inboard[side];
      if(inb) { var ibId2 = cpt(inb, cn + '_tie_rod_inboard'); seg(ibId2, hpIds.steering_tie_rod_end, cn + '_tie_rod'); }
    }

    if(hpIds.toe_link_end) {
      var tl = lnks.find(function(l){ return l.name === 'toe_link'; });
      if(tl && tl.inboard_points && tl.inboard_points[0]) {
        var tId = cpt(tl.inboard_points[0], cn + '_toe_link_ib');
        seg(tId, hpIds.toe_link_end, cn + '_toe_link');
      }
    }
  });

  // Drivetrain
  var pt2 = data.powertrain;
  if(pt2) {
    if(pt2.engine && pt2.engine.position) cpt(pt2.engine.position, 'engine');
    if(pt2.gearbox && pt2.gearbox.position) cpt(pt2.gearbox.position, 'gearbox');
    if(pt2.clutch && pt2.clutch.position) cpt(pt2.clutch.position, 'clutch');

    (pt2.driveshafts || []).forEach(function(ds) {
      var fj = ds.joint_front ? ds.joint_front.position : null;
      var rj = ds.joint_rear ? ds.joint_rear.position : null;
      if(fj && rj) { var fjId = cpt(fj, ds.id + '_front'); var rjId = cpt(rj, ds.id + '_rear'); seg(fjId, rjId, ds.id); }
    });

    (pt2.differentials || []).forEach(function(df) {
      if(!df.position) return;
      var dId = cpt(df.position, df.id);
      [['output_left', df.output_left], ['output_right', df.output_right]].forEach(function(pair) {
        if(pair[1]) { var oId = cpt(pair[1], df.id + '_' + pair[0]); seg(dId, oId, df.id + '_' + pair[0]); }
      });
    });

    if(pt2.half_shafts) Object.entries(pt2.half_shafts).forEach(function(pair) {
      var side = pair[0], hs = pair[1];
      var ci = hs.cv_inner ? hs.cv_inner.position : null;
      var co = hs.cv_outer ? hs.cv_outer.position : null;
      if(ci && co) { var ciId = cpt(ci, 'halfshaft_' + side + '_inner'); var coId = cpt(co, 'halfshaft_' + side + '_outer'); seg(ciId, coId, 'halfshaft_' + side); }
    });
  }

  // GEOMETRIC_CURVE_SET
  var allPtIds = Array.from(pts.values());
  var members = allPtIds.concat(polylines).join(',');
  var gcsId = ne();
  push(gcsId + "=GEOMETRIC_CURVE_SET('SVJ_Suspension',(" + members + "));");

  // Representation context (mm, radians)
  var mmId = ne(); push(mmId + "=(LENGTH_UNIT()NAMED_UNIT(*)SI_UNIT(.MILLI.,.METRE.));");
  var radId = ne(); push(radId + "=(NAMED_UNIT(*)PLANE_ANGLE_UNIT()SI_UNIT($,.RADIAN.));");
  var srId = ne(); push(srId + "=(NAMED_UNIT(*)SI_UNIT($,.STERADIAN.)SOLID_ANGLE_UNIT());");
  var uncId = ne(); push(uncId + "=UNCERTAINTY_MEASURE_WITH_UNIT(LENGTH_MEASURE(0.01)," + mmId + ",'distance accuracy');");
  var ctxId = ne();
  push(ctxId + "=(GEOMETRIC_REPRESENTATION_CONTEXT(3)GLOBAL_UNCERTAINTY_ASSIGNED_CONTEXT((" + uncId + "))GLOBAL_UNIT_ASSIGNED_CONTEXT((" + mmId + "," + radId + "," + srId + "))REPRESENTATION_CONTEXT('Context3D',''));");

  var srep = ne();
  push(srep + "=GEOMETRICALLY_BOUNDED_WIREFRAME_SHAPE_REPRESENTATION('SVJ_Suspension_Geometry',(" + gcsId + ")," + ctxId + ");");

  var appCtx = ne(); push(appCtx + "=APPLICATION_CONTEXT('automotive design');");
  var prodCtx = ne(); push(prodCtx + "=PRODUCT_CONTEXT(''," + appCtx + ",'mechanical');");
  var vi = data.vehicle_info || {};
  var prodName = [vi.make, vi.model, vi.year, vi.variant].filter(Boolean).join(' ') || 'SVJ Vehicle';
  var safeName = prodName.replace(/'/g, '');
  var prod = ne(); push(prod + "=PRODUCT('" + safeName + "','" + safeName + "','',(" + prodCtx + "));");
  var pdf2 = ne(); push(pdf2 + "=PRODUCT_DEFINITION_FORMATION('',''," + prod + ");");
  var pdCtx = ne(); push(pdCtx + "=PRODUCT_DEFINITION_CONTEXT('part definition'," + appCtx + ",'design');");
  var pd = ne(); push(pd + "=PRODUCT_DEFINITION('design',''," + pdf2 + "," + pdCtx + ");");
  var pds = ne(); push(pds + "=PRODUCT_DEFINITION_SHAPE('',''," + pd + ");");
  var sdr = ne(); push(sdr + "=SHAPE_DEFINITION_REPRESENTATION(" + pds + "," + srep + ");");

  // Assemble file
  var now = new Date().toISOString().replace(/[-:]/g, '').split('.')[0];
  var safeFile = prodName.replace(/[^a-zA-Z0-9_ -]/g, '');
  var header = [
    "ISO-10303-21;",
    "HEADER;",
    "FILE_DESCRIPTION(('SVJ Suspension Geometry Export'),'2;1');",
    "FILE_NAME('" + safeFile + ".step','" + now + "',('SVJ Viewer'),(''),'',' ','');",
    "FILE_SCHEMA(('AUTOMOTIVE_DESIGN { 1 0 10303 214 1 1 1 1 }'));",
    "ENDSEC;",
    "DATA;"
  ];
  var footer = ["ENDSEC;", "END-ISO-10303-21;"];
  var full = header.concat(lines).concat(footer).join('\n');

  // Download with filename prompt
  var defaultName = (prodName.replace(/[^a-zA-Z0-9_-]/g, '_') || 'svj_suspension') + '.step';
  var chosen = prompt('Save STEP file as:', defaultName);
  if(!chosen) return;
  var fileName = (chosen.endsWith('.step') || chosen.endsWith('.stp')) ? chosen : chosen + '.step';
  var blob = new Blob([full], {type: 'application/step'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

// Boot
loadData(DEMO);
animate();
</script>
<div id="save-bar">
  <div><span class="changes-count" id="changes-count">0 changes</span> · Press Ctrl+S to save</div>
  <div style="display:flex;gap:6px">
    <button class="btn-discard" id="btn-discard" title="Discard all changes">✗ Discard</button>
    <button class="btn-undo" id="btn-undo" title="Undo last change">↶ Undo</button>
    <button class="btn-save" id="btn-save" title="Download modified .svj.json">↓ Save .svj.json</button>
  </div>
</div>
</body>
</html>
