<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVJ 3D Vehicle Inspector v4.7</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
:root{--bg:#08090c;--s1:#0f1117;--s2:#161a24;--s3:#1c2130;--brd:#252b3a;--brdL:#333b50;--tx:#dfe3ed;--txD:#6e7a96;--txM:#404c66;--ac:#ff5131;--acD:#ff513130;--bl:#4d9fff;--gn:#34d27b;--yl:#f0b429;--pr:#b06aff;--cy:#2dd4bf;--rd:#f0524f;--og:#ff8c42}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.mono{font-family:'JetBrains Mono','SF Mono',monospace}
#topbar{height:36px;min-height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--brd);background:var(--s1)}
#topbar .logo{font-size:15px;font-weight:800;color:var(--ac);letter-spacing:-1px}
#topbar .subtitle{font-size:11px;color:var(--txD);margin-left:8px}
#topbar .filename{font-size:9px;color:var(--txM);background:var(--bg);padding:1px 5px;border-radius:2px;margin-left:8px}
.btn{padding:2px 8px;border-radius:3px;border:1px solid var(--brd);background:transparent;color:var(--txD);font-family:'JetBrains Mono',monospace;font-size:9px;cursor:pointer}
.btn:hover{border-color:var(--brdL);color:var(--tx)}
.btn-ac{border-color:var(--ac);color:var(--ac);font-weight:600}
#main{flex:1;display:flex;overflow:hidden}
#viewport{flex:1;position:relative;overflow:hidden}
#viewport canvas{display:block}
#tooltip{position:fixed;background:rgba(15,17,23,0.95);border:1px solid var(--brdL);border-radius:3px;padding:4px 8px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--tx);pointer-events:none;z-index:100;white-space:pre;line-height:1.4;backdrop-filter:blur(6px);display:none}
#layers{position:absolute;bottom:10px;left:10px;background:rgba(15,17,23,0.92);border:1px solid var(--brd);border-radius:5px;padding:6px 8px;backdrop-filter:blur(8px);max-width:165px;z-index:50}
#layers .hdr{font-size:8px;color:var(--txD);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.layer-row{display:flex;align-items:center;gap:5px;cursor:pointer;padding:1px 0;font-size:9px;font-family:'JetBrains Mono',monospace}
.layer-dot{width:8px;height:8px;border-radius:2px;transition:all .12s}
.corner-bar{border-top:1px solid var(--brd);margin-top:4px;padding-top:3px}
.corner-btn{padding:1px 5px;border-radius:2px;border:1px solid var(--brd);background:transparent;font-family:'JetBrains Mono',monospace;font-size:8px;cursor:pointer;color:var(--txD)}
.corner-btn.active{font-weight:700}
#controls-hint{position:absolute;bottom:10px;right:10px;background:rgba(15,17,23,0.65);border-radius:3px;padding:2px 6px;font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--txM);z-index:50}
#sidebar{width:370px;min-width:370px;border-left:1px solid var(--brd);background:var(--s1);display:flex;flex-direction:column;overflow:hidden;transition:width .2s}
#sidebar.hidden{width:0;min-width:0;padding:0;overflow:hidden}
#panel-tabs{display:flex;gap:1px;padding:4px 6px;border-bottom:1px solid var(--brd);flex-wrap:wrap}
.ptab{padding:2px 9px;border-radius:3px;border:none;background:transparent;color:var(--txD);font-family:'JetBrains Mono',monospace;font-size:9px;cursor:pointer}
.ptab.active{background:var(--acD);color:var(--ac);font-weight:700}
#panel-content{flex:1;overflow:auto;padding:10px 10px 50px}
.tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.4px}
.stat-box{padding:8px 10px;background:var(--s2);border:1px solid var(--brd);border-radius:5px}
.stat-label{font-size:9px;color:var(--txD);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.7px;margin-bottom:1px}
.stat-value{font-size:16px;font-weight:700}
.stat-unit{font-size:10px;color:var(--txD);margin-left:2px}
.section-title{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--ac);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;border-bottom:1px solid var(--brd);padding-bottom:3px}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.kv-row{display:flex;justify-content:space-between;padding:1px 0}
.kv-key{font-size:10px;color:var(--txD);font-family:'JetBrains Mono',monospace}
.kv-val{font-size:10px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px}
.flex-wrap{display:flex;gap:3px;flex-wrap:wrap}
.mb4{margin-bottom:4px}.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}
.chart-box{background:var(--s1);border:1px solid var(--brd);border-radius:5px;padding:8px;margin-bottom:10px}
.chart-title{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--txD);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
#drop-overlay{position:fixed;inset:0;background:rgba(255,81,49,0.06);border:3px dashed var(--ac);z-index:999;display:none;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--ac)}
.corner-sel{padding:3px 10px;border-radius:3px;border:1px solid var(--brd);background:transparent;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;cursor:pointer;color:var(--txD)}
.corner-sel.active{border-color:var(--ac);background:var(--acD);color:var(--ac)}
.gear-box{background:var(--s2);border:1px solid var(--brd);border-radius:3px;padding:3px 7px;text-align:center}
.gear-num{font-size:8px;color:var(--txD);font-family:'JetBrains Mono',monospace}
.gear-val{font-size:13px;font-weight:700}

/* Editor styles */
.editable{cursor:pointer;position:relative;transition:background .15s}
.editable:hover{background:var(--acD);border-radius:2px}
.editable.changed{color:var(--yl) !important}
.edit-input{background:var(--bg);border:1px solid var(--ac);border-radius:3px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 4px;width:90px;outline:none}
.edit-input:focus{border-color:var(--yl);box-shadow:0 0 6px var(--yl)30}
#save-bar{display:none;position:fixed;bottom:0;left:0;right:0;height:36px;background:var(--s1);border-top:1px solid var(--yl);padding:0 16px;align-items:center;justify-content:space-between;z-index:200;font-family:'JetBrains Mono',monospace;font-size:10px}
#save-bar.show{display:flex}
#save-bar .changes-count{color:var(--yl)}
.btn-save{padding:4px 14px;border-radius:4px;border:1px solid var(--gn);background:var(--gn)20;color:var(--gn);font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer;font-weight:700}
.btn-save:hover{background:var(--gn)40}
.btn-undo{padding:4px 14px;border-radius:4px;border:1px solid var(--yl);background:transparent;color:var(--yl);font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer}
.btn-discard{padding:4px 14px;border-radius:4px;border:1px solid var(--rd);background:transparent;color:var(--rd);font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer}
.hp-editor{background:var(--s2);border:1px solid var(--brdL);border-radius:5px;padding:8px;margin-bottom:8px}
.hp-row{display:grid;grid-template-columns:120px 1fr 1fr 1fr;gap:4px;align-items:center;padding:2px 0;border-bottom:1px solid var(--brd)15}
.hp-row .hp-name{font-size:9px;color:var(--txD);font-family:'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis}
.hp-coord{background:var(--bg);border:1px solid var(--brd);border-radius:2px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 4px;width:100%;text-align:right;outline:none}
.hp-coord:focus{border-color:var(--ac);box-shadow:0 0 4px var(--ac)30}
.hp-coord.changed{color:var(--yl);border-color:var(--yl)60}
.axis-label{font-size:8px;color:var(--txM);font-family:'JetBrains Mono',monospace;text-align:center}

</style>
</head>
<body>

<div id="drop-overlay">Drop .svj.json, .glb, or a vehicle folder</div>

<div id="topbar">
  <div style="display:flex;align-items:center">
    <span class="logo mono">SVJ</span>
    <span class="subtitle mono">3D Inspector v4.7 — Editor · SVJ v0.102</span>
    <span class="filename mono" id="file-name">MX-5 ND2 Club 6MT (v0.96 demo)</span>
  </div>
  <div style="display:flex;gap:4px;align-items:center">
    <button class="btn" id="btn-reset-cam">⌂ Reset</button>
    <button class="btn" id="btn-toggle-panel">◁ Panel</button>
    <button class="btn" id="btn-export" style="border-color:var(--gn);color:var(--gn)" title="Save vehicle data as .svj.json">↓ Save SVJ</button>
    <button class="btn" onclick="exportSTEP()" style="border-color:#2dd4bf;color:#2dd4bf" title="Export suspension geometry as .step for CAD">↓ Export STEP</button>
    <button class="btn" id="btn-load-glb" style="border-color:var(--pr);color:var(--pr)" title="Load .glb/.gltf mesh file(s) to overlay on physics geometry">⬡ Mesh</button>
    <button class="btn btn-ac" id="btn-load">SVJ</button>
    <input type="file" id="file-input" accept=".json,.glb,.gltf" multiple style="display:none">
    <input type="file" id="glb-file-input" accept=".glb,.gltf" multiple style="display:none">
  </div>
</div>

<div id="main">
  <div id="viewport">
    <div id="tooltip"></div>
    <div id="layers">
      <div class="hdr">Layers</div>
      <div id="layer-list"></div>
      <div class="corner-bar">
        <div class="hdr">Corner</div>
        <div id="corner-btns" class="flex-wrap"></div>
      </div>
    </div>
    <div id="view-presets" style="position:absolute;top:10px;left:10px;display:flex;gap:2px;z-index:50">
      <button class="btn" onclick="setView('iso')" title="Isometric">◇ Iso</button>
      <button class="btn" onclick="setView('front')" title="Front">▷ Front</button>
      <button class="btn" onclick="setView('rear')" title="Rear">◁ Rear</button>
      <button class="btn" onclick="setView('left')" title="Left">△ Left</button>
      <button class="btn" onclick="setView('right')" title="Right">▽ Right</button>
      <button class="btn" onclick="setView('top')" title="Top">◻ Top</button>
    </div>
    <div id="controls-hint">LMB: Orbit / Click Mesh to select · RMB: Pan · Scroll: Zoom · Hover: Inspect · [G]rab [E]rotate [S]cale [Esc]deselect · R: Reset cam</div>
  </div>
  <div id="sidebar">
    <div id="panel-tabs"></div>
    <div id="panel-content"></div>
  </div>
</div>

<script type="importmap">

  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",

    "three/examples/jsm/controls/TransformControls.js": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/TransformControls.js"
  }
}
</script>

// Resolve tire dimensions from tires.sets via set_ref, fallback to wheel fields
function resolveTireDims(corn, data) {
  const w = corn.wheel || {};
  let secW = w.tire_section_width, aspect = w.tire_aspect_ratio;
  const setRef = corn.tire?.set_ref || w.set_ref;
  if(setRef && data.tires?.sets?.[setRef]) {
    const dims = data.tires.sets[setRef].dimensions || {};
    if(dims.section_width != null && !secW) secW = dims.section_width;
    if(dims.aspect_ratio != null && !aspect) aspect = dims.aspect_ratio;
  }
  return { secW: secW || 0.205, aspect: aspect || 0.45 };
}

// ── Wheel stations (SVJ v0.99): FL/FR/RL/RR or A{n}{L|R|C} ──
const SVJ_STATION_RE = /^(FL|FR|RL|RR|A([1-9][0-9]?)(L|R|C))$/;
const LEGACY_STATIONS = {FL:[1,0],FR:[1,2],RL:[2,0],RR:[2,2]};
function stationOrder(k){ if(LEGACY_STATIONS[k]) return LEGACY_STATIONS[k]; const m=k.match(/^A(\d+)(L|R|C)$/); return m?[+m[1],{L:0,C:1,R:2}[m[2]]]:[999,0]; }
function stationKeys(obj){ return Object.keys(obj||{}).filter(k=>SVJ_STATION_RE.test(k)).sort((a,b)=>{const x=stationOrder(a),y=stationOrder(b);return x[0]-y[0]||x[1]-y[1];}); }
const LEGACY_STATION_COLORS = {FL:'#4d9fff',FR:'#34d27b',RL:'#f0b429',RR:'#b06aff'};
const STATION_PALETTE = ['#4d9fff','#34d27b','#f0b429','#b06aff','#ff6b6b','#2dd4bf','#f472b6','#a3e635','#fb923c','#60a5fa','#c084fc','#facc15'];
function stationColor(k){ if(LEGACY_STATION_COLORS[k]) return LEGACY_STATION_COLORS[k]; const o=stationOrder(k); return STATION_PALETTE[((o[0]-1)*2+(o[1]===2?1:0))%STATION_PALETTE.length]; }
function stationColorHex(k){ return parseInt(stationColor(k).slice(1),16); }
function wheelPositions(w){
  if(Array.isArray(w?.positions)&&w.positions.length) return w.positions.map(p=>({off:+p.offset_outboard||0,tire:p.tire||null,label:p.label||''}));
  const n=w?.multiplicity||1; if(n<=1) return [{off:0,tire:null,label:''}];
  const sp=w.dual_spacing||0.33; return Array.from({length:n},(_,i)=>({off:(i-(n-1)/2)*sp,tire:null,label:'#'+(i+1)}));
}
function viewFit(){
  const d=DATA||{}, ch=d.chassis||{}, wb=ch.wheelbase||2.31;
  const ax=(d.axles||[]).map(a=>a.position_x).filter(v=>typeof v==='number');
  const xF=ax.length?Math.max(...ax):0, xR=ax.length?Math.min(...ax):-wb;
  const tr=Math.max(ch.track_front||1.5, ch.track_rear||0, ...(d.axles||[]).map(a=>a.track||0));
  return {tz:-(xF+xR)/2, s:Math.max(1,((xF-xR)+tr)/3.81)};
}
function fitCamera(){ try{ const f=viewFit(); target.set(0,0.25,f.tz); spherical.set(4.5*f.s,Math.PI/4,Math.PI/6); updateCamera(); }catch(e){} }
// ── Axle helpers (v4.1) ──
const LEGACY_AXLE = {FL:'A1',FR:'A1',RL:'A2',RR:'A2'};
function axleIdOf(k){ if(LEGACY_AXLE[k]) return LEGACY_AXLE[k]; const m=/^(A\d+)[LRC]$/.exec(k||''); return m?m[1]:null; }
function sideOf(k){ if(LEGACY_AXLE[k]) return k[1]==='L'?'L':'R'; return (k||'').slice(-1); }
function stationsOnAxle(d, id){ return stationKeys(d?.suspension).filter(k=>axleIdOf(k)===id); }
function usesLegacyStations(d){ return stationKeys(d?.suspension).some(k=>LEGACY_AXLE[k]); }
// Axles from the `axles` array, else derived from wheel stations (two-axle cars)
function axleList(d){
  const st=stationKeys(d?.suspension), out={};
  st.forEach(k=>{ const id=axleIdOf(k); const wc=d.suspension[k]?.topology?.upright?.hardpoints?.wheel_center;
    const a=out[id]||(out[id]={id,stations:[],_ys:[],_xs:[]}); a.stations.push(k); if(wc){a._xs.push(wc[0]); a._ys.push(wc[1]);} });
  const explicit=(d?.axles||[]);
  const ids=[...new Set(explicit.map(a=>a.id).concat(Object.keys(out)))];
  const res = ids.map(id=>{
    const e=explicit.find(a=>a.id===id)||{}; const o=out[id]||{stations:[],_xs:[],_ys:[]};
    const px = typeof e.position_x==='number' ? e.position_x : (o._xs.length? o._xs.reduce((p,c)=>p+c,0)/o._xs.length : null);
    const tr = typeof e.track==='number' ? e.track : (o._ys.length>1? Math.max(...o._ys)-Math.min(...o._ys) : 0);
    const w = o.stations.length ? (d.suspension[o.stations[0]]?.wheel||{}) : {};
    const n = Array.isArray(w.positions)&&w.positions.length ? w.positions.length : (w.multiplicity||1);
    return Object.assign({}, e, {id, position_x:px, track:tr, stations:o.stations, wheelsPerStation:n, _explicit:!!explicit.find(a=>a.id===id)});
  }).sort((a,b)=>(b.position_x??-1e9)-(a.position_x??-1e9));
  if(!explicit.length){ const dt=(d?.vehicle_info?.drive_type||'').toUpperCase();
    res.forEach((a,i)=>{ a.steered = i===0 && !!d.steering; a.driven = dt==='AWD'||dt==='4WD' ? true : dt==='FWD' ? i===0 : dt==='RWD' ? i===res.length-1 : false; }); }
  return res;
}
function stationTireR(corn, d){ const w=corn?.wheel||{}; const td=resolveTireDims(corn,d); const od=d.tires?.sets?.[corn?.tire?.set_ref||w.set_ref]?.dimensions?.outer_diameter; return od? od/2 : ((w.rim_diameter||0.4318)/2 + td.secW*td.aspect); }
function isTruckLike(d){ return ['heavy_truck','medium_truck','light_truck','tractor_unit','military','off_highway','bus','trailer','semi_trailer','modular_trailer'].includes(d?.vehicle_info?.vehicle_class) || (d?.axles||[]).length>2; }

function rebuildCornerDefs(){ cornerDefs=[{key:null,label:'All',color:null}].concat(stationKeys(DATA?.suspension).map(k=>({key:k,label:k,color:stationColor(k)}))); }

/* ═══════════════════════════════════════════════════
   MINI CANVAS CHART
   ═══════════════════════════════════════════════════ */
function drawChart(canvasId, datasets, opts={}) {
  setTimeout(() => {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth * 2;
    const H = canvas.height = canvas.offsetHeight * 2;
    ctx.scale(2, 2);
    const w = canvas.offsetWidth, h = canvas.offsetHeight;
    const pad = {l:40,r:12,t:8,b:22};

    // Compute bounds
    let xMin=Infinity,xMax=-Infinity,yMin=Infinity,yMax=-Infinity;
    datasets = (datasets||[]).filter(ds => Array.isArray(ds.data) && ds.data.length);
    if(!datasets.length) return;
    datasets.forEach(ds => ds.data.forEach(([x,y])=>{
      if(x<xMin)xMin=x;if(x>xMax)xMax=x;if(y<yMin)yMin=y;if(y>yMax)yMax=y;
    }));
    if(yMin>0)yMin=0;
    const xRange=xMax-xMin||1, yRange=yMax-yMin||1;
    const tx=x=>(x-xMin)/xRange*(w-pad.l-pad.r)+pad.l;
    const ty=y=>h-pad.b-(y-yMin)/yRange*(h-pad.t-pad.b);

    // Grid
    ctx.strokeStyle='#252b3a';ctx.lineWidth=0.5;
    for(let i=0;i<=4;i++){
      const yy=pad.t+(h-pad.t-pad.b)*i/4;
      ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();
    }

    // Axes labels
    ctx.fillStyle='#404c66';ctx.font='8px JetBrains Mono,monospace';ctx.textAlign='right';
    for(let i=0;i<=4;i++){
      const v=yMax-(yRange*i/4);
      ctx.fillText(v.toFixed(v>100?0:1),pad.l-4,pad.t+(h-pad.t-pad.b)*i/4+3);
    }
    ctx.textAlign='center';
    for(let i=0;i<=4;i++){
      const v=xMin+xRange*i/4;
      ctx.fillText(v.toFixed(v>100?0:2),tx(v),h-pad.b+12);
    }

    // Lines
    const colors = ['#ff5131','#4d9fff','#34d27b','#f0b429','#b06aff'];
    datasets.forEach((ds,di) => {
      ctx.strokeStyle=colors[di%colors.length];ctx.lineWidth=1.5;ctx.beginPath();
      ds.data.forEach(([x,y],i)=>{i===0?ctx.moveTo(tx(x),ty(y)):ctx.lineTo(tx(x),ty(y));});
      ctx.stroke();
    });

    // Legend
    if(datasets.length>1){
      let lx=pad.l+4;
      datasets.forEach((ds,di)=>{
        ctx.fillStyle=colors[di%colors.length];ctx.fillRect(lx,2,12,3);
        ctx.fillStyle='#6e7a96';ctx.font='7px JetBrains Mono,monospace';ctx.textAlign='left';
        ctx.fillText(ds.name,lx+15,7);lx+=ctx.measureText(ds.name).width+26;
      });
    }
  }, 10);
}

}

function buildScene() {
  const vp = document.getElementById('viewport');
  const old = vp.querySelector('canvas');
  if (old) old.remove();

  const W = vp.clientWidth, H = vp.clientHeight;
  const _prevCam = (typeof target!=='undefined' && target && spherical && scene) ? {t:target.clone(), s:spherical.clone()} : null;
  scene = new THREE.Scene();
  scene.background = new THREE.Color('#08090c');
  camera = new THREE.PerspectiveCamera(45, W/H, 0.01, 100);
  camera.position.set(2.5, 1.8, 3.5);
  camera.lookAt(0, 0.25, 1.15);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  vp.insertBefore(renderer.domElement, vp.firstChild);

  scene.add(new THREE.AmbientLight(0x8899bb, 0.6));

  // Transform gizmo — single instance reused across mesh selections
  if (transformCtrl) { transformCtrl.dispose(); transformCtrl = null; }
  transformCtrl = new TransformControls(camera, renderer.domElement);
  transformCtrl.setSize(0.7);
  transformCtrl.addEventListener('dragging-changed', e => {
    gizmoDragging = e.value;
    if (e.value) { _dragBefore = selectedObj ? trsOf(selectedObj) : null; }
    else if (_dragBefore && selectedObj && selectedMeshId) {
      const e2 = loadedMeshes[selectedMeshId];
      commitMeshEdit(selectedMeshId, selectedObj, _dragBefore, 'Move ' + (e2 ? nodeLabel(e2, selectedObj) : 'part'));
      _dragBefore = null;
    }
  });
  transformCtrl.addEventListener('objectChange', () => {
    if (!selectedObj) return;
    updateMeshTransformHUD();
    refreshMeshFields();
  });
  scene.add(transformCtrl);

  const d1 = new THREE.DirectionalLight(0xffffff, 0.9); d1.position.set(3,5,4); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x6688cc, 0.3); d2.position.set(-2,3,-3); scene.add(d2);

  groups = {};
  ['grid','axes','frame','labels','chassis','suspension','springs','steering','drivetrain','massBodies','wheels','brakeDiscs','meshes','articulation','collision'].forEach(k => {
    groups[k] = new THREE.Group(); scene.add(groups[k]);
  });
  // Re-attach already-loaded mesh groups when scene is rebuilt
  Object.values(loadedMeshes).forEach(entry => groups.meshes.add(entry.group));
  if (selectedObj && selectedMeshId && loadedMeshes[selectedMeshId]) { transformCtrl.attach(selectedObj); transformCtrl.visible = layers.meshes; }
  pickables = []; posedObjects = []; artic = null; collState = null;

  const addP = (m, label, corner=null) => { m.userData = {label, corner}; pickables.push(m); };
  const mkS = (pos, r, color) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r,12,12), new THREE.MeshPhongMaterial({color,emissive:color,emissiveIntensity:0.25}));
    m.position.copy(pos); return m;
  };
  const mkT = (p1, p2, r, color) => {
    const dir = new THREE.Vector3().subVectors(p2, p1); const len = dir.length();
    if (len < 0.001) return null;
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8), new THREE.MeshPhongMaterial({color,transparent:true,opacity:0.85}));
    m.position.lerpVectors(p1,p2,0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
    return m;
  };
  const mkLabel = (text, color='#dfe3ed') => {
    const cv=document.createElement('canvas'); const ctx=cv.getContext('2d'); const fs=40;
    ctx.font=`600 ${fs}px JetBrains Mono, monospace`; const w=Math.ceil(ctx.measureText(text).width)+24;
    cv.width=w; cv.height=fs+20; ctx.font=`600 ${fs}px JetBrains Mono, monospace`;
    ctx.fillStyle='rgba(15,17,23,0.78)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle=color; ctx.textBaseline='middle'; ctx.fillText(text,12,cv.height/2);
    const tex=new THREE.CanvasTexture(cv); tex.minFilter=THREE.LinearFilter;
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false, transparent:true}));
    const h=0.085*Math.max(1,viewFit().s*0.8); sp.scale.set(h*cv.width/cv.height, h, 1); sp.renderOrder=10; return sp;
  };
  const mkL = (p1, p2, color) => new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1,p2]), new THREE.LineBasicMaterial({color}));
  // Coil spring: helix between p1 (top) and p2 (bottom)
  const mkCoil = (p1, p2, coilR, wireR, turns, color) => {
    const dir = new THREE.Vector3().subVectors(p2, p1);
    const len = dir.length();
    if(len < 0.001) return null;
    const segs = turns * 24;
    const pts = [];
    for(let i = 0; i <= segs; i++) {
      const t = i / segs;
      const angle = t * turns * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(angle) * coilR, t * len, Math.sin(angle) * coilR));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const geo = new THREE.TubeGeometry(curve, segs * 2, wireR, 6, false);
    const mat = new THREE.MeshPhongMaterial({color, emissive: color, emissiveIntensity: 0.15, shininess: 40});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(p1);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
    return mesh;
  };

  // Damper: body cylinder (lower 55%) + rod (upper 45%) + piston cap
  const mkDamper = (p1, p2, bodyR, rodR, color) => {
    const dir = new THREE.Vector3().subVectors(p2, p1);
    const len = dir.length();
    if(len < 0.001) return null;
    const group = new THREE.Group();
    const dirN = dir.clone().normalize();
    const bodyLen = len * 0.55;
    const rodLen = len * 0.45;
    const bodyGeo = new THREE.CylinderGeometry(bodyR, bodyR, bodyLen, 10);
    const bodyMat = new THREE.MeshPhongMaterial({color, transparent: true, opacity: 0.8, shininess: 60});
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    bodyMesh.position.set(0, bodyLen/2, 0);
    group.add(bodyMesh);
    const rodGeo = new THREE.CylinderGeometry(rodR, rodR, rodLen, 8);
    const rodMat = new THREE.MeshPhongMaterial({color: 0xcccccc, transparent: true, opacity: 0.85, shininess: 100, specular: 0xffffff});
    const rodMesh = new THREE.Mesh(rodGeo, rodMat);
    rodMesh.position.set(0, bodyLen + rodLen/2, 0);
    group.add(rodMesh);
    const capGeo = new THREE.CylinderGeometry(bodyR * 1.05, bodyR * 1.05, bodyR * 0.3, 10);
    const capMat = new THREE.MeshPhongMaterial({color: 0x444444, shininess: 30});
    const capMesh = new THREE.Mesh(capGeo, capMat);
    capMesh.position.set(0, bodyLen, 0);
    group.add(capMesh);
    group.position.copy(p2);
    group.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3().subVectors(p1, p2).normalize());
    return group;
  };

  const mkBox = (c, sx, sy, sz, color) => {
    const m = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(sx,sy,sz)), new THREE.LineBasicMaterial({color,transparent:true,opacity:0.4}));
    m.position.copy(c); return m;
  };

  const data = DATA;
  const ch = data.chassis || {};
  const wb = ch.wheelbase || 2.31;
  const tf = ch.track_front || 1.5;
  const tr = ch.track_rear || 1.5;

  // Grid
  const _fit = viewFit();
  const grid = new THREE.GridHelper(6*Math.ceil(_fit.s), 30*Math.ceil(_fit.s), 0x1a2235, 0x111825);
  grid.position.set(0, 0, _fit.tz); groups.grid.add(grid);

  // Axes
  const ao = sae2three([0,0,0]);
  [[0.4,0,0,0xff3333],[0,0.4,0,0x33ff33],[0,0,0.4,0x3377ff]].forEach(([x,y,z,c]) => {
    const t = mkT(ao, sae2three([x,y,z]), 0.004, c); if(t)groups.axes.add(t);
  });

  // CG
  const cgP = sae2three(ch.center_of_gravity||[wb/2,0,-0.4]);
  const cgS = mkS(cgP, 0.035, 0xff5131);
  addP(cgS, `CG: [${(ch.center_of_gravity||[]).map(v=>v.toFixed(3)).join(', ')}]`);
  groups.chassis.add(cgS);

  // Marker orientation frames (v0.96 `orientation` quaternions on hardpoints / mounts): RGB = marker x/y/z
  Object.entries(markerExtras).forEach(([id, ex]) => {
    const q = ex.orientation; if(!Array.isArray(q) || q.length !== 4) return;
    const [st, kind, name] = id.split('|'); const c = data.suspension?.[st]; if(!c) return;
    const pos = kind === 'hp' ? c.topology?.upright?.hardpoints?.[name] : c[kind]?.[name];
    if(!Array.isArray(pos) || pos.length < 3) return;
    [[1,0,0,0xff3333],[0,1,0,0x33ff33],[0,0,1,0x3377ff]].forEach(([x,y,z,col]) => {
      const dv = quatRotate(q, [x,y,z]);
      const t = mkT(sae2three(pos), sae2three([pos[0]+dv[0]*0.05, pos[1]+dv[1]*0.05, pos[2]+dv[2]*0.05]), 0.0015, col);
      if(t){ t.userData = {corner: st}; groups.suspension.add(t); }
    });
  });

  const axX=(data.axles||[]).map(a=>a.position_x).filter(v=>typeof v==='number');
  const xF=axX.length?Math.max(...axX):0, xR=axX.length?Math.min(...axX):-wb;
  const trMax=Math.max(tf,tr,...(data.axles||[]).map(a=>a.track||0));
  groups.chassis.add(mkBox(sae2three([(xF+xR)/2,0,-0.35]), trMax+0.1, 0.45, (xF-xR)+0.5, 0x2a3550));

  // Aero CoP
  if (data.aerodynamics?.center_of_pressure) {
    const cop = sae2three(data.aerodynamics.center_of_pressure);
    const copS = mkS(cop, 0.02, 0x2dd4bf);
    addP(copS, `Aero CoP: [${data.aerodynamics.center_of_pressure.map(v=>v.toFixed(3)).join(', ')}]`);
    groups.chassis.add(copS);
  }

  // Mass bodies
  const catC = {structural:0x4d9fff,powertrain:0xff8c42,fluid:0x2dd4bf,payload:0xf0b429,electrical:0xb06aff};
  (ch.mass_bodies||[]).forEach(mb => {
    if(!mb.position) return;
    const p = sae2three(mb.position);
    const r = Math.max(0.015, Math.min(0.06, Math.cbrt(mb.mass/400)*0.04));
    const s = mkS(p, r, catC[mb.category]||0x6e7a96);
    if(mb.x_derived){ s.material.transparent = true; s.material.opacity = 0.4; }          // generated item (x_derived): drawn faint
    addP(s, `${mb.id||mb.name||'body'}: ${mb.mass} kg${mb.x_derived?' (generated)':''}\n[${mb.position.map(v=>v.toFixed(3)).join(', ')}]`);
    groups.massBodies.add(s);
    if(mb.id != null){ s.updateMatrix(); posedObjects.push({obj:s, bodyId:mb.id, base:s.matrix.clone()}); }
  });
  buildArticulation(data, {mkS, mkT, addP});
  buildCollision(data, {addP});

  // Suspension
  stationKeys(data.suspension).forEach(cn => {
    const corn = data.suspension?.[cn]; if(!corn?.topology) return;
    const _ax=(data.axles||[]).find(x=>x.id===axleIdOf(cn)); const _lift=(liftRaised&&_ax?.liftable)?(_ax.lift?.travel||0.15):0; const S3=c=>{const v=sae2three(c); v.y+=_lift; return v;};
    const col = stationColorHex(cn); const hp = corn.topology.upright?.hardpoints||{}; const links = corn.topology.links||[];

    Object.entries(hp).forEach(([name,coord]) => {
      const p3 = S3(coord);
      const s = mkS(p3, name==='wheel_center'?0.018:0.011, col);
      addP(s, `${cn}.${name}\n[${coord.map(v=>v.toFixed(3)).join(', ')}]`, cn);
      groups.suspension.add(s);
    });

    links.forEach(link => {
      const ref = link.outboard_ref?.replace('hardpoints.','');
      const oc = hp[ref]; if(!oc)return; const op = S3(oc);
      (link.inboard_points||[]).forEach(ip => {
        const inp = S3(ip);
        const ib = mkS(inp, 0.009, col);
        addP(ib, `${cn}.${link.name} inboard\n[${ip.map(v=>v.toFixed(3)).join(', ')}]`, cn);
        groups.suspension.add(ib);
        const tube = mkT(inp, op, 0.005, col);
        if(tube){tube.userData={corner:cn};groups.suspension.add(tube);}
      });
    });

    // Spring (coil helix, green)
    const sp = corn.spring;
    if(sp?.inboard_mount && sp?.outboard_mount) {
      const si = S3(sp.inboard_mount), so = S3(sp.outboard_mount);
      const coil = mkCoil(si, so, 0.018, 0.004, 7, 0x34d27b);
      if(coil){coil.userData={corner:cn,label:`${cn} spring\ntype: ${sp.type||'?'}\nrate: ${sp.rate||'?'} N/m`};pickables.push(coil);groups.springs.add(coil);}
      const s1 = mkS(si, 0.009, 0x34d27b); addP(s1, `${cn}.spring top [${sp.inboard_mount.map(v=>v.toFixed(3)).join(', ')}]`, cn); groups.springs.add(s1);
      const s2 = mkS(so, 0.009, 0x34d27b); addP(s2, `${cn}.spring btm [${sp.outboard_mount.map(v=>v.toFixed(3)).join(', ')}]`, cn); groups.springs.add(s2);
    }

    // Damper (body+rod, orange/silver)
    const dm = corn.damper;
    if(dm?.inboard_mount && dm?.outboard_mount) {
      const di = S3(dm.inboard_mount), dout = S3(dm.outboard_mount);
      const damper = mkDamper(di, dout, 0.012, 0.005, 0xff8c42);
      if(damper){damper.userData={corner:cn,label:`${cn} damper\ntype: ${dm.type||'?'}\nMR: ${dm.motion_ratio||'?'}`};groups.springs.add(damper);}
      const d1 = mkS(di, 0.007, 0xff8c42); addP(d1, `${cn}.damper top [${dm.inboard_mount.map(v=>v.toFixed(3)).join(', ')}]`, cn); groups.springs.add(d1);
      const d2 = mkS(dout, 0.007, 0xff8c42); addP(d2, `${cn}.damper btm [${dm.outboard_mount.map(v=>v.toFixed(3)).join(', ')}]`, cn); groups.springs.add(d2);
    }

    // Wheel — realistic cylinder geometry
    const wc = hp.wheel_center;
    if(wc) {
      const wcP = S3(wc);
      const w = corn.wheel || {};
      const rimDia = w.rim_diameter || 0.4318;
      const rimW = w.rim_width || 0.1778;
      const td = resolveTireDims(corn, data);
      const secW = td.secW;
      const aspect = td.aspect;
      const sidewall = secW * aspect;
      const tireDia = rimDia + 2 * sidewall;
      const tireR = tireDia / 2;
      const rimR = rimDia / 2;
      const isLeft = wc[1] < 0;

      wheelPositions(w).forEach(wp => {
      const P = wcP.clone(); P.x += wp.off * (isLeft ? -1 : 1);
      const tdp = wp.tire ? resolveTireDims(Object.assign({}, corn, {tire: wp.tire}), data) : td;
      const secW = tdp.secW, aspect = tdp.aspect, tireDia = rimDia + 2 * secW * aspect, tireR = tireDia / 2;
      // Tire outer cylinder (dark rubber)
      const tireGeo = new THREE.CylinderGeometry(tireR, tireR, secW, 32, 1, false);
      const tireMat = new THREE.MeshPhongMaterial({color:0x1a1a1a, transparent:true, opacity:0.55, shininess:5});
      const tireMesh = new THREE.Mesh(tireGeo, tireMat);
      tireMesh.position.copy(P);
      tireMesh.rotation.z = Math.PI/2; // cylinder axis along Three.X = SAE Y (lateral)
      tireMesh.userData = {label: cn + (wp.label?' '+wp.label:'') + ' tire: ' + (secW*1000).toFixed(0) + '/' + (aspect*100).toFixed(0) + 'R' + Math.round(rimDia/0.0254) + '\nOD: ' + (tireDia*1000).toFixed(0) + 'mm  W: ' + (secW*1000).toFixed(0) + 'mm', corner: cn};
      pickables.push(tireMesh);
      groups.wheels.add(tireMesh);

      // Tire sidewall rings (subtle edge highlight)
      const swGeo = new THREE.TorusGeometry(tireR - 0.003, 0.003, 8, 32);
      const swMat = new THREE.MeshPhongMaterial({color:0x222222, transparent:true, opacity:0.5});
      [-1,1].forEach(side => {
        const sw = new THREE.Mesh(swGeo, swMat);
        sw.position.copy(P);
        sw.position.x += side * secW/2; // offset laterally
        sw.rotation.y = Math.PI/2;
        groups.wheels.add(sw);
      });

      // Rim cylinder (metallic, slightly inset)
      const rimGeo = new THREE.CylinderGeometry(rimR, rimR, rimW, 32, 1, false);
      const rimMat = new THREE.MeshPhongMaterial({color:0x888899, transparent:true, opacity:0.4, shininess:80, specular:0xaaaacc});
      const rimMesh = new THREE.Mesh(rimGeo, rimMat);
      rimMesh.position.copy(P);
      rimMesh.rotation.z = Math.PI/2;
      rimMesh.userData = {label: cn + (wp.label?' '+wp.label:'') + ' rim: ' + Math.round(rimDia/0.0254) + '" x ' + (rimW/0.0254).toFixed(1) + '"\nDia: ' + (rimDia*1000).toFixed(0) + 'mm  W: ' + (rimW*1000).toFixed(0) + 'mm', corner: cn};
      pickables.push(rimMesh);
      groups.wheels.add(rimMesh);

      // Rim face disc (hub cap effect)
      const discGeo = new THREE.CircleGeometry(rimR * 0.85, 32);
      const discMat = new THREE.MeshPhongMaterial({color:col, transparent:true, opacity:0.3, side:THREE.DoubleSide});
      [-1,1].forEach(side => {
        const disc = new THREE.Mesh(discGeo, discMat);
        disc.position.copy(P);
        disc.position.x += side * rimW/2;
        disc.rotation.y = Math.PI/2;
        groups.wheels.add(disc);
      });

      // Rim edge ring (lip)
      const lipGeo = new THREE.TorusGeometry(rimR, 0.005, 8, 32);
      const lipMat = new THREE.MeshPhongMaterial({color:0xaaaabb, transparent:true, opacity:0.5, shininess:100});
      [-1,1].forEach(side => {
        const lip = new THREE.Mesh(lipGeo, lipMat);
        lip.position.copy(P);
        lip.position.x += side * rimW/2;
        lip.rotation.y = Math.PI/2;
        groups.wheels.add(lip);
      });

      });

      // Brake disc (if data available)
      const brkDisc = corn.brake?.disc;
      if(brkDisc?.outer_diameter) {
        const brkR = brkDisc.outer_diameter / 2;
        const brkInR = (brkDisc.inner_diameter || brkDisc.outer_diameter * 0.63) / 2;
        const brkThk = brkDisc.thickness || 0.022;
        const brkGeo = new THREE.CylinderGeometry(brkR, brkR, brkThk, 24, 1, false);
        const brkMat = new THREE.MeshPhongMaterial({color:0x666677, transparent:true, opacity:0.35, shininess:60});
        const brkMesh = new THREE.Mesh(brkGeo, brkMat);
        brkMesh.position.copy(wcP);
        // Offset disc slightly inboard from wheel center
        brkMesh.position.x += (isLeft ? 0.03 : -0.03);
        brkMesh.rotation.z = Math.PI/2;
        brkMesh.userData = {label: cn + ' brake disc: ' + brkDisc.type + '\nOD: ' + (brkDisc.outer_diameter*1000).toFixed(0) + 'mm  Thk: ' + (brkThk*1000).toFixed(1) + 'mm' + (brkDisc.mass ? '  ' + brkDisc.mass + 'kg' : ''), corner: cn};
      pickables.push(brkMesh);
      groups.brakeDiscs.add(brkMesh);
      }
    }
  });

  // Suspension couplings (SVJ v0.99): pivots and beam/rocker/trunnion ends
  (data.suspension_couplings||[]).forEach(cp => {
    const cpCol = 0xff9f1c;
    const piv = cp.pivot_position ? sae2three(cp.pivot_position) : null;
    if(piv){ const ps=mkS(piv,0.02,cpCol); addP(ps, `${cp.id} (${cp.type}) pivot\n[${cp.pivot_position.map(v=>v.toFixed(3)).join(', ')}]`); groups.suspension.add(ps); }
    const ends=(cp.end_points||cp.end_seats||[]).concat((cp.connections||[]).map(c=>c.attach_point).filter(Boolean));
    ends.forEach(e => { const p=sae2three(e); const es=mkS(p,0.012,cpCol); addP(es, `${cp.id} end\n[${e.map(v=>v.toFixed(3)).join(', ')}]`); groups.suspension.add(es); if(piv){ const t=mkT(piv,p,0.008,cpCol); if(t) groups.suspension.add(t); } });
  });

  // ── v4.1: axle beams, frame rails / backbone, axle labels, coupling circuits ──
  {
    const AXL = axleList(data);
    const beamCol = 0x8a94ad;
    const wcOf = (k, lifted=true) => { const c=data.suspension?.[k]?.topology?.upright?.hardpoints?.wheel_center; if(!c) return null;
      const ax=(data.axles||[]).find(x=>x.id===axleIdOf(k)); const v=sae2three(c); if(lifted && liftRaised && ax?.liftable) v.y += (ax.lift?.travel||0.15); return v; };
    const BEAM_TYPES = ['solid_axle','de_dion','pendulum_axle','torsion_beam'];
    let maxR = 0.3, wcZ = 0.3, anySwing = false;
    AXL.forEach(ax => {
      const sts = ax.stations; if(!sts.length) return;
      const corn0 = data.suspension[sts[0]];
      maxR = Math.max(maxR, stationTireR(corn0, data));
      const wc0 = corn0?.topology?.upright?.hardpoints?.wheel_center; if(wc0) wcZ = Math.max(wcZ, -wc0[2]);
      const types = sts.map(k=>data.suspension[k]?.topology?.system_type);
      if(types.includes('swing_axle')) anySwing = true;
      const L = sts.find(k=>sideOf(k)==='L'), R = sts.find(k=>sideOf(k)==='R');
      const hasBody = sts.some(k=>data.suspension[k]?.topology?.axle_body);
      const beam = hasBody || types.some(t=>BEAM_TYPES.includes(t));
      const pL = L&&wcOf(L), pR = R&&wcOf(R);
      if(beam && pL && pR) {
        const big = (ax.track||1.5) > 1.7;
        const t = mkT(pL, pR, big?0.045:0.022, beamCol); if(t){ t.userData={label:`${ax.id} axle beam${hasBody?' ('+(data.suspension[L]?.topology?.axle_body?.id||'axle body')+')':''}`}; pickables.push(t); groups.frame.add(t); }
        if(ax.driven) { const mid=pL.clone().lerp(pR,0.5); const h=mkS(mid, big?0.13:0.07, 0x5b6478); h.userData={label:`${ax.id} drive housing`}; pickables.push(h); groups.frame.add(h); }
      }
      // Swing half-axles: tube from wheel centre to the centreline pivot
      if(types.includes('swing_axle')) [pL,pR].forEach(pw=>{ if(!pw) return; const pv=new THREE.Vector3(0,pw.y+0.02,pw.z); const t=mkT(pw,pv,0.035,beamCol); if(t) groups.frame.add(t); });
      // Axle label
      const P = sae2three([ax.position_x??0, 0, -(maxR*2+0.35)]);
      const flags = [ax.steered?'steer':'', ax.driven?'drive':'', ax.liftable?(liftRaised?'lifted':'lift'):''].filter(Boolean).join(' · ');
      const lw = (ax.label||'').split(/[ (,]/)[0].toLowerCase(); const showLw = lw && !['steer','drive','lift','trailer','steer-drive','front','rear'].includes(lw) && !/^\d/.test(lw);
      const lab = mkLabel(`${ax.id}${showLw?' '+lw:''}${ax.wheelsPerStation>1?' · '+ax.wheelsPerStation+'×':''}${flags?' · '+flags:''}`, ax.driven?'#ff8c42':(ax.steered?'#2dd4bf':'#dfe3ed'));
      lab.position.copy(P); groups.labels.add(lab);
      const tick = mkL(sae2three([ax.position_x??0,0,-(maxR*2+0.25)]), sae2three([ax.position_x??0,0,-(maxR*2+0.05)]), 0x6e7a96); groups.labels.add(tick);
    });
    const xs = AXL.map(a=>a.position_x).filter(v=>typeof v==='number');
    if(isTruckLike(data) && xs.length>=2) {
      const xF=Math.max(...xs), xR=Math.min(...xs), cls=data.vehicle_info?.vehicle_class;
      const trailer = ['semi_trailer','trailer','modular_trailer'].includes(cls);
      const cgx = ch.center_of_gravity?.[0];
      let front = xF + 1.2, rear = xR - 1.1;
      if(cls==='semi_trailer') front = Math.max(xF+2, typeof cgx==='number' ? 2*cgx-(xR-1.1) : xF+8);
      if(trailer && cls!=='semi_trailer') front = xF + 2.5;
      const zc = -(wcZ + maxR*0.55 + 0.12);
      if(anySwing) {
        const t = mkT(sae2three([front,0,zc+0.05]), sae2three([rear,0,zc+0.05]), 0.09, beamCol);
        if(t){ t.userData={label:'Central backbone tube (schematic)'}; pickables.push(t); groups.frame.add(t); }
      } else {
        const half = trailer ? 0.5 : 0.43;
        [-half, half].forEach(y => {
          const c = sae2three([(front+rear)/2, y, zc]);
          const m = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.27, front-rear), new THREE.MeshPhongMaterial({color:beamCol, transparent:true, opacity:0.35}));
          m.position.copy(c); m.userData={label:`Frame rail (schematic)\nx ${front.toFixed(2)} → ${rear.toFixed(2)} m`}; pickables.push(m); groups.frame.add(m);
        });
        for(let x=front; x>rear; x-=Math.max(1.0,(front-rear)/6)) {
          const t = mkT(sae2three([x,-half,zc]), sae2three([x,half,zc]), 0.02, beamCol); if(t) groups.frame.add(t);
        }
      }
    }
    // Pneumatic / hydraulic circuits (no pivot): dashed link between member wheel centres
    (data.suspension_couplings||[]).forEach(cp => {
      if(cp.pivot_position || !(cp.members||[]).length) return;
      const col = cp.type==='hydraulic_circuit' ? 0xb06aff : 0xff9f1c;
      ['L','R','C'].forEach(side => {
        const pts = cp.members.filter(k=>sideOf(k)===side).map(k=>wcOf(k)).filter(Boolean).sort((a,b)=>a.z-b.z);
        if(pts.length<2) return;
        const ptsUp = pts.map(p=>{ const q=p.clone(); q.y += maxR*0.9; return q; });
        const g = new THREE.BufferGeometry().setFromPoints(ptsUp);
        const ln = new THREE.Line(g, new THREE.LineDashedMaterial({color:col, dashSize:0.12, gapSize:0.07}));
        ln.computeLineDistances(); groups.suspension.add(ln);
        ptsUp.forEach((q,i)=>{ const sp=mkS(q,0.025,col); addP(sp, `${cp.id} (${(cp.type||'').replace(/_/g,' ')})\nmember ${cp.members.filter(k=>sideOf(k)===side)[i]||''}`); groups.suspension.add(sp); });
      });
    });
  }

  // Steering
  const st = data.steering;
  if(st?.rack_position) {
    const rP = sae2three(st.rack_position);
    const rL = sae2three([st.rack_position[0], -tf/2*0.3, st.rack_position[2]]);
    const rR = sae2three([st.rack_position[0], tf/2*0.3, st.rack_position[2]]);
    const rt = mkT(rL, rR, 0.007, 0x2dd4bf); if(rt)groups.steering.add(rt);
    const rs = mkS(rP, 0.01, 0x2dd4bf); addP(rs, `Rack: [${st.rack_position.map(v=>v.toFixed(3)).join(', ')}]`); groups.steering.add(rs);
    if(st.tie_rod_inboard) ['left','right'].forEach(side => {
      const c = st.tie_rod_inboard[side]; if(!c)return;
      const s = mkS(sae2three(c), 0.007, 0x2dd4bf); addP(s, `Tie rod ${side}\n[${c.map(v=>v.toFixed(3)).join(', ')}]`); groups.steering.add(s);
    });
  }

  // Drivetrain
  const pt = data.powertrain;
  if(pt) {
    const dc = 0xff8c42;
    [['engine',pt.engine,0.05],['clutch',pt.clutch,0.025],['gearbox',pt.gearbox,0.03]].forEach(([n,c,r]) => {
      if(!c?.position)return; const p = sae2three(c.position);
      groups.drivetrain.add(mkBox(p,r*2,r*1.5,r*2,dc));
      const s = mkS(p, 0.012, dc); addP(s, `${n}: ${c.mass||'?'} kg\n[${c.position.map(v=>v.toFixed(3)).join(', ')}]`); groups.drivetrain.add(s);
    });
    (pt.driveshafts||[]).forEach(ds => {
      const fj=ds.joint_front?.position, rj=ds.joint_rear?.position;
      if(fj&&rj){const t=mkT(sae2three(fj),sae2three(rj),0.006,dc);if(t)groups.drivetrain.add(t);
      [fj,rj].forEach((j,i)=>{const s=mkS(sae2three(j),0.007,dc);addP(s,`${ds.id} ${i?'rear':'front'} joint`);groups.drivetrain.add(s);});}
    });
    (pt.differentials||[]).forEach(df => {
      if(!df.position)return;const p=sae2three(df.position);
      groups.drivetrain.add(mkBox(p,0.08,0.05,0.05,0xf0524f));
      const s=mkS(p,0.014,0xf0524f);addP(s,`${df.id} (${df.type})\nFD=${df.final_drive}`);groups.drivetrain.add(s);
      [['outL',df.output_left],['outR',df.output_right]].forEach(([n,pos])=>{
        if(!pos)return;const pp=sae2three(pos);groups.drivetrain.add(mkL(p,pp,0xf0524f));
        const ss=mkS(pp,0.007,0xf0524f);addP(ss,`${df.id}.${n}`);groups.drivetrain.add(ss);
      });
    });
    if(pt.half_shafts)Object.entries(pt.half_shafts).forEach(([side,hs])=>{
      const ci=hs.cv_inner?.position,co=hs.cv_outer?.position;
      if(ci&&co){const t=mkT(sae2three(ci),sae2three(co),0.005,0xf0b429);if(t)groups.drivetrain.add(t);}
    });
  }

  // Camera orbit state
  if (_prevCam) { target = _prevCam.t; spherical = _prevCam.s; updateCamera(); }
  else {
    target = new THREE.Vector3(0, 0.25, 1.15);
    spherical = new THREE.Spherical().setFromVector3(new THREE.Vector3().subVectors(camera.position, target));
  }
  applyPose();
  applyLayers();
  applyCornerHighlight();
}

function updateCamera() {
  camera.position.copy(target).add(new THREE.Vector3().setFromSpherical(spherical));
  camera.lookAt(target);
}

function applyLayers() {
  if(!groups)return;
  Object.entries(layers).forEach(([k,v])=>{if(groups[k])groups[k].visible=v;});
  // Re-apply opacity in case layer was just toggled back on
  if(layers.meshes) applyMeshOpacity(null, meshOpacity);
  // Hide gizmo when meshes layer is off
  if(transformCtrl) transformCtrl.visible = layers.meshes && !!selectedMeshId;
}

function applyCornerHighlight() {
  if(!groups)return;
  ['suspension','springs','wheels','brakeDiscs'].forEach(gName=>{
    const g=groups[gName];if(!g)return;
    g.children.forEach(c=>{
      if(!c.material)return;
      if(highlightCorner && c.userData?.corner && c.userData.corner!==highlightCorner) c.material.opacity=0.07;
      else c.material.opacity=0.85;
    });
  });
}

function setupControls() {
  const cv = renderer.domElement;
  let isDrag=false, isPan=false, prevX=0, prevY=0;

  cv.addEventListener('mousedown', e => {
    if(e.button===0) {
      // Try mesh pick first; if it hits, don't start orbit drag
      if(!pickMesh(e)) isDrag=true;
    }
    if(e.button===2)isPan=true;
    prevX=e.clientX;prevY=e.clientY;e.preventDefault();
  });
  cv.addEventListener('mousemove', e => {
    const dx=e.clientX-prevX,dy=e.clientY-prevY;prevX=e.clientX;prevY=e.clientY;
    if(isDrag && !gizmoDragging){spherical.theta-=dx*0.005;spherical.phi-=dy*0.005;spherical.phi=Math.max(0.1,Math.min(Math.PI-0.1,spherical.phi));updateCamera();}
    if(isPan && !gizmoDragging){const ps=0.002*spherical.radius;const r=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);const u=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);target.add(r.multiplyScalar(-dx*ps));target.add(u.multiplyScalar(dy*ps));updateCamera();}
    // Raycast
    const rect=cv.getBoundingClientRect();
    const mouse=new THREE.Vector2(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
    const rc=new THREE.Raycaster();rc.setFromCamera(mouse,camera);
    const hits=rc.intersectObjects(pickables,false);
    const tip=document.getElementById('tooltip');
    if(hits.length>0){tip.textContent=hits[0].object.userData.label;tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-10)+'px';}
    else{tip.style.display='none';}
  });
  cv.addEventListener('mouseup', ()=>{isDrag=false;isPan=false;});
  cv.addEventListener('mouseleave', ()=>{isDrag=false;isPan=false;document.getElementById('tooltip').style.display='none';});
  cv.addEventListener('wheel', e=>{spherical.radius*=(1+e.deltaY*0.001);spherical.radius=Math.max(0.5,Math.min(40,spherical.radius));updateCamera();e.preventDefault();},{passive:false});
  cv.addEventListener('contextmenu', e=>e.preventDefault());

  // Touch
  let touchDist=0;
  cv.addEventListener('touchstart', e=>{
    if(e.touches.length===1){isDrag=true;prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;}
    if(e.touches.length===2){const dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY;touchDist=Math.sqrt(dx*dx+dy*dy);}
  },{passive:false});
  cv.addEventListener('touchmove', e=>{
    e.preventDefault();
    if(e.touches.length===1&&isDrag){const dx=e.touches[0].clientX-prevX,dy=e.touches[0].clientY-prevY;prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;spherical.theta-=dx*0.005;spherical.phi-=dy*0.005;spherical.phi=Math.max(0.1,Math.min(Math.PI-0.1,spherical.phi));updateCamera();}
    if(e.touches.length===2){const dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY;const nd=Math.sqrt(dx*dx+dy*dy);spherical.radius*=(touchDist/nd);spherical.radius=Math.max(0.5,Math.min(40,spherical.radius));touchDist=nd;updateCamera();}
  },{passive:false});
  cv.addEventListener('touchend', ()=>{isDrag=false;});
}

function renderThermal(el, data) {
  const pt = data.powertrain||{};
  const cool = data.cooling||{};
  const env = cool.environment||{};
  let h = '';
  
  // Environment
  h += '<div class="section-title">Environment</div>';
  if (Object.keys(env).length) {
    h += '<div class="grid2 mb8">';
    if(env.temperature_ambient!=null) h += stat('Ambient',fmtN(env.temperature_ambient,1),'°C');
    if(env.pressure_ambient!=null) h += stat('Pressure',fmtN(env.pressure_ambient,0),'Pa');
    if(env.humidity!=null) h += stat('Humidity',fmtN(env.humidity*100,0),'%');
    if(env.altitude!=null) h += stat('Altitude',fmtN(env.altitude,0),'m');
    if(env.wind_speed!=null) h += stat('Wind',fmtN(env.wind_speed,1),'m/s');
    h += '</div>';
  } else {
    h += '<div style="color:var(--txD);font-size:10px;margin-bottom:8px">No environment data (defaults: 25°C, 101325 Pa)</div>';
  }
  
  // Engine thermal
  const et = pt.engine?.thermal;
  if (et) {
    h += '<div class="section-title">Engine Thermal</div><div class="grid2 mb8">';
    if(et.heat_capacity) h += stat('Heat Cap.',fmtN(et.heat_capacity,0),'J/°C');
    if(et.temperature_nominal) h += stat('Nominal',fmtN(et.temperature_nominal,0),'°C');
    if(et.warmup_time) h += stat('Warmup',fmtN(et.warmup_time,0),'s');
    h += '</div>';
    if(et.friction_vs_temperature) {
      const fid='eng-friction-'+Math.random().toString(36).slice(2,8);
      h += chartHtml(fid,'Engine Friction vs Oil Temp',[{name:'Multiplier',data:et.friction_vs_temperature}],130);
      setTimeout(()=>drawChart(fid,[{name:'Friction mult.',data:et.friction_vs_temperature}]),20);
    }
    if(et.power_derating_vs_temperature) {
      const pid='eng-derate-'+Math.random().toString(36).slice(2,8);
      h += chartHtml(pid,'Power Derating vs Coolant Temp',[{name:'Power mult.',data:et.power_derating_vs_temperature}],130);
      setTimeout(()=>drawChart(pid,[{name:'Power mult.',data:et.power_derating_vs_temperature}]),20);
    }
  }
  
  // Gearbox thermal
  const gt = pt.gearbox?.thermal;
  if (gt) {
    h += '<div class="section-title">Gearbox Thermal</div><div class="grid2 mb8">';
    if(gt.heat_capacity) h += stat('Heat Cap.',fmtN(gt.heat_capacity,0),'J/°C');
    if(gt.temperature_nominal) h += stat('Nominal',fmtN(gt.temperature_nominal,0),'°C');
    if(gt.oil_capacity) h += stat('Oil Vol.',fmtN(gt.oil_capacity*1000,2),'L');
    h += '</div>';
    if(gt.efficiency_vs_temperature) {
      const gid='gb-eff-'+Math.random().toString(36).slice(2,8);
      h += chartHtml(gid,'GB Efficiency vs Oil Temp',[{name:'η',data:gt.efficiency_vs_temperature}],130);
      setTimeout(()=>drawChart(gid,[{name:'η',data:gt.efficiency_vs_temperature}]),20);
    }
  }
  
  // Cooling circuits
  const circuits = cool.circuits||[];
  if (circuits.length) {
    h += '<div class="section-title">Cooling Circuits ('+circuits.length+')</div>';
    circuits.forEach(c => {
      h += '<div class="stat-box mb6">';
      h += '<div style="font-size:11px;font-weight:700;color:var(--cy)">' + c.id + '</div>';
      h += '<div style="font-size:9px;color:var(--txD)">' + (c.type||'') + ' · ' + (c.coolant||'') + '</div>';
      const r = c.radiator;
      if(r) h += '<div style="font-size:9px;color:var(--txD)">Radiator: '+fmtN(r.heat_rejection,0)+' W max · '+fmtN(r.area,3)+' m²</div>';
      const t = c.thermostat;
      if(t) h += '<div style="font-size:9px;color:var(--txD)">Thermostat: '+fmtN(t.open_temperature,0)+'–'+fmtN(t.full_open_temperature,0)+' °C</div>';
      // Heat sources
      if(c.heat_sources && Array.isArray(c.heat_sources)) {
        // New v0.92 format: array of objects with component_ref
        const isNewFmt = c.heat_sources[0] && typeof c.heat_sources[0] === 'object';
        if(isNewFmt) {
          h += '<div style="font-size:9px;color:var(--txD)">Sources: ' + c.heat_sources.map(s=>s.component_ref+(s.heat_generation_nominal?' ('+fmtN(s.heat_generation_nominal,0)+'W)':'')).join(', ') + '</div>';
        } else {
          h += '<div style="font-size:9px;color:var(--txD)">Sources: ' + c.heat_sources.join(', ') + '</div>';
        }
      }
      h += '</div>';
    });
  }
  
  // Brake thermal per corner
  h += '<div class="section-title">Brake Thermal</div>';
  let hasBrakeThermal = false;
  stationKeys(data.suspension).forEach(cn => {
    const bt = data.suspension?.[cn]?.brake?.thermal_dynamics || data.suspension?.[cn]?.brake?.disc;
    if(bt?.specific_heat || bt?.disc_to_air_conductance) hasBrakeThermal = true;
  });
  if(hasBrakeThermal) {
    h += '<div class="grid2">';
    stationKeys(data.suspension).forEach(cn => {
      const br = data.suspension?.[cn]?.brake;
      if(!br) return;
      const disc = br.disc||{};
      const td = br.thermal_dynamics||{};
      h += '<div class="stat-box"><div style="font-size:10px;font-weight:700;color:var(--ac)">' + cn + '</div>';
      if(disc.specific_heat) h += '<div style="font-size:9px;color:var(--txD)">c=' + fmtN(disc.specific_heat,0) + ' J/(kg·°C)</div>';
      if(disc.max_temperature) h += '<div style="font-size:9px;color:var(--txD)">T_max=' + fmtN(disc.max_temperature,0) + ' °C</div>';
      if(td.disc_to_air_conductance) h += '<div style="font-size:9px;color:var(--txD)">h_air=' + fmtN(td.disc_to_air_conductance,1) + ' W/°C</div>';
      h += '</div>';
    });
    h += '</div>';
  } else {
    h += '<div style="color:var(--txD);font-size:10px">No detailed brake thermal data</div>';
  }
  
  el.innerHTML = h;
}

function runValidation(data) {
  const warnings = [];
  const ch = data.chassis||{};
  const cg = ch.center_of_gravity;
  const wb = ch.wheelbase;
  if(cg && wb) {
    // CG should be between front (X=0) and rear (X=-wb) axle
    const semiTrailer = ['semi_trailer','trailer'].includes(data.vehicle_info?.vehicle_class);
    if((cg[0] > 0.5 && !semiTrailer) || cg[0] < -(wb+0.5)) {
      warnings.push('CG X='+cg[0].toFixed(3)+' is outside wheelbase [0, -'+wb.toFixed(2)+']. Check X sign convention.');
    }
    // CG Z should be negative (above ground in SAE Z-down)
    if(cg[2] > 0) {
      warnings.push('CG Z='+cg[2].toFixed(3)+' is positive (below ground in SAE Z-down). Should be negative.');
    }
  }
  // Check mass_bodies X range
  (ch.mass_bodies||[]).forEach(mb => {
    if(mb.position && mb.position[0] != null) {
      const _axX=(data.axles||[]).map(a=>a.position_x).filter(v=>typeof v==='number');
      const _hi=(_axX.length?Math.max(..._axX):0)+1.0, _lo=(_axX.length?Math.min(..._axX):-wb)-1.0;
      if(!mb.x_derived && mb.category!=='attachment' && (mb.position[0] > _hi || mb.position[0] < _lo)) {
        warnings.push((mb.id||mb.name||'body')+' position X='+mb.position[0].toFixed(3)+' seems outside vehicle envelope.');
      }
    }
  });
  return warnings;
}

function renderPanel() {
  const el = document.getElementById('panel-content');
  const data = DATA;
  switch(activePanel) {
    case 'overview': renderOverview(el, data); break;
    case 'suspension': renderSuspension(el, data); if(data.__unifiedView) el.insertAdjacentHTML('afterbegin', UNIFIED_BANNER); break;
    case 'powertrain': renderPowertrain(el, data); break;
    case 'brakes': renderBrakes(el, data); break;
    case 'tires': renderTires(el, data); break;
    case 'aero': renderAero(el, data); break;
    case 'performance': renderPerformance(el, data); break;
    case 'thermal': renderThermal(el, data); break;
    case 'meshes': renderMeshes(el); break;
    case 'poses': renderPoses(el); break;
  }
  setTimeout(()=>attachEditors(el), 30);
}

function renderOverview(el, data) {
  const vi=data.vehicle_info||{};const ch=data.chassis||{};const cg=ch.center_of_gravity||[];
  const wb=ch.wheelbase||0;let fb=wb>0?((wb-Math.abs(cg[0]))/wb*100).toFixed(1):'—';
  { const ax=(data.axles||[]).filter(a=>typeof a.position_x==='number').sort((a,b)=>b.position_x-a.position_x);
    const grp=id=>(data.axle_groups||[]).find(g=>(g.axle_refs||[]).includes(id));
    if(ax.length>=2){
      const kl=(data.axle_groups||[]).map(g=>g.kerb_load);
      const fg=grp(ax[0].id);
      if(fg && kl.length && kl.every(x=>typeof x==='number')){ fb=(fg.kerb_load/kl.reduce((p,c)=>p+c,0)*100).toFixed(1); }
      else if(cg){
        const pos=Object.fromEntries(ax.map(a=>[a.id,a.position_x]));
        const xs=ax.map(a=>a.position_x); let cut=1,best=-1; for(let i=0;i<xs.length-1;i++){const gp=xs[i]-xs[i+1]; if(gp>best){best=gp;cut=i+1;}}
        const fIds=(grp(ax[0].id)?.axle_refs)||ax.slice(0,cut).map(a=>a.id), rIds=(grp(ax[ax.length-1].id)?.axle_refs)||ax.slice(cut).map(a=>a.id);
        const mean=ids=>ids.reduce((p,c)=>p+(pos[c]??0),0)/ids.length; const xf=mean(fIds), xr=mean(rIds);
        if(xf!==xr) fb=((cg[0]-xr)/(xf-xr)*100).toFixed(1);
      }
    }
  }
  if(['semi_trailer','trailer','modular_trailer'].includes(data.vehicle_info?.vehicle_class)) fb='n/a';
  const e=data.powertrain?.engine;
  const warnings = runValidation(data).concat(multiAxleWarnings(data));
  el.innerHTML = `
    ${warnings.length ? '<div style="background:var(--rd)10;border:1px solid var(--rd)30;border-radius:4px;padding:6px 8px;margin-bottom:8px;font-size:9px;font-family:JetBrains Mono,monospace;color:var(--rd)"><b>⚠ Validation:</b><br>' + warnings.join('<br>') + '</div>' : ''}
    <div style="font-size:18px;font-weight:800;margin-bottom:2px">${vi.make||''} ${vi.model||''}</div>

/* Joint-type inference — keep in sync with tools/multibody_check.py (infer_joint_types). */
function inferJointTypes(systemType, linkType){
  const lt = linkType || 'arm';
  if(lt === 'rod' || lt === 'torque_rod') return ['spherical','spherical'];
  if(lt === 'strut' && (systemType === 'macpherson' || systemType === 'chapman_strut')) return ['translational','fixed'];
  if(lt === 'arm'){
    if(['double_wishbone','macpherson','chapman_strut','multi_link','custom'].includes(systemType)) return ['spherical','revolute'];
    if(['trailing_arm','semi_trailing_arm','torsion_beam','parallelogram'].includes(systemType)) return ['revolute','revolute'];
  }
  if(lt === 'pivot' && systemType === 'pendulum_axle') return ['revolute', null];
  return [null, null];
}
function quatRotate(q, v){
  const n = Math.hypot(q[0],q[1],q[2],q[3]) || 1, u = [q[0]/n,q[1]/n,q[2]/n], w = q[3]/n;
  const cr = (a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const c1 = cr(u,v), c2 = cr(u,c1);
  return [v[0]+2*(w*c1[0]+c2[0]), v[1]+2*(w*c1[1]+c2[1]), v[2]+2*(w*c1[2]+c2[2])];
}
function linkTopologyHtml(topo){
  const links = (topo?.links || []);
  if(!links.length) return '';
  const rows = links.map(l => {
    const [io, ii] = inferJointTypes(topo.system_type, l.type);
    const part = (v, inf, lab) => v ? `${lab}: ${escHtml(v)}` : (inf ? `<span style="color:var(--txD)" title="inferred from system_type">${lab}: ${escHtml(inf)}*</span>` : `<span style="color:var(--txD)">${lab}: ?</span>`);
    return `<div class="kv-row" style="padding:2px 0"><span class="kv-key" style="font-size:10px">${escHtml(l.name)}</span><span class="kv-val" style="font-size:10px">${part(l.joint_type,io,'out')} ${part(l.inboard_joint_type,ii,'in')}${l.body_ref?' body: '+escHtml(l.body_ref):''}</span></div>`;
  }).join('');
  return section('Link Topology (v0.96)', rows + '<div style="font-size:9px;color:var(--txD);margin-top:2px">* inferred from system_type · ? not inferable</div>');
}

function escHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function curveSpark(curve, w=96, h=34){
  const pts=(curve||[]).filter(p=>Array.isArray(p)&&isFinite(p[0])&&isFinite(p[1]));
  if(pts.length<2) return '';
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const X=x=>2+(x1>x0?(x-x0)/(x1-x0):0.5)*(w-4), Y=y=>h-2-(y1>y0?(y-y0)/(y1-y0):0.5)*(h-4);
  const d=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  return `<svg width="${w}" height="${h}" style="flex:none"><path d="${d}" fill="none" stroke="var(--ac)" stroke-width="1.5"/>`+
    pts.map(p=>`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="1.6" fill="var(--ac)"/>`).join('')+
    `<title>x ${x0}…${x1}, y ${y0}…${y1}</title></svg>`;
}

function lockControlHtml(lc, who){
  const chains=Array.isArray(lc)?lc:(lc&&typeof lc==='object'?[lc]:[]);
  return chains.map(ch=>{
    const stages=(ch.stages||[]).map((st,i)=>{
      const extra=[st.filter_time_constant>0?`τ ${st.filter_time_constant}s`:'', st.min!=null?`min ${st.min}`:'', st.max!=null?`max ${st.max}`:''].filter(Boolean).join(' · ');
      return `<div style="display:flex;align-items:center;gap:8px;margin:3px 0">${curveSpark(st.curve)}
        <div style="font-size:10px;line-height:1.4"><b>${i+1}. ${escHtml(st.input)}</b> <span style="color:var(--txD)">${st.combine==='add'?'+ add':'× multiply'}</span>${extra?`<br><span style="color:var(--txD)">${escHtml(extra)}</span>`:''}</div></div>`;
    }).join('');
    return `<div style="margin:4px 0 8px"><div style="font-size:10px;margin-bottom:2px">${tag('lock_control → '+escHtml(ch.target||'?'),'var(--pr)')} <span style="color:var(--txD)">${escHtml(who)}</span></div>${stages||'<div style="font-size:10px;color:var(--txD)">no stages</div>'}</div>`;
  }).join('');
}

function drivetrainControlHtml(pt){
  const tc=pt.transfer_case; let h='';
  if(tc){
    const cp=tc.coupling;
    h+=section('Transfer Case',
      kvGrid(tc,['type','ratio_high','ratio_low'])+
      (Array.isArray(tc.torque_split)?`<div class="kv-grid"><div class="kv-row"><span class="kv-key">torque_split F/R</span><span class="kv-val">${tc.torque_split.map(v=>(v*100).toFixed(0)).join(' / ')} %</span></div></div>`:'')+
      (cp?`<div style="font-size:10px;margin-top:4px">${tag('coupling'+(cp.mechanism?' · '+escHtml(cp.mechanism):''),'var(--gn)')}</div>`+kvGrid(cp,['ramp_torque','max_torque']):''));
    if(tc.center_diff){
      const cd=tc.center_diff;
      h+=section('Centre Differential',kvGrid(cd,['type','preload','lock_power','lock_coast'])+lockControlHtml(cd.lock_control,'centre diff'));
    }
  }
  (pt.differentials||[]).forEach(d=>{
    if(d.lock_control) h+=section('Lock Control — '+escHtml(d.id||d.location||'diff'),lockControlHtml(d.lock_control,d.id||''));
  });
  return h;
}

      ${editStat('Final Drive','powertrain.differentials.'+_dfi+'.final_drive','',3)}

function renderTires(el, data) {
  const t = data.tires;
  if(!t || !t.sets) { el.innerHTML='<div style="color:var(--txD)">No tire data</div>'; return; }
  let h = '';
  const sets = t.sets;
  const setKeys = Object.keys(sets);
  h += '<div class="flex-wrap mb8">' + setKeys.map(k => tag(k, 'var(--bl)')).join(' ') + '</div>';
  setKeys.forEach(key => {
    const s = sets[key];
    const dims = s.dimensions || {};
    const constr = s.construction || {};
    const ref = s.reference || {};
    const pac = s.pacejka || (s.models?.pacejka_mf52 ? {
      lateral: s.models.pacejka_mf52.pure_slip_lateral,
      longitudinal: s.models.pacejka_mf52.pure_slip_longitudinal,
      aligning: s.models.pacejka_mf52.aligning || s.models.pacejka_mf52.self_aligning,
      combined: s.models.pacejka_mf52.combined_slip,
      model: s.models.pacejka_mf52.version || 'MF 5.2'
    } : null);
    if(pac && !ref.load && s.models?.pacejka_mf52?.reference_load_N) ref.load = s.models.pacejka_mf52.reference_load_N;
    const therm = s.thermal || {};
    const wear = s.wear || {};
    h += '<div class="section-title">' + key + '</div>';
    if(s.description) h += '<div style="font-size:10px;color:var(--txD);margin-bottom:6px">' + s.description + '</div>';
    if(s.size_code) h += '<div class="mb6">' + tag(s.size_code, 'var(--gn)') + (pac?.model ? ' ' + tag(pac.model, 'var(--pr)') : '') + '</div>';
    if(Object.keys(dims).length) {
      h += '<div class="grid2 mb8">';
      if(dims.section_width) h += stat('Width', fmtN(dims.section_width*1000,0), 'mm');
      if(dims.aspect_ratio) h += stat('Aspect', fmtN(dims.aspect_ratio*100,0), '%');
      if(dims.overall_diameter) h += stat('OD', fmtN(dims.overall_diameter*1000,0), 'mm');
      if(dims.tread_width) h += stat('Tread W', fmtN(dims.tread_width*1000,0), 'mm');
      h += '</div>';
    }
    if(constr.mass || constr.vertical_stiffness) {
      h += '<div class="grid2 mb8">';
      if(constr.mass) h += stat('Tire Mass', fmtN(constr.mass,1), 'kg');
      if(constr.vertical_stiffness) h += stat('Vert K', fmtN(constr.vertical_stiffness,0), 'N/m');
      if(constr.lateral_stiffness) h += stat('Lat K', fmtN(constr.lateral_stiffness,0), 'N/m');
      if(constr.rolling_radius) h += stat('Roll R', fmtN(constr.rolling_radius,3), 'm');
      h += '</div>';
    }
    if(ref.load || ref.pressure) {
      h += '<div class="grid2 mb8">';
      if(ref.load) h += stat('Ref Load', fmtN(ref.load,0), 'N');
      if(ref.pressure) h += stat('Ref Press', fmtN(ref.pressure/1000,0), 'kPa');
      h += '</div>';
    }
    if(pac) {
      const lat = pac.lateral || {};
      const lon = pac.longitudinal || {};
      h += '<div class="section-title" style="color:var(--pr)">Pacejka ' + (pac.model||'') + '</div>';
      h += '<div class="grid2 mb8">';
      if(lat.pCy1!=null) h += stat('pCy1', fmtN(lat.pCy1,4));
      if(lat.pDy1!=null) h += stat('pDy1', fmtN(lat.pDy1,4));
      if(lat.pKy1!=null) h += stat('pKy1', fmtN(lat.pKy1,2));
      if(lon.pCx1!=null) h += stat('pCx1', fmtN(lon.pCx1,4));
      if(lon.pDx1!=null) h += stat('pDx1', fmtN(lon.pDx1,4));
      if(lon.pKx1!=null) h += stat('pKx1', fmtN(lon.pKx1,2));
      h += '</div>';
      const algCoeffs = pac.aligning || {};
      if(lat.pHy1!=null || lat.pVy1!=null || algCoeffs.qBz1!=null) {
        h += '<div class="section-title" style="color:var(--tl);font-size:11px;margin-top:4px">MF 6.2 Extensions</div>';
        h += '<div class="grid2 mb8" style="font-size:10px">';
        if(lat.pHy1!=null) h += stat('pHy1 (shift)', fmtN(lat.pHy1,4));
        if(lat.pVy1!=null) h += stat('pVy1 (vert)', fmtN(lat.pVy1,4));
        if(lon.pHx1!=null) h += stat('pHx1 (shift)', fmtN(lon.pHx1,5));
        if(algCoeffs.qBz1!=null) h += stat('qBz1 (trail)', fmtN(algCoeffs.qBz1,3));
        if(algCoeffs.qCz1!=null) h += stat('qCz1', fmtN(algCoeffs.qCz1,3));
        if(algCoeffs.qDz1!=null) h += stat('qDz1', fmtN(algCoeffs.qDz1,3));
        h += '</div>';
      }

      // --- Pacejka MF6.2 Full Evaluation ---
      // Auto-detect: if pHy1 or pVy1 exist, use MF6.2; else fallback to MF52
      const hasMF62 = (lat.pHy1!=null || lat.pVy1!=null || lon.pHx1!=null);
      const modelLabel = hasMF62 ? 'MF 6.2' : (pac.model||'MF52');
      
      // === Helper: MF6.2 Lateral Force Fy ===
      function evalFy62(alpha_rad, Fz_val, gamma_rad, lat, Fz0) {
        const dfz = (Fz_val - Fz0) / Fz0;
        const g = gamma_rad || 0;
        // Horizontal shift
        const SHy = ((lat.pHy1||0) + (lat.pHy2||0) * dfz) + (lat.pHy3||0) * g;
        const ay = alpha_rad + SHy;
        // Stiffness
        const Ky = Fz_val * (lat.pKy1||0) * Math.sin(2 * Math.atan(Fz_val / ((lat.pKy2||1) * Fz0 + 0.001)))
                   * (1 - (lat.pKy3||0) * Math.abs(g));
        // Peak
        const Dy = Fz_val * ((lat.pDy1||0) + (lat.pDy2||0) * dfz)
                   * (1 + (lat.pDy3||0) * g * g);
        const Cy = lat.pCy1 || 1.3;
        const By = Ky / (Cy * Dy + 0.001);
        // Curvature
        const Ey = ((lat.pEy1||0) + (lat.pEy2||0) * dfz)
                   * (1 + ((lat.pEy3||0) + (lat.pEy4||0) * g) * (ay >= 0 ? 1 : -1));
        const Ey_c = Math.min(Ey, 1); // clamp
        // Vertical shift
        const SVy = Fz_val * ((lat.pVy1||0) + (lat.pVy2||0) * dfz)
                    + ((lat.pVy3||0) + (lat.pVy4||0) * dfz) * g;
        // Magic Formula
        const Fy0 = Dy * Math.sin(Cy * Math.atan(By * ay - Ey_c * (By * ay - Math.atan(By * ay)))) + SVy;
        return Fy0;
      }

      // === Helper: MF6.2 Longitudinal Force Fx ===
      function evalFx62(kappa, Fz_val, gamma_rad, lon, Fz0) {
        const dfz = (Fz_val - Fz0) / Fz0;
        const g = gamma_rad || 0;
        // Horizontal shift
        const SHx = (lon.pHx1||0) + (lon.pHx2||0) * dfz;
        const kx = kappa + SHx;
        // Peak
        const Dx = Fz_val * ((lon.pDx1||0) + (lon.pDx2||0) * dfz)
                   * (1 + (lon.pDx3||0) * g * g);
        const Cx = lon.pCx1 || 1.5;
        const Kx = Fz_val * ((lon.pKx1||0) + (lon.pKx2||0) * dfz)
                   * Math.exp((lon.pKx3||0) * dfz);
        const Bx = Kx / (Cx * Dx + 0.001);
        // Curvature
        const Ex = ((lon.pEx1||0) + (lon.pEx2||0) * dfz)
                   + ((lon.pEx3||0) + (lon.pEx4||0) * dfz) * (kx >= 0 ? 1 : -1);
        const Ex_c = Math.min(Ex, 1);
        // Vertical shift
        const SVx = Fz_val * ((lon.pVx1||0) + (lon.pVx2||0) * dfz);
        const Fx0 = Dx * Math.sin(Cx * Math.atan(Bx * kx - Ex_c * (Bx * kx - Math.atan(Bx * kx)))) + SVx;
        return Fx0;
      }

      // === Helper: MF6.2 Self-Aligning Torque Mz ===
      function evalMz62(alpha_rad, Fz_val, gamma_rad, lat, alg, Fz0) {
        if(!alg || alg.qBz1==null) return 0;
        const dfz = (Fz_val - Fz0) / Fz0;
        const g = gamma_rad || 0;
        // Horizontal shift for trail
        const SHt = (alg.qHz1||0) + (alg.qHz2||0) * dfz + ((alg.qHz3||0) + (alg.qHz4||0) * dfz) * g;
        const at = alpha_rad + SHt;
        // Pneumatic trail t(alpha)
        const Bt = ((alg.qBz1||0) + (alg.qBz2||0) * dfz + (alg.qBz3||0) * dfz * dfz)
                   * (1 + (alg.qBz4||0) * g + (alg.qBz5||0) * Math.abs(g));
        const Ct = alg.qCz1 || 1.0;
        const R0 = 0.298; // loaded radius approx
        const Dt = Fz_val * ((alg.qDz1||0) + (alg.qDz2||0) * dfz) * R0
                   * (1 + (alg.qDz3||0) * g + (alg.qDz4||0) * g * g);
        const Et = ((alg.qEz1||0) + (alg.qEz2||0) * dfz + (alg.qEz3||0) * dfz * dfz)
                   * (1 + ((alg.qEz4||0) + (alg.qEz5||0) * g) * (2/Math.PI) * Math.atan(Bt * Ct * at));
        const Et_c = Math.min(Et, 1);
        const t0 = Dt * Math.cos(Ct * Math.atan(Bt * at - Et_c * (Bt * at - Math.atan(Bt * at))));
        // Residual moment Mzr
        const SHf = SHt; // use same shift
        const af = alpha_rad + SHf;
        const Br = ((alg.qBz9||0) + (alg.qBz10||0) * dfz) * (lat.pKy1||0) * Fz_val
                   * Math.sin(2 * Math.atan(Fz_val / ((lat.pKy2||1) * Fz0 + 0.001))) / (Ct * Dt + 0.001);
        const Dr = Fz_val * R0 * ((alg.qDz6||0) + (alg.qDz7||0) * dfz + ((alg.qDz8||0) + (alg.qDz9||0) * dfz) * g);
        const Mzr = Dr * Math.cos(Math.atan(Br * af));
        // Fy for Mz calculation
        const Fy0 = evalFy62(alpha_rad, Fz_val, gamma_rad, lat, Fz0);
        const Mz = -t0 * Fy0 + Mzr;
        return Mz;
      }

      // --- Chart: Fy vs Slip Angle (MF6.2) ---
      if(lat.pCy1!=null && lat.pDy1!=null && lat.pKy1!=null) {
        const Fz0 = ref.load || 3000;
        const fyData = [];
        for(let a = -15; a <= 15; a += 0.5) {
          const aRad = a * Math.PI / 180;
          fyData.push([a, evalFy62(aRad, Fz0, 0, lat, Fz0)]);
        }
        const fyId = 'pac-fy-' + Math.random().toString(36).slice(2,8);
        h += chartHtml(fyId, 'Fy vs Slip Angle @ Fz=' + (Fz0/1000).toFixed(1) + 'kN (' + modelLabel + ')', [{name:'Fy (N)', data:fyData}], 170);
        setTimeout(function(){ drawChart(fyId, [{name:'Fy (N)', data:fyData}]); }, 30);

        // Multi-load Fy: 50%, 100%, 150% Fz
        const fyMulti = [];
        [0.5, 1.0, 1.5].forEach(function(mult) {
          var Fzi = Fz0 * mult;
          var pts = [];
          for(var a2 = 0; a2 <= 15; a2 += 0.5) {
            var ar = a2 * Math.PI / 180;
            pts.push([a2, Math.abs(evalFy62(ar, Fzi, 0, lat, Fz0))]);
          }
          fyMulti.push({name: (Fzi/1000).toFixed(1) + 'kN', data: pts});
        });
        const fymId = 'pac-fym-' + Math.random().toString(36).slice(2,8);
        h += chartHtml(fymId, '|Fy| vs |' + 'α' + '| — load sensitivity (' + modelLabel + ')', fyMulti, 160);
        setTimeout(function(){ drawChart(fymId, fyMulti); }, 35);

        // Camber sweep: Fy at 0, -1, -2, -3 deg camber
        if(lat.pDy3!=null) {
          const fyCamber = [];
          [-3, -2, -1, 0].forEach(function(gDeg) {
            var gRad = gDeg * Math.PI / 180;
            var pts = [];
            for(var ac = 0; ac <= 15; ac += 0.5) {
              var ar = ac * Math.PI / 180;
              pts.push([ac, Math.abs(evalFy62(ar, Fz0, gRad, lat, Fz0))]);
            }
            fyCamber.push({name: gDeg + '° camber', data: pts});
          });
          const fcId = 'pac-fcam-' + Math.random().toString(36).slice(2,8);
          h += chartHtml(fcId, '|Fy| vs |' + 'α' + '| — camber sweep @ ' + (Fz0/1000).toFixed(1) + 'kN', fyCamber, 160);
          setTimeout(function(){ drawChart(fcId, fyCamber); }, 40);
        }
      }

      // --- Chart: Fx vs Slip Ratio (MF6.2) ---
      if(lon.pCx1!=null && lon.pDx1!=null && lon.pKx1!=null) {
        const Fz0 = ref.load || 3000;
        const fxData = [];
        for(let k = -30; k <= 30; k += 1) {
          const kk = k / 100;
          fxData.push([k, evalFx62(kk, Fz0, 0, lon, Fz0)]);
        }
        const fxId = 'pac-fx-' + Math.random().toString(36).slice(2,8);
        h += chartHtml(fxId, 'Fx vs Slip Ratio @ Fz=' + (Fz0/1000).toFixed(1) + 'kN (' + modelLabel + ')', [{name:'Fx (N)', data:fxData}], 170);
        setTimeout(function(){ drawChart(fxId, [{name:'Fx (N)', data:fxData}]); }, 30);
      }

      // --- Chart: Self-Aligning Torque Mz (MF6.2) ---
      const alg = pac.aligning || {};
      if(alg.qBz1!=null && lat.pCy1!=null) {
        const Fz0 = ref.load || 3000;
        const mzData = [];
        for(let a = -15; a <= 15; a += 0.5) {
          const aRad = a * Math.PI / 180;
          mzData.push([a, evalMz62(aRad, Fz0, 0, lat, alg, Fz0)]);
        }
        const mzId = 'pac-mz-' + Math.random().toString(36).slice(2,8);
        h += chartHtml(mzId, 'Mz vs Slip Angle @ Fz=' + (Fz0/1000).toFixed(1) + 'kN', [{name:'Mz (Nm)', data:mzData}], 170);
        setTimeout(function(){ drawChart(mzId, [{name:'Mz (Nm)', data:mzData}]); }, 45);

        // Multi-load Mz
        const mzMulti = [];
        [0.5, 1.0, 1.5].forEach(function(mult) {
          var Fzi = Fz0 * mult;
          var pts = [];
          for(var a2 = -15; a2 <= 15; a2 += 0.5) {
            var ar = a2 * Math.PI / 180;
            pts.push([a2, evalMz62(ar, Fzi, 0, lat, alg, Fz0)]);
          }
          mzMulti.push({name: (Fzi/1000).toFixed(1) + 'kN', data: pts});
        });
        const mzmId = 'pac-mzm-' + Math.random().toString(36).slice(2,8);
        h += chartHtml(mzmId, 'Mz vs ' + 'α' + ' — load sensitivity', mzMulti, 160);
        setTimeout(function(){ drawChart(mzmId, mzMulti); }, 50);
      }
    }
    if(therm.optimal_temperature || therm.mu_temperature_curve) {
      h += '<div class="section-title" style="color:var(--yl)">Thermal</div>';
      if(therm.optimal_temperature) h += '<div class="mb6">' + stat('Optimal T', fmtN(therm.optimal_temperature,0), '\u00b0C', 'var(--yl)') + '</div>';
      if(therm.mu_temperature_curve) {
        const tid = 'tire-mu-'+Math.random().toString(36).slice(2,8);
        h += chartHtml(tid, 'Grip vs Temperature', [{name:'\u00b5 mult.', data:therm.mu_temperature_curve}], 120);
        setTimeout(()=>drawChart(tid, [{name:'\u00b5 mult.', data:therm.mu_temperature_curve}]), 20);
      }
    }
    if(wear.mu_wear_curve) {
      const wid = 'tire-wear-'+Math.random().toString(36).slice(2,8);
      h += chartHtml(wid, 'Grip vs Wear', [{name:'\u00b5 mult.', data:wear.mu_wear_curve}], 120);
      setTimeout(()=>drawChart(wid, [{name:'\u00b5 mult.', data:wear.mu_wear_curve}]), 20);
    }
  });
  el.innerHTML = h;
}

function renderAero(el, data) {
  const a=data.aerodynamics;if(!a){el.innerHTML='No aero data';return;}
  const c=a.coefficients||{};const ref=a.reference||{};
  const dragId='drag-'+Math.random().toString(36).slice(2,8);
  const dragData = c.Cd&&ref.frontal_area ? Array.from({length:16},(_,i)=>{const v=(i+1)*15;const ms=v/3.6;return[v,0.5*1.225*ms*ms*c.Cd*ref.frontal_area];}) : null;
  const cop = a.center_of_pressure;
  const maps = a.maps || {};
  const cdYawId = 'cd-yaw-'+Math.random().toString(36).slice(2,8);
  el.innerHTML=`
    <div class="grid3 mb8">
      ${stat('Cd',fmtN(c.Cd,3),'','var(--ac)')}
      ${stat('Cl',fmtN(c.Cl,3),'','var(--bl)')}
      ${stat('CdA',fmtN(c.Cd&&ref.frontal_area?c.Cd*ref.frontal_area:null,3),'m\u00b2')}
    </div>
    <div class="grid2 mb8">
      ${stat('Cl Front',fmtN(c.Cl_front,3))}
      ${stat('Cl Rear',fmtN(c.Cl_rear,3))}
      ${ref.frontal_area?stat('Frontal A',fmtN(ref.frontal_area,2),'m\u00b2'):''}
      ${c.Cpm!=null?stat('Cpm',fmtN(c.Cpm,4)):''}
    </div>
    ${cop?section('Center of Pressure','<div class="grid3">'+stat('X',fmtN(cop[0],3),'m')+stat('Y',fmtN(cop[1],3),'m')+stat('Z',fmtN(cop[2],3),'m')+'</div>'):''}
    ${dragData?chartHtml(dragId,'Drag Force vs Speed',[{name:'Drag (N)',data:dragData}],150):''}
    ${maps.Cd_vs_yaw?chartHtml(cdYawId,'Cd vs Yaw Angle',[{name:'Cd',data:maps.Cd_vs_yaw}],130):''}
    ${(a.components&&a.components.length)?'<div class="section-title" style="color:var(--tl)">Aero Components</div>'+a.components.map(function(comp){return '<div class="kv-row" style="padding:3px 0"><span class="kv-key">'+(comp.id||comp.type||'?')+'</span><span class="kv-val" style="font-size:10px">'+(comp.type?comp.type+' · ':'')+'Cd: '+(comp.Cd_contribution!=null?comp.Cd_contribution:'?')+' Cl: '+(comp.Cl_contribution!=null?comp.Cl_contribution:'?')+(comp.adjustable?' · adj':'')+'</span></div>';}).join(''):''}
    ${a.active_systems&&Object.keys(a.active_systems).length?'<div class="section-title" style="color:var(--yl)">Active Systems</div><div class="grid2">'+Object.entries(a.active_systems).map(function(e){return '<div class="kv-row"><span class="kv-key">'+e[0]+'</span><span class="kv-val">'+JSON.stringify(e[1]).slice(0,60)+'</span></div>';}).join('')+'</div>':''}
  `;

}

function buildLayerUI() {

  list.innerHTML = layerDefs.map(l => {
    let extra = '';

  }).join('') +
  ((DATA?.axles||[]).some(a=>a.liftable) ? `<div class="layer-row" id="lift-toggle" title="Liftable axles drawn raised by axles[].lift.travel"><div class="layer-dot" style="background:${liftRaised?'#f0b429':'#f0b42930'};border:1px solid #f0b42940"></div><span style="color:${liftRaised?'var(--tx)':'var(--txM)'}">Lift axles raised</span></div>` : '') +
